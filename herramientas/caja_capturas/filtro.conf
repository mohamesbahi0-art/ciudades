# El filtro de red de la caja del Investigador de webs (squid, contenedor «caja-filtro»).
# La caja va en una red de Docker sin salida (--internal) y solo puede hablar con este filtro, que corta:
#  - las webs vetadas y todos sus subdominios (listas/vetados.txt: TikTok, Instagram, YouTube, las redes, las páginas
#    de entrar, PyPI, npm… y las propias del dueño, que solo van en el repositorio privado);
#  - los nombres con una parte de entrar (login., accounts., auth., sso.…) o que empiezan por una marca prohibida en
#    cualquier país (tiktok…, instagram…, google…) (listas/vetados_re.txt);
#  - las direcciones IP escritas a mano y cualquier destino de la red de la máquina (IP privadas, 169.254.169.254, la
#    de Azure, localhost);
#  - cualquier puerto que no sea el 80 o el 443;
#  - y, dentro de cada túnel https, el nombre que el programa dice de verdad (SNI): se mira sin descifrar nada (peek) y
#    si es de una web vetada se corta (terminate). Así no vale pedir un nombre inocente (1-2-3-4.sslip.io, o un
#    subdominio de la propia web que apunte a otra IP) y hablar luego con TikTok o con una página de entrar. Un túnel
#    sin nombre dentro no se puede mirar: queda en el registro como «TCP_TUNNEL … -» y turno.py tira esa captura.
# Lo demás pasa: la web pedida, sus recursos y la API del modelo gratis de OpenCode (acl modelo). Las listas las escribe
# herramientas/caja_capturas/turno.py preparar en cada turno. El registro (con el SNI de cada túnel) lo lee turno.py
# capturar al acabar, desde fuera de la caja: la IA no lo alcanza.
http_port 3128 ssl-bump tls-cert=/etc/squid/caja.pem generate-host-certificates=off
pid_filename none
coredump_dir /var/spool/squid
cache deny all
cache_mem 8 MB
logformat registro %ts %Ss/%03>Hs %rm %ru %ssl::>sni
access_log stdio:/var/log/squid/access.log logformat=registro
cache_log stdio:/dev/stderr
logfile_rotate 0
via off
forwarded_for delete
httpd_suppress_version_string on
max_filedescriptors 4096
connect_timeout 20 seconds
request_timeout 30 seconds
read_timeout 2 minutes
client_lifetime 30 minutes
shutdown_lifetime 1 seconds

acl caja src 172.30.99.0/24
acl puertos_web port 80 443
acl puerto_seguro port 443
acl CONNECT method CONNECT
acl ip_directa dstdom_regex -n ^[0-9.]+$ ^\[?[0-9a-fA-F:]+\]?$
# El modelo gratis de OpenCode (su API y su catálogo) pasa aunque opencode.ai esté vetado para capturar: exactamente
# estos nombres y solo por https (el navegador que fuera allí se ve luego en la grabación y la captura se tira)
acl modelo dstdomain opencode.ai models.opencode.ai models.dev
acl vetados dstdomain "/etc/squid/listas/vetados.txt"
acl vetados_re dstdom_regex -n -i "/etc/squid/listas/vetados_re.txt"
acl privadas dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24
acl privadas dst 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/3
acl privadas dst 168.63.129.16/32 ::/128 ::1/128 fc00::/7 fe80::/10

http_access deny !caja
http_access deny !puertos_web
http_access deny CONNECT !puerto_seguro
http_access deny ip_directa
http_access allow CONNECT modelo !privadas
http_access deny vetados
http_access deny vetados_re
http_access deny privadas
http_access allow caja
http_access deny all
icp_access deny all

# El nombre de dentro del túnel (SNI): se mira y, si es de una web vetada, se corta. El certificado es desechable (se
# hace al construir la imagen) y no se usa para descifrar: solo mira (peek) y deja pasar (splice) o corta (terminate).
acl paso1 at_step SslBump1
acl sni_modelo ssl::server_name opencode.ai models.opencode.ai models.dev
acl sni_vetado ssl::server_name "/etc/squid/listas/vetados.txt"
acl sni_vetado_re ssl::server_name_regex -i "/etc/squid/listas/vetados_re.txt"
ssl_bump peek paso1
ssl_bump splice sni_modelo
ssl_bump terminate sni_vetado
ssl_bump terminate sni_vetado_re
ssl_bump splice all
