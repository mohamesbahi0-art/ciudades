<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- El Narrador: el muñeco que cuenta las biografías encima de las fotos (pidió el dueño el 26 nov). Mueve la boca con
     la voz, parpadea, pone caras (enfadado, sorprendido, contento, serio, triste, pensativo) y gesticula con los brazos.
     Fondo transparente: narrador.js hace una captura por fotograma y el montador lo pone abajo a la izquierda. -->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="s" width="460" height="580" viewBox="0 0 460 580" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const W = 460, H = 580;
const PIEL = "#F2C29B", PIEL_SOMBRA = "#DDA57D", PELO = "#2B1D14", SUDADERA = "#FF7A1A", SUDADERA_OSC = "#D85F07",
      CONTORNO = "#1A1A1A";
const lim = (x, a, b) => Math.max(a, Math.min(b, x));
const mezcla = (a, b, k) => a + (b - a) * k;

// Cómo es cada cara: cejas (altura y giro), ojos (tamaño), boca (curva y forma) y brazos.
const CARAS = {
  serio:       { cejaY: 0,   cejaGiro: 0,   ojo: 1.0,  sonrisa: 0,    brazos: "abajo",    mejillas: 0 },
  enfadado:    { cejaY: 6,   cejaGiro: 22,  ojo: 0.85, sonrisa: -0.6, brazos: "puno",     mejillas: 0.55 },
  sorprendido: { cejaY: -16, cejaGiro: -6,  ojo: 1.3,  sonrisa: 0,    brazos: "arriba",   mejillas: 0, o: true },
  contento:    { cejaY: -6,  cejaGiro: -8,  ojo: 1.0,  sonrisa: 0.9,  brazos: "senala",   mejillas: 0.3 },
  triste:      { cejaY: -4,  cejaGiro: -20, ojo: 0.95, sonrisa: -0.8, brazos: "abajo",    mejillas: 0 },
  pensativo:   { cejaY: -4,  cejaGiro: 10,  ojo: 1.0,  sonrisa: -0.15, brazos: "barbilla", mejillas: 0, una: true },
};

function cara(t) {
  const tramos = (window.GUION && GUION.tramos) || [];
  let actual = tramos.find(x => t >= x.desde && t < x.hasta) || tramos[tramos.length - 1] || { emocion: "serio", desde: 0 };
  return { c: CARAS[actual.emocion] || CARAS.serio, desde: actual.desde || 0, emocion: actual.emocion };
}

function boca(t) {           // de 0 (cerrada) a 1 (muy abierta), siguiendo las palabras de la voz
  const p = (window.GUION && GUION.palabras) || [];
  for (const w of p) {
    if (t >= w.i - 0.02 && t <= w.f + 0.02) return 0.3 + 0.7 * Math.abs(Math.sin((t - w.i) * Math.PI * 6.5));
  }
  return 0;
}

function parpadeo(t) {
  const ciclo = t % 3.7;
  return ciclo > 3.55 ? 0.12 : 1;
}

function brazo(x0, y0, ang1, ang2, largo = 92, mano = true) {
  const r = Math.PI / 180;
  const x1 = x0 + Math.cos(ang1 * r) * largo, y1 = y0 + Math.sin(ang1 * r) * largo;
  const x2 = x1 + Math.cos(ang2 * r) * largo * 0.9, y2 = y1 + Math.sin(ang2 * r) * largo * 0.9;
  let s = `<path d="M${x0} ${y0} L${x1} ${y1} L${x2} ${y2}" stroke="${CONTORNO}" stroke-width="44" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  s += `<path d="M${x0} ${y0} L${x1} ${y1} L${x2} ${y2}" stroke="${SUDADERA}" stroke-width="34" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (mano) s += `<circle cx="${x2}" cy="${y2}" r="22" fill="${PIEL}" stroke="${CONTORNO}" stroke-width="5"/>`;
  return s;
}

window.pintar = function (t) {
  const { c, desde } = cara(t);
  const dt = t - desde;
  const golpe = 1 + 0.07 * Math.exp(-dt * 7);                  // al cambiar de cara, un pequeño «salto»
  const b = boca(t);
  const habla = b > 0 ? 1 : 0;
  const bote = Math.sin(t * 9) * 3 * habla;                       // la cabeza se mueve un poco al hablar
  const sacude = c === CARAS.enfadado ? Math.sin(t * 22) * 3 * habla : 0;
  const inclina = c === CARAS.triste ? -6 : c === CARAS.pensativo ? 5 : 0;
  const cx = 230, cy = 205 + bote;

  let s = `<g transform="translate(${cx} ${H}) scale(${golpe}) translate(${-cx} ${-H})">`;
  // cuerpo (sudadera)
  s += `<path d="M95 580 Q100 400 230 385 Q360 400 365 580 Z" fill="${SUDADERA}" stroke="${CONTORNO}" stroke-width="7"/>`;
  s += `<path d="M190 392 Q230 430 270 392" fill="none" stroke="${SUDADERA_OSC}" stroke-width="10" stroke-linecap="round"/>`;
  // brazos según la cara
  const lx = 128, rx = 332, by = 440;
  const mueve = Math.sin(t * 14) * 12 * habla;
  if (c.brazos === "abajo") { s += brazo(lx, by, 110, 95) + brazo(rx, by, 70, 85); }
  else if (c.brazos === "puno") { s += brazo(lx, by, 110, 95) + brazo(rx, by, -20, -95 + mueve); }
  else if (c.brazos === "arriba") { s += brazo(lx, by, -150, -110 + mueve * 0.4) + brazo(rx, by, -30, -70 - mueve * 0.4); }
  else if (c.brazos === "senala") { s += brazo(lx, by, 110, 95) + brazo(rx, by, -35, -60 + mueve * 0.3); }
  else if (c.brazos === "barbilla") { s += brazo(lx, by, 110, 95) + brazo(rx, by, 160, -115, 88); }
  // cuello y cabeza
  s += `<g transform="rotate(${inclina + sacude} ${cx} ${cy + 120})">`;
  s += `<rect x="205" y="${cy + 95}" width="50" height="50" fill="${PIEL_SOMBRA}"/>`;
  s += `<ellipse cx="${cx}" cy="${cy}" rx="122" ry="132" fill="${PIEL}" stroke="${CONTORNO}" stroke-width="7"/>`;
  // orejas
  s += `<ellipse cx="${cx - 122}" cy="${cy + 10}" rx="18" ry="28" fill="${PIEL}" stroke="${CONTORNO}" stroke-width="6"/>`;
  s += `<ellipse cx="${cx + 122}" cy="${cy + 10}" rx="18" ry="28" fill="${PIEL}" stroke="${CONTORNO}" stroke-width="6"/>`;
  // pelo
  s += `<path d="M${cx - 124} ${cy - 20} Q${cx - 130} ${cy - 150} ${cx} ${cy - 140} Q${cx + 135} ${cy - 150} ${cx + 124} ${cy - 25}
        Q${cx + 95} ${cy - 85} ${cx + 30} ${cy - 80} Q${cx - 40} ${cy - 105} ${cx - 124} ${cy - 20} Z" fill="${PELO}" stroke="${CONTORNO}" stroke-width="6"/>`;
  // mejillas
  if (c.mejillas) {
    const rojo = c === CARAS.enfadado ? "#E5484D" : "#FF8A80";
    s += `<ellipse cx="${cx - 72}" cy="${cy + 42}" rx="24" ry="14" fill="${rojo}" opacity="${c.mejillas}"/>`;
    s += `<ellipse cx="${cx + 72}" cy="${cy + 42}" rx="24" ry="14" fill="${rojo}" opacity="${c.mejillas}"/>`;
  }
  // ojos
  const abre = parpadeo(t) * c.ojo;
  for (const lado of [-1, 1]) {
    const ox = cx + lado * 46, oy = cy - 8;
    s += `<ellipse cx="${ox}" cy="${oy}" rx="${24 * c.ojo}" ry="${28 * abre}" fill="#fff" stroke="${CONTORNO}" stroke-width="5"/>`;
    if (abre > 0.3) s += `<circle cx="${ox + 3}" cy="${oy + 3}" r="${11 * c.ojo}" fill="${CONTORNO}"/>`;
    // cejas
    const giro = -(c.una && lado === -1 ? 0 : c.cejaGiro) * lado;
    const ey = oy - 46 + c.cejaY + (c.una && lado === 1 ? -10 : 0);
    s += `<rect x="${ox - 30}" y="${ey}" width="60" height="13" rx="6" fill="${PELO}" transform="rotate(${giro} ${ox} ${ey + 6})"/>`;
  }
  // boca
  const my = cy + 62;
  if (c.o && b < 0.2) {
    s += `<ellipse cx="${cx}" cy="${my}" rx="16" ry="20" fill="#5A1A1A" stroke="${CONTORNO}" stroke-width="5"/>`;
  } else if (b > 0.05) {
    const alto = 10 + 34 * b, ancho = 46 - 10 * b + (c.o ? -12 : 0);
    const curva = c.sonrisa * 10;
    s += `<path d="M${cx - ancho} ${my - curva} Q${cx} ${my + alto + curva} ${cx + ancho} ${my - curva} Q${cx} ${my - 6 - curva * 0.3} ${cx - ancho} ${my - curva} Z"
          fill="#5A1A1A" stroke="${CONTORNO}" stroke-width="5"/>`;
    if (b > 0.45) s += `<ellipse cx="${cx}" cy="${my + alto * 0.55}" rx="${ancho * 0.45}" ry="${alto * 0.22}" fill="#E5737A"/>`;
  } else {
    const curva = c.sonrisa * 18;
    s += `<path d="M${cx - 40} ${my} Q${cx} ${my + curva} ${cx + 40} ${my}" fill="none" stroke="${CONTORNO}" stroke-width="7" stroke-linecap="round"/>`;
  }
  s += `</g></g>`;
  document.getElementById("s").innerHTML = s;
};
window.listo = true;
</script>
</body>
</html>
