<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Wist je dat</title>
<!-- «Ciencia» (Wist je dat): dibuja cada fotograma de los vídeos de curiosidades en neerlandés. Fondo oscuro con un
     resplandor de color, ilustración científica brillante, gráficas que se dibujan solas, etiquetas con línea y el texto
     arriba palabra a palabra con la palabra clave en recuadro. Lo usa render.js: window.GUION = guion;
     await window.listo; window.pintar(t) para cada fotograma. -->
<style>
@font-face{font-family:"Poppins";font-weight:300;src:url("fuentes/poppins-300.woff2") format("woff2")}
@font-face{font-family:"Poppins";font-weight:400;src:url("fuentes/poppins-400.woff2") format("woff2")}
@font-face{font-family:"Poppins";font-weight:600;src:url("fuentes/poppins-600.woff2") format("woff2")}
@font-face{font-family:"Poppins";font-weight:700;src:url("fuentes/poppins-700.woff2") format("woff2")}
@font-face{font-family:"Poppins";font-weight:800;src:url("fuentes/poppins-800.woff2") format("woff2")}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#05070C}
svg{display:block;font-family:"Poppins",sans-serif}
</style></head><body>
<svg id="v" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
  <radialGradient id="gPiel" cx="0.42" cy="0.36" r="0.75"><stop offset="0" stop-color="#FFE4D2"/><stop offset="0.55" stop-color="#F2B597"/><stop offset="1" stop-color="#C67F66"/></radialGradient>
  <radialGradient id="gBrein" cx="0.4" cy="0.32" r="0.78"><stop offset="0" stop-color="#FBCAD5"/><stop offset="0.6" stop-color="#E28AA0"/><stop offset="1" stop-color="#A44E68"/></radialGradient>
  <linearGradient id="gMaag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFA9BB"/><stop offset="1" stop-color="#C24E6D"/></linearGradient>
  <linearGradient id="gZuur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0FF9E"/><stop offset="1" stop-color="#8FCB33"/></linearGradient>
  <radialGradient id="gHart" cx="0.38" cy="0.35" r="0.8"><stop offset="0" stop-color="#FF8F8F"/><stop offset="0.55" stop-color="#D93249"/><stop offset="1" stop-color="#83142D"/></radialGradient>
  <radialGradient id="gIris" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0B1B2E"/><stop offset="0.35" stop-color="#2E8BC9"/><stop offset="0.8" stop-color="#7FD3F7"/><stop offset="1" stop-color="#1D4E7A"/></radialGradient>
  <radialGradient id="gSclera" cx="0.42" cy="0.38" r="0.7"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.75" stop-color="#E9EAF1"/><stop offset="1" stop-color="#B9BBCB"/></radialGradient>
  <radialGradient id="gLong" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#FFC0CA"/><stop offset="0.6" stop-color="#E5768C"/><stop offset="1" stop-color="#A3405A"/></radialGradient>
  <radialGradient id="gTand" cx="0.38" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#F2ECDF"/><stop offset="1" stop-color="#CFC2A6"/></radialGradient>
  <radialGradient id="gCel" cx="0.4" cy="0.38" r="0.7"><stop offset="0" stop-color="#9FF0E3" stop-opacity="0.5"/><stop offset="1" stop-color="#1E8F86" stop-opacity="0.22"/></radialGradient>
  <radialGradient id="gKern" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#C8B1FF"/><stop offset="1" stop-color="#5A2FC2"/></radialGradient>
  <radialGradient id="gOceaan" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#63B8FF"/><stop offset="0.6" stop-color="#1F5FC4"/><stop offset="1" stop-color="#0A2558"/></radialGradient>
  <radialGradient id="gMaan" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1F1F5"/><stop offset="0.65" stop-color="#A9ABB8"/><stop offset="1" stop-color="#5B5D6C"/></radialGradient>
  <radialGradient id="gZon" cx="0.45" cy="0.42" r="0.6"><stop offset="0" stop-color="#FFFBD6"/><stop offset="0.45" stop-color="#FFD24D"/><stop offset="1" stop-color="#FF7A1A"/></radialGradient>
  <linearGradient id="gWater" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#B5EEFF"/><stop offset="0.5" stop-color="#3399EE"/><stop offset="1" stop-color="#0D4AA3"/></linearGradient>
  <linearGradient id="gBlad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9BEA8E"/><stop offset="1" stop-color="#2A8E48"/></linearGradient>
  <linearGradient id="gPot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9875A"/><stop offset="1" stop-color="#9E4126"/></linearGradient>
  <linearGradient id="gMetaal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E3E8F2"/><stop offset="1" stop-color="#7A859D"/></linearGradient>
  <linearGradient id="gKaart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151B2A"/><stop offset="1" stop-color="#0A0E18"/></linearGradient>
  <radialGradient id="gKat" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#F3A85E"/><stop offset="0.7" stop-color="#C66F2B"/><stop offset="1" stop-color="#7E3F14"/></radialGradient>
  <radialGradient id="gVirus" cx="0.38" cy="0.34" r="0.75"><stop offset="0" stop-color="#FF9EAD"/><stop offset="0.65" stop-color="#D2405A"/><stop offset="1" stop-color="#7A1830"/></radialGradient>
  <linearGradient id="gPh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF4D4D"/><stop offset="0.2" stop-color="#FF9F43"/><stop offset="0.36" stop-color="#FACC15"/><stop offset="0.5" stop-color="#4ADE80"/><stop offset="0.68" stop-color="#38BDF8"/><stop offset="0.85" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
  <linearGradient id="gMeter" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ADE80"/><stop offset="0.5" stop-color="#FACC15"/><stop offset="1" stop-color="#FF5A5F"/></linearGradient>
  <radialGradient id="gStip"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="gVignet" cx="0.5" cy="0.48" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.7"/></radialGradient>
  <filter id="gloed" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="gloedSterk" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="b18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="b40" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="schaduw" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.6"/></filter>
</defs>
<g id="scene"></g>
</svg>
<script>
"use strict";
const W = 1080, H = 1920, R = Math.PI / 180;
const lim = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const tramo = (t, a, d) => lim((t - a) / d);
const suave = x => x * x * (3 - 2 * x);
const salida = x => 1 - Math.pow(1 - x, 3);
const muelle = x => { if (x <= 0) return 0; if (x >= 1) return 1; return 1 - Math.exp(-6 * x) * Math.cos(9 * x); };
const azar = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const f1 = n => Math.round(n * 10) / 10;
const f2 = n => Math.round(n * 100) / 100;
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const KLEUR = { blauw: "#4FC3F7", roze: "#FF6FA3", oranje: "#FF9F43", groen: "#4ADE80", paars: "#A78BFA", rood: "#FF5A5F",
  geel: "#FACC15", wit: "#FFFFFF", cyaan: "#5ED3F3" };
const kleur = n => KLEUR[n] || (typeof n === "string" && /^#[0-9a-f]{6}$/i.test(n) ? n : KLEUR.blauw);
let DEFS = {};
function gloedVan(c) {
  const k = "gl" + c.replace("#", "");
  if (!DEFS[k]) DEFS[k] = `<radialGradient id="${k}"><stop offset="0" stop-color="${c}" stop-opacity="0.42"/><stop offset="0.45" stop-color="${c}" stop-opacity="0.16"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;
  return `url(#${k})`;
}
const lienzo = document.createElement("canvas").getContext("2d");
function ancho(texto, peso, tam) { lienzo.font = `${peso} ${tam}px Poppins`; return lienzo.measureText(texto).width; }
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");

// =============================== ILUSTRACIONES (centradas en 0,0; unos ±300) ===============================
const ILU = {};

ILU.pie = (T) => {
  let s = `<g filter="url(#schaduw)"><path d="M -92 -150 C -152 -140 -176 -40 -162 52 C -150 132 -152 214 -82 254 C -12 290 70 256 88 182 C 100 122 106 70 122 2 C 142 -78 150 -150 96 -178 C 40 -200 -28 -166 -92 -150 Z" fill="url(#gPiel)"/></g>`;
  s += `<path d="M -70 -70 C -118 -14 -112 96 -62 170" stroke="#B26C55" stroke-width="44" fill="none" opacity="0.16" filter="url(#b18)"/>`;
  s += `<ellipse cx="-22" cy="196" rx="78" ry="48" fill="#FFF0E4" opacity="0.32" filter="url(#b18)"/>`;
  s += `<path d="M -112 -96 C -42 -116 38 -121 104 -106" stroke="#B26C55" stroke-width="3" fill="none" opacity="0.34"/>`;
  s += `<path d="M -104 -70 C -34 -86 30 -90 96 -80" stroke="#B26C55" stroke-width="2" fill="none" opacity="0.22"/>`;
  [[-90, -196, 43, 50], [-22, -222, 29, 33], [30, -218, 25, 29], [74, -202, 22, 25], [106, -176, 18, 21]].forEach(([x, y, rx, ry], i) => {
    s += `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#gPiel)" filter="url(#schaduw)"/>`;
    s += `<ellipse cx="${x - rx * 0.25}" cy="${y - ry * 0.3}" rx="${f1(rx * 0.42)}" ry="${f1(ry * 0.3)}" fill="#FFF4EC" opacity="0.55"/>`;
  });
  return s;
};

ILU.pluma = (T) => {
  const g = Math.sin(T * 7) * 6;
  let s = `<g transform="rotate(${f1(-32 + g)})"><path d="M 0 175 C 6 60 4 -60 -6 -180" stroke="#F4F6FB" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  for (let i = 0; i < 38; i++) {
    const y = -165 + i * 8.6, f = Math.sin(Math.PI * (i + 2) / 41), L = 18 + 72 * f;
    s += `<path d="M 0 ${f1(y)} Q ${f1(-L * 0.6)} ${f1(y - L * 0.2)} ${f1(-L)} ${f1(y - L * 0.55)}" stroke="#E9EDF5" stroke-width="2.6" fill="none" opacity="0.92"/>`;
    s += `<path d="M 0 ${f1(y)} Q ${f1(L * 0.6)} ${f1(y - L * 0.2)} ${f1(L)} ${f1(y - L * 0.55)}" stroke="#E9EDF5" stroke-width="2.6" fill="none" opacity="0.92"/>`;
  }
  return s + `</g>`;
};

ILU.cerebro = (T, p = {}) => {
  const zona = p.resalta;
  const cb = zona === "cerebelo";
  let s = `<path d="M 30 92 C 40 150 46 196 58 238" stroke="#C9768D" stroke-width="44" stroke-linecap="round" fill="none"/>`;
  s += `<g${cb ? ' filter="url(#gloedSterk)"' : ""}><ellipse cx="118" cy="106" rx="72" ry="44" fill="${cb ? "#6FD8FF" : "#D9879D"}"/>`;
  for (let i = 0; i < 5; i++) s += `<path d="M ${58 + i * 5} ${96 + i * 9} Q 118 ${86 + i * 13} ${182 - i * 5} ${98 + i * 9}" stroke="${cb ? "#E6FAFF" : "#A9506B"}" stroke-width="3" fill="none" opacity="0.65"/>`;
  s += `</g><g filter="url(#schaduw)"><path d="M -196 22 C -214 -82 -142 -172 -32 -184 C 82 -198 194 -142 208 -40 C 218 30 178 82 112 92 C 62 100 22 88 -18 98 C -80 112 -174 102 -196 22 Z" fill="url(#gBrein)"/></g>`;
  [["M -150 -40 C -120 -82 -90 -20 -60 -62 C -30 -104 0 -42 30 -84 C 60 -126 100 -62 132 -104"],
   ["M -164 18 C -132 -14 -100 42 -70 0 C -40 -42 -8 22 22 -20 C 52 -62 92 2 154 -32"],
   ["M -122 70 C -92 38 -60 82 -28 50 C 2 18 32 70 72 40"],
   ["M -64 -144 C -32 -112 0 -164 40 -132 C 80 -102 112 -154 152 -112"],
   ["M -176 -18 C -160 -60 -128 -96 -100 -120"]].forEach(([d]) => {
    s += `<path d="${d}" stroke="#A9506B" stroke-width="7" fill="none" opacity="0.5" stroke-linecap="round"/><path d="${d}" stroke="#FFE0E8" stroke-width="2.5" fill="none" opacity="0.35" transform="translate(-3 -4)" stroke-linecap="round"/>`;
  });
  s += `<ellipse cx="-70" cy="-110" rx="80" ry="34" fill="#FFFFFF" opacity="0.16" filter="url(#b18)"/>`;
  if (zona === "voorkant" || zona === "achterkant") {
    const x = zona === "voorkant" ? -130 : 120;
    s += `<circle cx="${x}" cy="-40" r="${f1(78 + 6 * Math.sin(T * 3))}" fill="#7FDFFF" opacity="0.5" filter="url(#b18)"/>`;
  }
  return s;
};

ILU.estomago = (T, p = {}) => {
  const forma = "M -60 -168 C -178 -160 -226 -52 -204 52 C -180 162 -48 236 70 198 C 152 172 196 112 224 54 L 254 34 C 276 24 296 2 296 -30 L 246 -64 C 226 -30 196 -2 160 14 C 118 34 62 40 32 4 C 4 -32 10 -116 -6 -162 Z";
  const k = "clipMaag";
  if (!DEFS[k]) DEFS[k] = `<clipPath id="${k}"><path d="${forma}"/></clipPath>`;
  let s = `<path d="M -40 -300 C -46 -250 -44 -205 -34 -160" stroke="url(#gMaag)" stroke-width="64" stroke-linecap="round" fill="none" opacity="0.9"/>`;
  s += `<g filter="url(#schaduw)"><path d="${forma}" fill="url(#gMaag)" opacity="0.92"/></g>`;
  const golf = Array.from({ length: 13 }, (_, i) => { const x = -240 + i * 45; return `${i ? "L" : "M"} ${x} ${f1(36 + Math.sin(T * 2.2 + i * 0.9) * 7)}`; }).join(" ");
  s += `<g clip-path="url(#${k})"><path d="${golf} L 320 260 L -240 260 Z" fill="url(#gZuur)" opacity="0.95"/>`;
  for (let i = 0; i < 14; i++) {
    const x = -170 + azar(i) * 330, y = 200 - ((T * (26 + azar(i + 9) * 30) + azar(i + 4) * 160) % 160), r = 5 + azar(i + 2) * 8;
    s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="none" stroke="#FAFFD8" stroke-width="2.4" opacity="0.7"/>`;
  }
  s += `</g>`;
  [-110, -78, -46].forEach((y, i) => { s += `<path d="M -180 ${y} C -140 ${y - 16} -110 ${y + 14} -70 ${y - 4} C -40 ${y - 18} -20 ${y + 8} 0 ${y - 8}" stroke="#B5435F" stroke-width="5" fill="none" opacity="0.55"/>`; });
  s += `<path d="${forma}" fill="none" stroke="#FFC6D3" stroke-width="4" opacity="0.6"/>`;
  s += `<ellipse cx="-120" cy="-90" rx="60" ry="26" fill="#FFFFFF" opacity="0.18" filter="url(#b18)"/>`;
  if (p.objeto === "clavo") {
    const d = lim((p.__tl ?? 0) / 5) * 0.75;
    s += `<g transform="translate(60 110) rotate(-35)" opacity="${f2(1 - d)}"><rect x="-70" y="-6" width="140" height="12" rx="4" fill="url(#gMetaal)"/><rect x="62" y="-16" width="12" height="32" rx="3" fill="#C7CEDC"/></g>`;
  }
  return s;
};

ILU.corazon = (T) => {
  const b = 1 + 0.04 * Math.pow(Math.max(0, Math.sin(T * 2 * Math.PI * 1.15)), 6);
  let s = `<g transform="scale(${f2(b)})">`;
  s += `<path d="M 6 -96 C 6 -206 128 -236 156 -170" stroke="#B3223B" stroke-width="54" fill="none" stroke-linecap="round"/>`;
  s += `<path d="M -40 -112 C -62 -192 -144 -204 -164 -150" stroke="#4A78D6" stroke-width="42" fill="none" stroke-linecap="round"/>`;
  s += `<g filter="url(#schaduw)"><path d="M 0 214 C -122 144 -192 60 -186 -30 C -180 -112 -110 -152 -50 -126 C -20 -112 0 -90 10 -70 C 30 -110 92 -142 142 -110 C 202 -70 202 22 160 92 C 120 152 60 192 0 214 Z" fill="url(#gHart)"/></g>`;
  s += `<path d="M -20 -60 C -40 0 -30 80 10 150" stroke="#7A1027" stroke-width="5" fill="none" opacity="0.6"/>`;
  s += `<path d="M 40 -70 C 70 -20 90 40 80 110" stroke="#7A1027" stroke-width="4" fill="none" opacity="0.5"/>`;
  s += `<ellipse cx="-90" cy="-50" rx="50" ry="32" fill="#FFFFFF" opacity="0.2" filter="url(#b18)"/></g>`;
  return s;
};

ILU.ojo = (T) => {
  const pupila = 30 + 9 * Math.sin(T * 1.3);
  let s = `<g filter="url(#schaduw)"><circle r="175" fill="url(#gSclera)"/></g>`;
  for (let i = 0; i < 6; i++) { const a = i * 60 + 20; s += `<path d="M ${f1(Math.cos(a * R) * 172)} ${f1(Math.sin(a * R) * 172)} Q ${f1(Math.cos((a + 8) * R) * 130)} ${f1(Math.sin((a + 8) * R) * 130)} ${f1(Math.cos((a + 3) * R) * 105)} ${f1(Math.sin((a + 3) * R) * 105)}" stroke="#D9485C" stroke-width="1.8" fill="none" opacity="0.4"/>`; }
  s += `<circle r="84" fill="url(#gIris)"/>`;
  for (let i = 0; i < 48; i++) { const a = i * 7.5 * R; s += `<line x1="${f1(Math.cos(a) * 36)}" y1="${f1(Math.sin(a) * 36)}" x2="${f1(Math.cos(a) * 80)}" y2="${f1(Math.sin(a) * 80)}" stroke="#BDEBFF" stroke-width="1.4" opacity="0.32"/>`; }
  s += `<circle r="84" fill="none" stroke="#0C2C48" stroke-width="5"/><circle r="${f1(pupila)}" fill="#05070C"/>`;
  s += `<ellipse cx="-30" cy="-36" rx="22" ry="15" fill="#FFFFFF" opacity="0.9"/><circle cx="26" cy="22" r="7" fill="#FFFFFF" opacity="0.6"/>`;
  return s;
};

ILU.mano = (T) => {
  let s = `<g filter="url(#schaduw)"><g fill="url(#gPiel)">`;
  [[-80, -66, 170], [-27, -76, 202], [27, -72, 190], [78, -60, 150]].forEach(([x, y, h]) => { s += `<rect x="${x - 24}" y="${y - h}" width="48" height="${h + 40}" rx="24"/>`; });
  s += `<path d="M -112 40 C -118 -20 -106 -62 -96 -72 L 98 -72 C 112 -62 120 -20 114 40 C 106 132 62 196 0 200 C -62 196 -106 132 -112 40 Z"/>`;
  s += `<rect x="-27" y="-150" width="54" height="170" rx="27" transform="translate(-96 70) rotate(-42)"/></g></g>`;
  s += `<path d="M -80 30 C -30 10 30 20 80 -10" stroke="#B26C55" stroke-width="3" fill="none" opacity="0.4"/><path d="M -70 80 C -20 60 20 90 60 50" stroke="#B26C55" stroke-width="3" fill="none" opacity="0.35"/>`;
  return s;
};

ILU.pulmones = (T) => {
  const a = 1 + 0.045 * Math.sin(T * 1.6);
  let s = `<rect x="-20" y="-260" width="40" height="150" rx="16" fill="#E9B6C1"/>`;
  for (let i = 0; i < 6; i++) s += `<rect x="-24" y="${-250 + i * 24}" width="48" height="9" rx="4" fill="#F7D6DE" opacity="0.8"/>`;
  s += `<path d="M 0 -112 C -20 -90 -50 -80 -78 -70 M 0 -112 C 20 -90 50 -80 78 -70" stroke="#E9B6C1" stroke-width="22" fill="none" stroke-linecap="round"/>`;
  s += `<g transform="scale(${f2(a)} ${f2(a)})"><g filter="url(#schaduw)">`;
  s += `<path d="M -36 -96 C -122 -148 -232 -40 -222 92 C -216 194 -150 234 -70 214 C -28 204 -20 124 -26 40 Z" fill="url(#gLong)"/>`;
  s += `<path d="M 36 -96 C 122 -148 228 -40 218 92 C 212 194 150 234 74 214 C 40 204 52 160 30 130 C 52 100 34 60 28 40 Z" fill="url(#gLong)"/></g>`;
  for (const sx of [-1, 1]) for (let i = 0; i < 4; i++) s += `<path d="M ${sx * 70} -60 C ${sx * (90 + i * 20)} ${-20 + i * 30} ${sx * (120 + i * 14)} ${40 + i * 30} ${sx * (130 + i * 10)} ${80 + i * 28}" stroke="#B04A62" stroke-width="3" fill="none" opacity="0.45"/>`;
  s += `<ellipse cx="-140" cy="0" rx="40" ry="60" fill="#FFFFFF" opacity="0.16" filter="url(#b18)"/></g>`;
  return s;
};

ILU.diente = () => {
  let s = `<g filter="url(#schaduw)"><path d="M -96 22 C -92 110 -86 190 -50 232 C -30 250 -18 200 -16 150 C -12 110 12 110 16 150 C 18 200 30 250 50 232 C 86 190 92 110 96 22 Z" fill="url(#gTand)"/>`;
  s += `<path d="M -122 -40 C -132 -122 -82 -152 -42 -132 C -20 -152 20 -152 42 -132 C 82 -152 132 -122 122 -40 C 116 0 102 22 92 32 L -92 32 C -102 22 -116 0 -122 -40 Z" fill="url(#gTand)"/></g>`;
  s += `<path d="M -96 -90 C -80 -120 -50 -118 -40 -100" stroke="#FFFFFF" stroke-width="10" fill="none" opacity="0.8" stroke-linecap="round"/>`;

  const o = lim((p - 0.55) / 0.45), dx = centro ? 0 : der ? 14 : -14, a = centro ? "middle" : der ? "start" : "end";

function onda(x, y, w, label, c, picos, p) {
  const pts = [];
  for (let i = 0; i <= 120; i++) {

    if (!picos) h = 0.03 * Math.sin(u * 47) * Math.sin(u * 13);   // línea plana, con un temblor mínimo
    pts.push(`${f1(x + u * w)},${f1(y - h * 78)}`);
  }
  let s = `<text x="${x}" y="${y - 110}" font-weight="700" font-size="28" letter-spacing="4" fill="${c}">${esc(label)}</text>`;
  s += `<line x1="${x}" y1="${y}" x2="${x + w}" y2="${y}" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>`;
  return s + `<polyline points="${pts.join(" ")}" fill="none" stroke="${c}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${f2(1 - suave(p))}" filter="url(#gloed)"/>`;
}

// =============================== TEXTO PALABRA A PALABRA ===============================
function palabrasDe(e) {
  const fichas = String(e.voz || e.texto || "").split(/\s+/).filter(Boolean);
  if (e.palabras && e.palabras.length) {   // con la puntuación de la frase escrita, si cuadran las palabras
    return fichas.length === e.palabras.length ? e.palabras.map((w, i) => Object.assign({}, w, { p: fichas[i] })) : e.palabras;
  }
  const ws = String(e.voz || e.texto || "").split(/\s+/).filter(Boolean), d = Math.max(0.5, e.fin - e.inicio - 0.4);
  return ws.map((p, i) => ({ p, a: e.inicio + 0.1 + (d * i) / ws.length, b: e.inicio + 0.1 + (d * (i + 1)) / ws.length }));
}
function trozos(ws, clave) {
  const out = []; let cur = [], w = 0;
  for (const x of ws) {
    const k = clave.has(norm(x.p)), pw = ancho(x.p, k ? 700 : 300, 74) + (k ? 40 : 0);
    if (cur.length && (cur.length >= 4 || w + 24 + pw > 930)) { out.push(cur); cur = []; w = 0; }
    cur.push(x); w += (cur.length > 1 ? 24 : 0) + pw;
  }
  if (cur.length) out.push(cur);
  if (out.length > 1 && out[out.length - 1].length === 1) { const u = out.pop(); out[out.length - 1].push(u[0]); }
  return out;
}
function texto(e, t, idx = 1) {
  const clave = new Set((e.clave || []).flatMap(c => String(c).split(/\s+/)).map(norm).filter(Boolean));
  const ts = trozos(palabrasDe(e), clave);
  let i = ts.findIndex((c, k) => k === ts.length - 1 || t < ts[k + 1][0].a - 0.06);
  if (i < 0) i = ts.length - 1;
  const c = ts[i], piezas = c.map(x => ({ x, k: clave.has(norm(x.p)) }));
  piezas.forEach(o => { o.w = ancho(o.x.p, o.k ? 700 : 300, 74) + (o.k ? 40 : 0); });
  const lineas = [[]]; let lw = 0;
  piezas.forEach(o => { if (lineas[lineas.length - 1].length && lw + 24 + o.w > 960) { lineas.push([]); lw = 0; } lineas[lineas.length - 1].push(o); lw += (lineas[lineas.length - 1].length > 1 ? 24 : 0) + o.w; });
  let s = "";
  lineas.forEach((L, li) => {
    const total = L.reduce((a, o) => a + o.w, 0) + 24 * (L.length - 1);
    let x = 540 - total / 2; const y = 352 + li * 104 - (lineas.length - 1) * 40;
    L.forEach(o => {
      const adelanto = idx === 0 ? 0.12 : 0.06, q = salida(tramo(t, o.x.a - adelanto, 0.16)), sc = 0.82 + 0.18 * atras(tramo(t, o.x.a - adelanto, 0.26));
      if (q > 0) {
        const dy = (1 - q) * 20, cx = x + o.w / 2;
        if (o.k) {
          const qb = muelle(tramo(t, o.x.a - adelanto, 0.4));
          s += `<g opacity="${f2(q)}" transform="translate(${f1(cx)} ${f1(y - 20 + dy)}) scale(${f2(sc)}) translate(${f1(-cx)} ${f1(-(y - 20))})"><rect x="${f1(x + (1 - qb) * o.w / 2)}" y="${y - 66}" width="${f1(o.w * qb)}" height="90" rx="16" fill="rgba(6,9,16,0.8)" stroke="#5ED3F3" stroke-width="3.5"/>`;
          s += `<text x="${f1(x + 20)}" y="${y}" font-weight="700" font-size="74" fill="#FFFFFF">${esc(o.x.p)}</text></g>`;
        } else s += `<g transform="translate(${f1(cx)} ${f1(y - 20 + dy)}) scale(${f2(sc)}) translate(${f1(-cx)} ${f1(-(y - 20))})"><text x="${f1(x)}" y="${y}" font-weight="300" font-size="74" fill="#FFFFFF" opacity="${f2(q * 0.94)}">${esc(o.x.p)}</text></g>`;
      }
      x += o.w + 24;
    });
  });
  return s;
}

  grande: { x: 540, y: 1010, k: 1.3 }, primerplano: { x: 570, y: 1080, k: 1.9 }, dato: { x: 540, y: 850, k: 0.95 },
  grafica: { x: 845, y: 640, k: 0.42 }, lado: { x: 300, y: 1000, k: 0.72 }, vs: { x: 270, y: 1010, k: 0.6 },
  banda: { x: 540, y: 1010, k: 1 }, final: { x: 540, y: 1000, k: 1.05 }, gancho: { x: 540, y: 1330, k: 0.5 },
  pregunta: { x: 540, y: 1420, k: 0.42 }, numero: { x: 540, y: 760, k: 0.62 },
};
const ANCLAS = { arriba: [0, -190], abajo: [0, 190], izquierda: [-170, 0], derecha: [170, 0], centro: [0, 0] };
const PUNTOS = {
  cerebro: { cerebelo: [118, 106], delante: [-150, -40], detras: [150, -60], tronco: [44, 200] },
  estomago: { acido: [10, 120], pared: [-205, 0], esofago: [-40, -260], salida: [270, -20] },
  pie: { talon: [-20, 200], dedos: [-90, -200], planta: [-20, 40] },
  corazon: { aorta: [130, -180], ventriculo: [-60, 80] }, ojo: { pupila: [0, 0], iris: [62, 0] },
  celula: { nucleo: [-24, -12], membrana: [196, 0], mitocondria: [90, 60] }, diente: { esmalte: [-90, -100], raiz: [-50, 200] },
  tierra: { atmosfera: [150, -150] }, sol: { nucleo: [0, 0], corona: [0, -240] }, planeta: { anillos: [260, -90] },
  bombilla: { filamento: [0, -20] }, cohete: { motor: [0, 230], ventana: [0, -40] }, pulmones: { traquea: [0, -200] },
  columna: { disco: [70, 0], vertebra: [-80, -110] },
};
const expo = x => (x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.pow(2, -10 * x));
const atras = x => { if (x <= 0) return 0; if (x >= 1) return 1; const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const numNLGrande = (v, d) => { const [e, f] = Number(v).toFixed(d).split("."); return e.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (f ? "," + f : ""); };

function tiempoClave(e) {
  const cl = new Set((e.clave || []).flatMap(c => String(c).split(/\s+/)).map(norm).filter(Boolean));
  const w = palabrasDe(e).find(x => cl.has(norm(x.p)));
  return w ? w.a : e.inicio + 0.6;
}

// Cámara: empuje lento y deriva lateral; golpe de zoom cuando se dice la palabra clave (con anticipación);
// en el gancho arranca desde muy cerca y se suelta de golpe.
function camara(e, tl, d, idx) {
  const lado = idx % 2 ? -1 : 1, q = suave(lim(tl / d));
  let z = 1 + 0.07 * q, x = lado * 28 * q, y = -16 * q;
  const u = tl - (tiempoClave(e) - e.inicio);
  if (u > -0.1 && u < 0) z -= 0.018 * Math.sin(Math.PI * (u + 0.1) / 0.1);
  if (u >= 0) z += 0.065 * Math.exp(-u / 0.24) * Math.cos(u * 9);
  if (idx === 0) z += 0.38 * (1 - expo(lim(tl / 0.42)));
  if (d > 2.4) {   // reencuadre: la cámara se acerca y se desplaza a mitad de escena (también en el cierre)
    const r = expo(tramo(tl, 1.5, 0.38)), fuerte = ["gancho", "numero", "pregunta"].includes(e.plano) ? 0.1 : 0.26;
    z += fuerte * r; x += lado * 85 * r; y -= 50 * r;
    if (d > 3.1) {     // escenas largas: tercer golpe de cámara, hacia el otro lado
      const r2 = expo(tramo(tl, 2.55, 0.35));
      z -= 0.14 * r2; x -= lado * 170 * r2; y += 40 * r2;
    }
  }
  return { z, x, y };
}
const capa = (svg, cam, f, cx = 540, cy = 1000) =>
  `<g transform="translate(${f1(cx + cam.x * f)} ${f1(cy + cam.y * f)}) scale(${(1 + (cam.z - 1) * f).toFixed(4)}) translate(${-cx} ${-cy})">${svg}</g>`;

function golpe(o, tl, c) {
  const p = tramo(tl, 0.02, 0.5), k = p > 0 ? 1 + 0.42 * Math.exp(-7 * p) * Math.cos(10 * p) : 1.42;
  const sx = 16 * Math.exp(-p * 8) * Math.sin(p * 70), sy = 11 * Math.exp(-p * 8) * Math.cos(p * 63);
  const txt = String(o.texto || ""), tam = Math.min(300, 980 / Math.max(1, ancho(txt, 800, 100) / 100));
  let s = `<circle cx="540" cy="900" r="${f1(140 + 760 * expo(p))}" fill="none" stroke="${c}" stroke-width="${f1(10 * (1 - p) + 1)}" opacity="${f2(0.7 * (1 - p))}"/>`;
  const late = 1 + 0.018 * Math.sin(tl * 5.5);
  s += `<g transform="translate(${f1(540 + sx)} ${f1(900 + sy)}) scale(${(k * late).toFixed(3)})" opacity="${f2(lim(tl / 0.06))}">`;
  s += `<text x="0" y="${f1(tam * 0.36)}" text-anchor="middle" font-weight="800" font-size="${f1(tam)}" fill="${c}" opacity="${f2(0.4 + 0.25 * Math.sin(tl * 5.5))}" filter="url(#b18)">${esc(txt)}</text>`;
  s += `<text x="0" y="${f1(tam * 0.36)}" text-anchor="middle" font-weight="800" font-size="${f1(tam)}" fill="#FFFFFF">${esc(txt)}</text></g>`;
  if (o.sub) { const q = atras(tramo(tl, 0.22, 0.35)); s += `<text x="540" y="${f1(900 + tam * 0.36 + 96)}" text-anchor="middle" font-weight="700" font-size="56" fill="${c}" opacity="${f2(lim(q))}" transform="translate(0 ${f1((1 - q) * 30)})">${esc(o.sub)}</text>`; }
  return s;
}

function pregunta(tl, c, T) {
  const p = atras(tramo(tl, 0, 0.38)), pulso = 1 + 0.045 * Math.sin(T * 6.5);
  let s = `<g transform="translate(540 900) rotate(${f1(T * 40)})"><circle r="${f1(300 * p)}" fill="none" stroke="${c}" stroke-width="5" stroke-dasharray="26 22" opacity="0.6"/></g>`;
  for (let i = 0; i < 10; i++) { const a = i * 36 * R + T * 0.8, r = 430 - 140 * ((T * 0.9 + i * 0.13) % 1); s += `<circle cx="${f1(540 + Math.cos(a) * r)}" cy="${f1(900 + Math.sin(a) * r)}" r="7" fill="${c}" opacity="0.7"/>`; }
  s += `<g transform="translate(540 900) scale(${f2(p * pulso)})"><text x="0" y="190" text-anchor="middle" font-weight="800" font-size="560" fill="${c}" opacity="0.5" filter="url(#b18)">?</text>`;
  return s + `<text x="0" y="190" text-anchor="middle" font-weight="800" font-size="560" fill="#FFFFFF">?</text></g>`;
}

function contador(o, tl, c) {
  const p = expo(tramo(tl, 0.12, 1.15)), v = Number(o.desde ?? 0) + (Number(o.hasta ?? 0) - Number(o.desde ?? 0)) * p;
  const txt = `${o.prefijo || ""}${numNLGrande(v, o.decimales ?? 0)}${o.sufijo || ""}`;
  const final = `${o.prefijo || ""}${numNLGrande(Number(o.hasta ?? 0), o.decimales ?? 0)}${o.sufijo || ""}`;
  const tam = Math.min(250, 960 / Math.max(1, ancho(final, 800, 100) / 100)), fin = tramo(tl, 1.27, 0.35);
  const k = (0.85 + 0.15 * atras(tramo(tl, 0, 0.3))) * (1 + 0.08 * Math.exp(-fin * 6) * (fin > 0 ? 1 : 0));
  let s = fin > 0 && fin < 1 ? `<circle cx="540" cy="1140" r="${f1(160 + 500 * expo(fin))}" fill="none" stroke="${c}" stroke-width="6" opacity="${f2(0.6 * (1 - fin))}"/>` : "";
  s += `<g transform="translate(540 1140) scale(${f2(k)})"><text x="0" y="${f1(tam * 0.36)}" text-anchor="middle" font-weight="800" font-size="${f1(tam)}" fill="${c}" opacity="0.5" filter="url(#b18)">${esc(txt)}</text>`;
  s += `<text x="0" y="${f1(tam * 0.36)}" text-anchor="middle" font-weight="800" font-size="${f1(tam)}" fill="#FFFFFF">${esc(txt)}</text></g>`;
  if (o.label) { const q = atras(tramo(tl, 0.3, 0.35)); s += `<text x="540" y="${f1(1140 + tam * 0.36 + 90)}" text-anchor="middle" font-weight="700" font-size="52" fill="${c}" opacity="${f2(lim(q))}">${esc(o.label)}</text>`; }
  return s;
}

function versus(e, tl, T, c, c2, dibuja) {
  const pa = expo(tramo(tl, 0, 0.32)), pb = expo(tramo(tl, 0.09, 0.32)), pv = atras(tramo(tl, 0.18, 0.32));
  let s = `<g transform="translate(${f1(-200 * (1 - pa))} 0)"><rect x="0" y="0" width="540" height="1920" fill="${c}" opacity="0.07"/><ellipse cx="270" cy="1010" rx="420" ry="620" fill="${gloedVan(c)}"/>${dibuja(e.ilustracion, 270, 1000, 0.6, 0)}`;
  if (e.izquierda) s += `<text x="270" y="1330" text-anchor="middle" font-weight="700" font-size="48" fill="#FFFFFF">${esc(e.izquierda)}</text>`;
  if (e.izquierda_sub) s += `<text x="270" y="1380" text-anchor="middle" font-weight="300" font-size="32" fill="#AEB6C7">${esc(e.izquierda_sub)}</text>`;
  s += `</g><g transform="translate(${f1(200 * (1 - pb))} 0)"><rect x="540" y="0" width="540" height="1920" fill="${c2}" opacity="0.07"/><ellipse cx="810" cy="1010" rx="420" ry="620" fill="${gloedVan(c2)}"/>${dibuja(e.ilustracion2, 810, 1000, 0.6, 2)}`;
  if (e.derecha) s += `<text x="810" y="1330" text-anchor="middle" font-weight="700" font-size="48" fill="#FFFFFF">${esc(e.derecha)}</text>`;
  if (e.derecha_sub) s += `<text x="810" y="1380" text-anchor="middle" font-weight="300" font-size="32" fill="#AEB6C7">${esc(e.derecha_sub)}</text>`;
  s += `</g><line x1="540" y1="560" x2="540" y2="1500" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>`;
  return s + `<g transform="translate(540 1010) scale(${f2(0.6 + 0.4 * pv)})" opacity="${f2(lim(pv * 2))}"><circle r="60" fill="#0A0E18" stroke="#FFFFFF" stroke-width="4"/><text x="0" y="17" text-anchor="middle" font-weight="800" font-size="46" fill="#FFFFFF">VS</text></g>`;
}

function aviso(texto, tl) {
  const q = atras(tramo(tl, 0.06, 0.3)), w = ancho("⚡ " + texto, 700, 34) + 70, b = 0.5 + 0.5 * Math.sin(tl * 9);
  return `<g transform="translate(540 512) scale(${f2(0.7 + 0.3 * q)})" opacity="${f2(lim(q * 2))}"><rect x="${f1(-w / 2)}" y="-36" width="${f1(w)}" height="72" rx="36" fill="#2A1606" stroke="#FFB020" stroke-width="${f1(2 + 2 * b)}"/><text x="0" y="12" text-anchor="middle" font-weight="700" font-size="34" fill="#FFD27A">⚡ ${esc(texto)}</text></g>`;
}

function escena(e, t, idx) {
  const T = t, tl = t - e.inicio, d = Math.max(0.5, e.fin - e.inicio), c = kleur(e.color), c2 = kleur(e.color2 || "roze");
  const plano = PLANOS[e.plano] ? e.plano : "grande", P = PLANOS[plano], cam = camara(e, tl, d, idx);
  const tk = tiempoClave(e) - e.inicio;
  // capa 0: fondo y resplandor (se mueve poco); capa 1: polvo (aún menos)
  let fondo = `<ellipse cx="${plano === "grafica" || plano === "numero" || plano === "gancho" || plano === "pregunta" ? 540 : P.x}" cy="${plano === "grafica" ? 1000 : plano === "gancho" || plano === "pregunta" ? 920 : P.y}" rx="780" ry="920" fill="${gloedVan(c)}"/>`;
  let polvo = "";
  for (let i = 0; i < 46; i++) {
    const x = azar(i) * 1080, y = ((azar(i + 50) * 1920 - T * (10 + azar(i + 3) * 18)) % 1920 + 1920) % 1920;
    polvo += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(1.5 + azar(i + 9) * 3)}" fill="#FFFFFF" opacity="${f2(0.05 + 0.13 * azar(i + 7))}"/>`;
  }
  let s = `<rect width="1080" height="1920" fill="#05070C"/>` + capa(fondo, cam, 0.5) + capa(polvo, cam, 0.3);
  // capa 2: la ilustración, con muelle al entrar (anticipación y rebote)
  const entra = 0.8 + 0.2 * muelle(tramo(tl, 0, 0.5)), alfa = lim(tl / 0.12);
  const flota = i => Math.sin(T * 1.3 + i) * 9;
  const dibuja = (nombre, x, y, k, i = 0) => {
    if (!nombre) return "";
    const datos = Object.assign({}, e, { __tl: tl }), kk = f2(k * entra);
    if (String(nombre).startsWith("emoji:")) return `<g transform="translate(${f1(x)} ${f1(y + flota(i))}) scale(${kk})">${emoji(nombre.slice(6), c)}</g>`;
    return ILU[nombre] ? `<g transform="translate(${f1(x)} ${f1(y + flota(i))}) scale(${kk})">${ILU[nombre](T, datos)}</g>` : "";
  };
  let m = "", letras = "";      // letras: cifras y «?» enormes, en su propia capa (la cámara casi no las agranda)
  if (plano === "vs") m += versus(e, tl, T, c, c2, dibuja);
  else if (plano === "lado") m += dibuja(e.ilustracion, 300, 1000, 0.72, 0) + dibuja(e.ilustracion2, 790, 1000, 0.72, 2);
  else if (plano === "banda") m += dibuja(e.ilustracion || "tejido", 540, 1010, 1);
  else if (plano === "gancho" || plano === "numero") {
    const b = d > 2.4 && e.ilustracion ? expo(tramo(tl, 1.55, 0.4)) : 0;     // composición B
    const cyL = plano === "gancho" ? 900 : 1140, dy = (640 - cyL) * b, kl = 1 - 0.38 * b;
    const base = plano === "gancho" ? golpe(e.golpe || {}, tl, c) : contador(e.contador || {}, tl, c);
    letras = `<g transform="translate(540 ${f1(cyL + dy)}) scale(${f2(kl)}) translate(-540 ${-cyL})">${base}</g>`;
    if (e.ilustracion) {
      const yi = P.y + (1180 - P.y) * b, ki = P.k * (1 + (plano === "gancho" ? 1.5 : 0.9) * b);
      m += dibuja(e.ilustracion, P.x, yi, ki);
    }
  }
  else if (plano === "pregunta") { letras = pregunta(tl, c, T); m += e.ilustracion ? dibuja(e.ilustracion, P.x, P.y, P.k) : ""; }

  else {
    m += dibuja(e.ilustracion, P.x, P.y, P.k);
    if (e.ilustracion2 && (ILU[e.ilustracion2] || String(e.ilustracion2).startsWith("emoji:"))) {
      const k2 = e.ilustracion2 === "pluma" ? P.k * 0.85 : P.k * 0.42;
      const off = e.ilustracion2 === "pluma" ? [-175, -70] : plano === "grafica" ? [-860, 0] : [235, -235];
      m += dibuja(e.ilustracion2, P.x + off[0] * P.k, P.y + off[1] * P.k, k2, 2);
    }
  }
  s += capa(`<g opacity="${f2(alfa)}">${m}</g>`, cam, 1);
  if (letras) s += capa(letras, cam, 0.3, 540, 1000);
  // capa 3: componentes y etiquetas, al ritmo de la palabra clave, escalonados (90 ms)
  const arranque = plano === "dato" || plano === "grafica" ? 0.15 : Math.max(0.12, Math.min(0.55, tk - 0.12));
  let fr = "";
  (e.componentes || []).slice(0, 3).forEach((o, i) => {
    const t0 = arranque + 0.09 * i, p = tramo(tl, t0, 1.2), pop = atras(tramo(tl, t0, 0.3));
    const yb = plano === "dato" ? 1330 + i * 40 : plano === "grafica" ? 900 + i * 300 : 1480;
    let x = "";
    if (o.tipo === "onda") x = onda(140, yb, 800, o.label || "", kleur(o.color || "blauw"), Math.max(0, Math.min(5, o.picos ?? 3)), p);
    else if (o.tipo === "deslizador") x = deslizador(150, yb, 780, o, p);
    else if (o.tipo === "medidor") x = medidor(540, yb + 40, o, p);
    else if (o.tipo === "escala") x = escala(150, yb + 60, 780, o, p);
    else if (o.tipo === "barras") x = barras(150, yb - 40, 780, o, p);
    else if (o.tipo === "numero") x = numero(540, yb + 50, o, p);
    else if (o.tipo === "pildora") x = pildora(540, yb + 40, o.texto || "", p);
    else if (o.tipo === "etiqueta") {
      const [ax, ay] = (PUNTOS[e.ilustracion] || {})[o.punto] || ANCLAS[o.punto] || ANCLAS.centro, k = P.k * cam.z, x0 = P.x + ax * k, y0 = P.y + ay * k;
      const tw = Math.max(ancho(o.texto || "", 700, 38), ancho(o.sub || "", 300, 27)) + 30;
      let der = (o.lado || (ax <= 0 ? "izquierda" : "derecha")) === "derecha";
      if (der && x0 + 170 + tw > 1040) der = false;
      if (!der && x0 - 170 - tw < 40) der = true;
      let x1 = der ? Math.min(1040 - tw, x0 + 170) : Math.max(40 + tw, x0 - 170), y1 = Math.min(1600, y0 + (ay < 0 ? -60 : 150));
      const medio = 300 * k, tapa = der ? x1 < P.x + medio : x1 > P.x - medio;
      if (tapa) { x1 = 540; y1 = Math.min(1630, P.y + medio + 70); }
      x = etiquetaLinea(x0, y0, x1, y1, o.texto || "", o.sub || "", p, "#FFFFFF", tapa);
    }
    const cy = yb;
    fr += `<g transform="translate(540 ${cy}) scale(${f2(0.85 + 0.15 * pop)}) translate(-540 ${-cy})">${x}</g>`;
  });
  s += capa(fr, { z: 1, x: cam.x, y: cam.y }, 1.2);
  if (plano === "final") s += final(tl, e.botones);
  if (e.aviso) s += aviso(e.aviso, tl);
  s += `<rect width="1080" height="1920" fill="url(#gVignet)"/>`;
  return s + texto(e, t, idx);
}

function rayas(p) {   // estelas del barrido
  let s = "";
  for (let i = 0; i < 9; i++) { const y = 200 + azar(i + 300) * 1500, w = 300 + azar(i + 310) * 600; s += `<rect x="${f1(1080 * (1 - p) - w * 0.5)}" y="${f1(y)}" width="${f1(w)}" height="${f1(3 + azar(i + 320) * 6)}" rx="3" fill="#FFFFFF" opacity="${f2(0.25 * Math.sin(Math.PI * p))}"/>`; }
  return s;
}

window.pintar = function (t) {
  const g = window.GUION, E = g.escenas;
  DEFS = {};
  let i = E.findIndex(e => t < e.fin);
  if (i < 0) i = E.length - 1;
  let s = escena(E[i], t, i);
  const tl = t - E[i].inicio, TR = 0.24;
  if (i > 0 && tl < TR) {     // corte con zoom (impares) o con barrido lateral (pares), nunca un fundido plano
    const p = tl / TR, prev = E[i - 1], viejo = escena(prev, prev.fin - 0.001, i - 1);
    if (i % 2) {
      s = `<g transform="translate(540 960) scale(${(0.88 + 0.12 * expo(p)).toFixed(4)}) translate(-540 -960)">${s}</g>` +
          `<g opacity="${f2(1 - p)}" transform="translate(540 960) scale(${(1 + 0.32 * p * p).toFixed(4)}) translate(-540 -960)">${viejo}</g>`;
    } else {
      s = `<g transform="translate(${f1(1080 * (1 - expo(p)))} 0)">${s}</g><g transform="translate(${f1(-1080 * p * p)} 0)">${viejo}</g>` + rayas(p);
    }
    s += `<rect width="1080" height="1920" fill="#FFFFFF" opacity="${f2(0.14 * (1 - p))}"/>`;
  }
  const pr = lim(t / (g.duracion || 1));
  s += `<text x="540" y="168" text-anchor="middle" font-weight="600" font-size="24" letter-spacing="10" fill="#8B93A3">${esc(g.cabecera || "WIST JE DAT")}</text>`;
  s += `<rect x="440" y="192" width="200" height="4" rx="2" fill="#FFFFFF" opacity="0.12"/><rect x="440" y="192" width="${f1(200 * pr)}" height="4" rx="2" fill="#5ED3F3"/>`;
  if (t > g.duracion - 0.35) s += `<rect width="1080" height="1920" fill="#000" opacity="${f2(lim((t - (g.duracion - 0.35)) / 0.35))}"/>`;
  document.getElementById("scene").innerHTML = `<defs>${Object.values(DEFS).join("")}</defs>` + s;
};
window.listo = Promise.all([300, 600, 700, 800].map(w => document.fonts.load(`${w} 60px Poppins`))).then(() => document.fonts.ready);
</script>
</body></html>
