<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- El Show (formato de las biografías desde el 26 nov, lo pidió el dueño): el chico rubio de traje es el protagonista y
     ACTÚA lo que cuenta, con gracia: fuma como una chimenea si la historia habla de tabaco, chuta un balón, levanta un
     trofeo, tira billetes, habla por teléfono, corre, se enfada echando humo, salta de alegría con confeti…
     Cada escena tiene su escenario (habitación, oficina, estadio, calle, banco, hospital o plató) y la foto de la persona
     va dentro del escenario: un cuadro en la pared, la tele, el videomarcador o una valla.
     show.js llama a preparar() una vez y a pintar(t) en cada fotograma. La voz y los subtítulos los pone el montador.
     Campos de cada tramo: emocion, accion, fondo, pop (texto corto que salta, p. ej. «x20»), foto. -->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="traje" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F3A55"/><stop offset="1" stop-color="#1A2236"/>
    </linearGradient>
    <radialGradient id="cara" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#FFD9B8"/><stop offset="1" stop-color="#EDB48A"/>
    </radialGradient>
    <linearGradient id="pelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE38A"/><stop offset="1" stop-color="#D89A2A"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE680"/><stop offset="0.5" stop-color="#F2B705"/><stop offset="1" stop-color="#B07800"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.5" cy="0.7" r="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sombraSuelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="recorte"><rect x="-430" y="-330" width="860" height="660" rx="10"/></clipPath>
    <!-- Probado el cine negro (26 nov) y el dueño prefiere color: queda el filtro «bn» por si algún día se quiere. -->
    <filter id="bn" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncR type="linear" slope="1.28" intercept="-0.1"/><feFuncG type="linear" slope="1.28" intercept="-0.1"/><feFuncB type="linear" slope="1.28" intercept="-0.1"/></feComponentTransfer>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence id="ruido" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="1"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="vineta" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.82"/>
    </radialGradient>
    <linearGradient id="haz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g id="camara">
    <g>
      <g id="decorado"></g>
      <g id="tarjeta"></g>
      <g id="pizarra"></g>
      <path id="foco" d="M440 0 L640 0 L900 1920 L180 1920 Z" fill="url(#haz)"/>
      <g id="actor"></g>
      <g id="delante"></g>
    </g>
    <g id="acento"></g>
  </g>
  <rect width="1080" height="1920" fill="url(#vineta)" opacity="0.45"/>
  
  <g id="pop"></g>
</svg>
<script>
const NS = "http://www.w3.org/2000/svg";
const OUT = "#14171F";
const PIEL = "#E9C2A2", TRAJE = "url(#traje)", CAMISA = "#FFFFFF", CORBATA = "#C8102E", CEJA = "#2A2A2A";
const FUENTE = "Inter, DejaVu Sans, sans-serif";
const lim = (x, a, b) => Math.max(a, Math.min(b, x));
const f = n => Math.round(n * 10) / 10;
const salida = q => 1 - Math.pow(1 - lim(q, 0, 1), 3);
function azar(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const SUELO = 1560;      // donde pisa el chico (y del suelo del decorado)

// ---------- DECORADOS ----------
// Cada uno dibuja el fondo y dice dónde va la foto: centro, tamaño y el tipo de marco.
const DECORADOS = {
  habitacion(t) {
    let s = `<rect width="1080" height="${SUELO}" fill="#C98B5E"/>`;
    for (let x = 0; x < 1080; x += 90) s += `<rect x="${x}" y="0" width="45" height="${SUELO}" fill="#BD7F53"/>`;
    s += `<rect y="${SUELO - 60}" width="1080" height="60" fill="#7A4A2A"/>`;
    s += `<rect y="${SUELO}" width="1080" height="${1920 - SUELO}" fill="#8C5A35"/>`;
    for (let x = -40; x < 1080; x += 160) s += `<line x1="${x}" y1="${SUELO}" x2="${x - 120}" y2="1920" stroke="#6E4428" stroke-width="5"/>`;
    // lámpara de pie y planta
    s += `<rect x="60" y="1050" width="14" height="${SUELO - 1050}" fill="#2B2B2B"/><path d="M10 1050 L124 1050 L100 960 L34 960 Z" fill="#FFE9A8" stroke="${OUT}" stroke-width="6"/>`;
    s += `<ellipse cx="67" cy="1060" rx="130" ry="60" fill="#FFF3C4" opacity="${f(0.18 + 0.04 * Math.sin(t * 3))}"/>`;
    s += `<path d="M930 ${SUELO} L960 1400 L1040 1400 L1070 ${SUELO} Z" fill="#B5563A" stroke="${OUT}" stroke-width="6"/>`;
    for (let n = 0; n < 6; n++) s += `<ellipse cx="${1000 + Math.cos(n) * 40}" cy="${1330 - n * 25}" rx="22" ry="60" fill="#3E8E4F" stroke="${OUT}" stroke-width="4" transform="rotate(${(n - 2.5) * 22} 1000 1400)"/>`;
    return { s, foto: [540, 560, 0.78, "madera"] };
  },
  oficina(t) {
    let s = `<rect width="1080" height="${SUELO}" fill="#5B6B82"/>`;
    s += `<rect x="40" y="120" width="1000" height="1000" fill="#9FC7F0"/>`;
    for (let n = 0; n < 9; n++) { const h = 260 + azar(n) * 420; s += `<rect x="${60 + n * 112}" y="${1120 - h}" width="96" height="${h}" fill="#6F86A8"/>`;
      for (let y = 1120 - h + 20; y < 1100; y += 50) s += `<rect x="${78 + n * 112}" y="${y}" width="22" height="26" fill="#FFF4B0" opacity="${azar(n * 7 + y) > 0.5 ? 0.9 : 0.25}"/><rect x="${116 + n * 112}" y="${y}" width="22" height="26" fill="#FFF4B0" opacity="${azar(n * 3 + y) > 0.5 ? 0.9 : 0.25}"/>`; }
    s += `<rect x="40" y="120" width="1000" height="1000" fill="none" stroke="#2D3646" stroke-width="22"/><line x1="540" y1="120" x2="540" y2="1120" stroke="#2D3646" stroke-width="14"/>`;
    s += `<rect y="${SUELO}" width="1080" height="${1920 - SUELO}" fill="#3B4555"/>`;
    return { s, foto: [540, 560, 0.74, "tele"], delante: `<rect x="-40" y="1760" width="1160" height="50" rx="10" fill="#6B4226" stroke="${OUT}" stroke-width="8"/><rect x="0" y="1805" width="1080" height="115" fill="#5A361E"/>` };
  },
  estadio(t) {
    let s = `<rect width="1080" height="1920" fill="#0B1630"/>`;
    for (let n = 0; n < 700; n++) s += `<circle cx="${f(azar(n) * 1080)}" cy="${f(860 + azar(n + 99) * 420)}" r="9" fill="${["#E63946", "#F1FAEE", "#FFB703", "#219EBC"][n % 4]}" opacity="${f(0.55 + 0.45 * Math.sin(t * 6 + n))}"/>`;
    for (const x of [90, 990]) { s += `<rect x="${x - 10}" y="120" width="20" height="760" fill="#444"/><rect x="${x - 70}" y="90" width="140" height="60" rx="8" fill="#FFF9D6"/>`;
      s += `<path d="M${x} 150 L${540} 1500 L${x < 540 ? 1080 : 0} 1500 Z" fill="#FFFBE0" opacity="0.06"/>`; }
    s += `<rect y="1280" width="1080" height="640" fill="#2E8B3A"/>`;
    for (let y = 1280; y < 1920; y += 80) s += `<rect y="${y}" width="1080" height="40" fill="#34983F"/>`;
    s += `<line x1="0" y1="1700" x2="1080" y2="1700" stroke="#fff" stroke-width="8" opacity="0.8"/>`;
    return { s, foto: [540, 460, 0.7, "pantalla"] };
  },
  calle(t) {
    let s = `<rect width="1080" height="1920" fill="#FFB36B"/><circle cx="880" cy="300" r="110" fill="#FFE08A"/>`;
    const casas = [["#D9534F", 0], ["#5BC0DE", 230], ["#F0AD4E", 470], ["#5CB85C", 700], ["#8E6BBF", 900]];
    for (const [c, x] of casas) { const h = 700 + (x % 300); s += `<rect x="${x}" y="${SUELO - h}" width="220" height="${h}" fill="${c}" stroke="${OUT}" stroke-width="6"/>`;
      for (let y = SUELO - h + 40; y < SUELO - 120; y += 120) s += `<rect x="${x + 30}" y="${y}" width="60" height="80" fill="#FFF7D6" stroke="${OUT}" stroke-width="4"/><rect x="${x + 130}" y="${y}" width="60" height="80" fill="#FFF7D6" stroke="${OUT}" stroke-width="4"/>`; }
    s += `<rect y="${SUELO}" width="1080" height="${1920 - SUELO}" fill="#8A8F99"/><rect y="${SUELO}" width="1080" height="20" fill="#C9CCD2"/>`;
    return { s, foto: [540, 520, 0.8, "valla"] };
  },
  banco(t) {
    let s = `<rect width="1080" height="${SUELO}" fill="#2D3A2F"/>`;
    s += `<circle cx="540" cy="560" r="470" fill="#7D8A80" stroke="${OUT}" stroke-width="12"/><circle cx="540" cy="560" r="430" fill="#9AA79D"/>`;
    for (let n = 0; n < 8; n++) s += `<rect x="530" y="150" width="20" height="90" fill="#5E6B61" transform="rotate(${n * 45} 540 560)"/>`;
    s += `<rect y="${SUELO}" width="1080" height="${1920 - SUELO}" fill="#1D261F"/>`;
    for (let n = 0; n < 9; n++) s += `<path d="M${40 + (n % 3) * 70 + (n > 5 ? 35 : 0)} ${SUELO - (Math.floor(n / 3)) * 40} l60 0 l-12 -40 l-36 0 z" fill="url(#oro)" stroke="${OUT}" stroke-width="4"/>`;
    for (let n = 0; n < 9; n++) s += `<path d="M${830 + (n % 3) * 70 + (n > 5 ? 35 : 0)} ${SUELO - (Math.floor(n / 3)) * 40} l60 0 l-12 -40 l-36 0 z" fill="url(#oro)" stroke="${OUT}" stroke-width="4"/>`;
    return { s, foto: [540, 560, 0.66, "oro"] };
  },
  hospital(t) {
    let s = `<rect width="1080" height="${SUELO}" fill="#DDEFF5"/><rect y="${SUELO - 300}" width="1080" height="300" fill="#BFDDE8"/>`;
    s += `<rect x="770" y="980" width="260" height="190" rx="14" fill="#1B2430" stroke="${OUT}" stroke-width="6"/>`;
    let d = "M785 1080"; for (let x = 0; x < 230; x += 10) { const q = ((x / 230) + t * 0.8) % 1; d += ` L${785 + x} ${1080 - (q > 0.45 && q < 0.5 ? 60 : q > 0.5 && q < 0.55 ? -40 : 0)}`; }
    s += `<path d="${d}" stroke="#3CFF7A" stroke-width="6" fill="none"/>`;
    s += `<rect x="60" y="300" width="120" height="120" fill="#fff" stroke="#E63946" stroke-width="0"/><rect x="100" y="320" width="40" height="80" fill="#E63946"/><rect x="80" y="340" width="80" height="40" fill="#E63946"/>`;
    s += `<rect y="${SUELO}" width="1080" height="${1920 - SUELO}" fill="#9FC3CF"/>`;
    return { s, foto: [540, 560, 0.74, "blanco"] };
  },
  plato(t) {
    let s = `<rect width="1080" height="1920" fill="#1A0710"/>`;
    for (const lado of [-1, 1]) for (let n = 0; n < 5; n++) s += `<rect x="${lado < 0 ? n * 36 : 1080 - (n + 1) * 36}" y="0" width="40" height="${SUELO}" fill="${n % 2 ? "#9E1B32" : "#B52240"}"/>`;
    s += `<path d="M540 0 L200 ${SUELO} L880 ${SUELO} Z" fill="#FFF6D0" opacity="${f(0.1 + 0.03 * Math.sin(t * 4))}"/>`;
    s += `<rect y="${SUELO}" width="1080" height="${1920 - SUELO}" fill="#3A1F12"/>`;
    return { s, foto: [540, 520, 0.8, "pantalla"] };
  },
};
const MARCOS = { madera: ["#8B5A2B", 34], tele: ["#111", 30], pantalla: ["#1F1F1F", 26], valla: ["#F4F4F4", 24], oro: ["url(#oro)", 34], blanco: ["#FFFFFF", 22] };
const DE_EMOCION = { enfadado: "habitacion", triste: "habitacion", contento: "plato", sorprendido: "calle", pensativo: "oficina", serio: "oficina" };
const DE_ACCION = { fumar: "habitacion", balon: "estadio", trofeo: "plato", dinero: "banco", telefono: "oficina", correr: "calle", hospital: "hospital" };

let FOTOS = [];
window.preparar = async function () {
  const g = window.GUION;
  const cont = document.getElementById("tarjeta");
  const cargas = [];
  FOTOS = (g.fotos || []).map(ruta => {
    const caja = document.createElementNS(NS, "g");
    caja.setAttribute("visibility", "hidden");
    const marco = document.createElementNS(NS, "rect");
    for (const [k, v] of Object.entries({ x: -462, y: -362, width: 924, height: 724, rx: 18 })) marco.setAttribute(k, v);
    const dentro = document.createElementNS(NS, "g");
    dentro.setAttribute("clip-path", "url(#recorte)");
    const img = document.createElementNS(NS, "image");
    for (const [k, v] of Object.entries({ x: -430, y: -330, width: 860, height: 660, preserveAspectRatio: "xMidYMid slice" })) img.setAttribute(k, v);
    cargas.push(new Promise(ok => { img.addEventListener("load", ok); img.addEventListener("error", ok); }));
    img.setAttribute("href", "file://" + ruta);
    const brillo = document.createElementNS(NS, "path");
    brillo.setAttribute("d", "M-430 -330 L-120 -330 L-330 330 L-430 330 Z"); brillo.setAttribute("fill", "#fff"); brillo.setAttribute("opacity", "0.06");
    dentro.append(img, brillo);
    caja.append(marco, dentro);
    cont.appendChild(caja);
    return { caja, img, marco };
  });
  await Promise.race([Promise.all(cargas), new Promise(ok => setTimeout(ok, 15000))]);
  return true;
};

function tramo(t) {
  const tr = (window.GUION && GUION.tramos) || [];
  let i = tr.findIndex(x => t >= x.desde && t < x.hasta);
  if (i < 0) i = Math.max(0, tr.length - 1);
  return { i, x: tr[i] || { desde: 0, hasta: 1, emocion: "serio" } };
}

function boca(t) {
  for (const w of (GUION.palabras || [])) {
    if (t >= w.i - 0.02 && t <= w.f + 0.02) return 0.3 + 0.7 * Math.abs(Math.sin((t - w.i) * Math.PI * 6.5));
  }
  return 0;
}

// Cuando la voz hace una pausa, el chico reacciona como una persona: da un sorbo al café, levanta una ceja mirando a
// cámara o se encoge de hombros (va rotando).
function enPausa(t) {
  const p = (window.GUION && GUION.palabras) || [];
  for (let k = 0; k + 1 < p.length; k++) {
    const fin = p[k].f, sig = p[k + 1].i;
    if (t > fin + 0.06 && t < sig - 0.04 && sig - fin >= 0.45) return ["ceja", "beber", "hombros"][k % 3];
    if (p[k].i > t) break;
  }
  if (p.length && t > p[p.length - 1].f + 0.1) return "ceja";
  return null;
}

function brazo(sx, sy, tx, ty, lado) {
  const L1 = 150, L2 = 140;
  let dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy);
  const dd = lim(d, 20, L1 + L2 - 2);
  const k = dd / (d || 1); tx = sx + dx * k; ty = sy + dy * k;
  const a = Math.atan2(ty - sy, tx - sx);
  const b = Math.acos(lim((L1 * L1 + dd * dd - L2 * L2) / (2 * L1 * dd), -1, 1));
  const ex = sx + Math.cos(a - b * lado) * L1, ey = sy + Math.sin(a - b * lado) * L1;
  const d1 = `M${f(sx)} ${f(sy)} L${f(ex)} ${f(ey)} L${f(tx)} ${f(ty)}`;
  let s = `<path d="${d1}" stroke="${OUT}" stroke-width="78" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  s += `<path d="${d1}" stroke="${TRAJE}" stroke-width="64" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  s += `<circle cx="${f(tx)}" cy="${f(ty)}" r="20" fill="${CAMISA}"/>`;
  s += `<circle cx="${f(tx)}" cy="${f(ty)}" r="38" fill="${PIEL}" stroke="${OUT}" stroke-width="7"/>`;
  return { s, mano: [tx, ty] };
}

function manos(accion, t, dt, habla) {
  const o = Math.sin(t * 7), o2 = Math.sin(t * 13);
  switch (accion) {
    case "senala": return [[-170, -240 + o * 6], [360, -900 + o * 10]];
    case "enfadado": return [[-250, -680 + o2 * 30], [250, -680 - o2 * 30]];
    case "sorprendido": return [[-125, -560], [125, -560]];
    case "contento": return [[-270, -860 + o * 40], [270, -860 - o * 40]];
    case "triste": return [[-120, -170], [120, -170]];
    case "pensativo": return [[-170, -240], [30, -520]];
    case "dinero": return [[-170, -240], [260 + o2 * 40, -560 - Math.abs(o2) * 120]];
    case "fumar": { const calada = (t % 2.6) < 1.1; return [[-180, -250], calada ? [70, -560] : [200, -470]]; }
    case "trofeo": return [[-90, -900 + o * 15], [90, -900 + o * 15]];
    case "telefono": return [[-180, -250 + o * 6], [175, -650]];
    case "balon": return [[-230, -380 + o * 20], [230, -380 - o * 20]];
    case "correr": return [[-200 + o2 * 80, -330], [200 - o2 * 80, -330]];
    case "beber": return [[-180, -250], (t % 1.6) < 0.9 ? [60, -560] : [170, -430]];
    case "ceja": return [[-170, -230], [180, -260]];
    case "hombros": return [[-270, -470 - Math.abs(o) * 20], [270, -470 - Math.abs(o) * 20]];
    default: return [[-180, -250 + o * 8 * habla], [230 + o * 30 * habla, -430 + Math.sin(t * 5.3) * 60 * habla]];
  }
}

const CARAS = {
  serio: [8, 10, 1, 0.1], senala: [0, 4, 1, 0.45], enfadado: [16, 26, 0.85, -0.7], sorprendido: [-26, -8, 1.3, 0],
  contento: [-8, -6, 1.05, 1], triste: [-6, -22, 0.95, -0.8], pensativo: [-6, 14, 1, -0.2], dinero: [-6, -4, 1.05, 1],
  fumar: [4, 8, 0.8, 0.3], beber: [-6, -4, 0.9, 0.2], ceja: [0, 0, 1, 0.55], hombros: [-14, -10, 1.05, -0.3], trofeo: [-10, -8, 1.05, 1], telefono: [0, 6, 1, 0.3], balon: [-6, -4, 1.05, 0.7], correr: [6, 12, 0.95, -0.2],
};

function personaje(t, accion, emocion, dt, b) {
  const habla = b > 0 ? 1 : 0;
  const [cejaY, cejaGiro, ojo, sonrisa] = CARAS[accion] || CARAS[emocion] || CARAS.serio;
  let salto = 0, sx = 1, sy = 1, giro = 0;
  if (accion === "sorprendido") salto = -Math.max(0, Math.sin(lim(dt / 0.5, 0, 1) * Math.PI)) * 90;
  if (accion === "contento" || accion === "dinero" || accion === "trofeo") salto = -Math.abs(Math.sin(t * 6)) * 45;
  if (accion === "correr") salto = -Math.abs(Math.sin(t * 14)) * 25;
  if (accion === "enfadado") { const p = Math.abs(Math.sin(t * 9)); sy = 1 - p * 0.03; sx = 1 + p * 0.03; }
  if (accion === "triste") { sy = 0.97; giro = -4; }
  if (accion === "pensativo") giro = 5;
  if (accion === "ceja") giro = -7;
  if (accion === "hombros") { salto = -Math.abs(Math.sin(lim(dt, 0, 9) * 0)) ; sy = 1.02; }
  if (accion === "correr") giro = 6;
  let tos = 0;
  if (accion === "fumar") { const q = t % 2.6; if (q > 1.9 && q < 2.4) { tos = Math.sin((q - 1.9) * 40) * 8; } }
  const respira = 1 + Math.sin(t * 2.2) * 0.012;
  const bote = Math.sin(t * 9) * 6 * habla + tos;

  let s = `<ellipse cx="0" cy="8" rx="${f(220 - salto * 0.6)}" ry="34" fill="#000" opacity="0.35"/>`;
  const postura = `translate(0 ${f(salto)}) rotate(${giro} 0 -200) scale(${f(sx)} ${f(sy * respira)})`;
  s += `<g transform="${postura}">`;
  for (const lado of [-1, 1]) {
    const paso = accion === "correr" ? Math.sin(t * 14 + (lado > 0 ? Math.PI : 0)) * 40 : 0;
    const px = lado * 62;
    s += `<rect x="${px - 44}" y="${f(-230 - Math.max(0, paso))}" width="88" height="215" rx="30" fill="#232B40" stroke="${OUT}" stroke-width="8" transform="rotate(${f(paso * 0.5)} ${px} -230)"/>`;
    s += `<ellipse cx="${f(px + lado * 14 + paso)}" cy="${f(-12 - Math.max(0, paso))}" rx="74" ry="32" fill="#1A1A1A" stroke="${OUT}" stroke-width="7"/>`;
  }
  s += `<path d="M-175 -200 Q-190 -420 -120 -455 L120 -455 Q190 -420 175 -200 Q0 -170 -175 -200 Z" fill="${TRAJE}" stroke="${OUT}" stroke-width="9"/>`;
  s += `<path d="M-62 -455 L0 -300 L62 -455 Z" fill="${CAMISA}" stroke="${OUT}" stroke-width="6"/>`;
  s += `<path d="M-16 -440 L16 -440 L26 -330 L0 -290 L-26 -330 Z" fill="${CORBATA}" stroke="${OUT}" stroke-width="5"/>`;

function efectos(accion, t, dt, cabeza, mano) {

    if (q > 1.9 && q < 2.5) s += `<text x="230" y="${f(cabeza - 120)}" font-size="96" font-weight="900" fill="#fff" stroke="${OUT}" stroke-width="10" paint-order="stroke" font-family="${FUENTE}" transform="rotate(-10 230 ${f(cabeza - 120)})">KUCH!</text>`;
  }
  if (accion === "enfadado") {
    for (let n = 0; n < 6; n++) {
      const q = ((t * 0.9 + n / 6) % 1), lado = n % 2 ? 1 : -1;
      s += `<circle cx="${f(lado * (150 + q * 90))}" cy="${f(cabeza - 170 - q * 220)}" r="${f(26 + q * 40)}" fill="#E8E8E8" opacity="${f(0.75 * (1 - q))}"/>`;
    }

    s += `<g transform="translate(150 ${f(cabeza - 150)}) scale(${f(k)})"><path d="M-30 -8 Q-8 -8 -8 -30 M8 -30 Q8 -8 30 -8 M30 8 Q8 8 8 30 M-8 30 Q-8 8 -30 8" stroke="#FF2E4D" stroke-width="12" fill="none" stroke-linecap="round"/></g>`;

    }

  if (accion === "contento" || accion === "trofeo") {

  return s;
}

function partir(texto, ancho) {
  const lineas = [], palabras = String(texto).toUpperCase().split(/\s+/);
  let l = "";
  for (const p of palabras) { if (l && (l + " " + p).length > ancho) { lineas.push(l); l = p; } else l = (l + " " + p).trim(); }
  if (l) lineas.push(l);
  return lineas.slice(0, 4);
}
function pizarra(x, dt) {          // «LES 1»: lo que se aprende de esta persona, en una pizarra que el chico señala

}

    `<g transform="translate(540 ${SUELO + 330}) scale(0.95)"><g transform="${p.postura}"><path d="M-14 -438 L14 -438 L24 -330 L0 -292 L-24 -330 Z" fill="${CORBATA}" stroke="${OUT}" stroke-width="5"/><path d="M-10 -438 L10 -438 L6 -412 L-6 -412 Z" fill="#8E0B20"/></g></g>`;
  document.getElementById("foco").setAttribute("opacity", f(0.85 + 0.15 * Math.sin(t * 7) * Math.sin(t * 3.1)));
  // el texto que salta (p. ej. «x20»)
  let pop = "";
  if (x.pop) {
    const q = lim(dt / 0.35, 0, 1), k = salida(q) * (1 + Math.sin(q * Math.PI) * 0.25);
    pop = `<g transform="translate(830 1180) rotate(-8) scale(${f(k * 100) / 100})"><text x="0" y="0" text-anchor="middle" font-size="150" font-weight="900" font-family="${FUENTE}" fill="#C8102E" transform="translate(10 10)">${String(x.pop).replace(/[<&]/g, "")}</text><text x="0" y="0" text-anchor="middle" font-size="150" font-weight="900" font-family="${FUENTE}" fill="#FFFFFF" stroke="${OUT}" stroke-width="16" paint-order="stroke">${String(x.pop).replace(/[<&]/g, "")}</text></g>`;
  }
  document.getElementById("pop").innerHTML = pop;
};
window.listo = true;
