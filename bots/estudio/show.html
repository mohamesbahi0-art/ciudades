<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- El Show (formato de las biografías desde el 26 nov, lo pidió el dueño): el chico rubio de traje es el protagonista y
     ACTÚA lo que cuenta, con gracia: fuma como una chimenea si la historia habla de tabaco, enseña el balón, levanta un
     trofeo, tira billetes, habla por teléfono, se enfada echando humo, salta de alegría con confeti…
     Desde el 26 nov por la noche el chico es un dibujo hecho con IA (personaje/, 15 poses con su boca para hablar),
     más fluido que el muñeco de antes; solo para los vídeos nuevos (los ya hechos no se tocan).
     Cada escena tiene su escenario (habitación, oficina, estadio, calle, banco, hospital o plató) y la foto de la persona
     va dentro del escenario: un cuadro en la pared, la tele, el videomarcador o una valla.
     show.js llama a preparar() una vez y a pintar(t) en cada fotograma. La voz y los subtítulos los pone el montador.
     Campos de cada tramo: emocion, accion, fondo, pop (texto corto que salta, p. ej. «x20»), foto. -->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="traje" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F3A55"/><stop offset="1" stop-color="#1A2236"/>
    </linearGradient>
    <radialGradient id="cara" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#FFD9B8"/><stop offset="1" stop-color="#EDB48A"/>
    </radialGradient>
    <linearGradient id="pelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE38A"/><stop offset="1" stop-color="#D89A2A"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE680"/><stop offset="0.5" stop-color="#F2B705"/><stop offset="1" stop-color="#B07800"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.5" cy="0.7" r="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sombraSuelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="recorte"><rect x="-330" y="-440" width="660" height="880" rx="10"/></clipPath>
    <filter id="difuso"><feGaussianBlur stdDeviation="22"/><feComponentTransfer><feFuncR type="linear" slope="0.7"/><feFuncG type="linear" slope="0.7"/><feFuncB type="linear" slope="0.7"/></feComponentTransfer></filter>
    <!-- Probado el cine negro (26 nov) y el dueño prefiere color: queda el filtro «bn» por si algún día se quiere. -->
    <filter id="bn" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncR type="linear" slope="1.28" intercept="-0.1"/><feFuncG type="linear" slope="1.28" intercept="-0.1"/><feFuncB type="linear" slope="1.28" intercept="-0.1"/></feComponentTransfer>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence id="ruido" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="1"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="vineta" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.82"/>
    </radialGradient>
    <linearGradient id="haz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g id="camara">
    <g>
      <g id="decorado"></g>
      <g id="detras"></g>
      <g id="tarjeta"></g>
      <g id="pizarra"></g>
      <path id="foco" d="M440 0 L640 0 L900 1920 L180 1920 Z" fill="url(#haz)"/>
      <g id="actor"></g>
      <g id="delante"></g>
    </g>
    <g id="efectos"></g>
  </g>
  <rect width="1080" height="1920" fill="url(#vineta)" opacity="0.45"/>
  
  <g id="pop"></g>
</svg>
<script>
const NS = "http://www.w3.org/2000/svg";
const OUT = "#14171F";
const PIEL = "#E9C2A2", TRAJE = "url(#traje)", CAMISA = "#FFFFFF", CORBATA = "#C8102E", CEJA = "#2A2A2A";
const FUENTE = "Inter, DejaVu Sans, sans-serif";
const lim = (x, a, b) => Math.max(a, Math.min(b, x));
const f = n => Math.round(n * 10) / 10;
const salida = q => 1 - Math.pow(1 - lim(q, 0, 1), 3);
function azar(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const SUELO = 1560;      // donde pisa el chico (y del suelo del decorado)

// ---------- DECORADOS ----------
// Cada uno dibuja el fondo y dice dónde va la foto: centro, tamaño y el tipo de marco.
const DECORADOS = {
  habitacion(t) {
    let s = `<rect width="1080" height="${SUELO}" fill="#C98B5E"/>`;
    for (let x = 0; x < 1080; x += 90) s += `<rect x="${x}" y="0" width="45" height="${SUELO}" fill="#BD7F53"/>`;
    s += `<rect y="${SUELO - 60}" width="1080" height="60" fill="#7A4A2A"/>`;
    s += `<rect y="${SUELO}" width="1080" height="${1920 - SUELO}" fill="#8C5A35"/>`;
    for (let x = -40; x < 1080; x += 160) s += `<line x1="${x}" y1="${SUELO}" x2="${x - 120}" y2="1920" stroke="#6E4428" stroke-width="5"/>`;
    // lámpara de pie y planta
    s += `<rect x="60" y="1050" width="14" height="${SUELO - 1050}" fill="#2B2B2B"/><path d="M10 1050 L124 1050 L100 960 L34 960 Z" fill="#FFE9A8" stroke="${OUT}" stroke-width="6"/>`;
    s += `<ellipse cx="67" cy="1060" rx="130" ry="60" fill="#FFF3C4" opacity="${f(0.18 + 0.04 * Math.sin(t * 3))}"/>`;
    s += `<path d="M930 ${SUELO} L960 1400 L1040 1400 L1070 ${SUELO} Z" fill="#B5563A" stroke="${OUT}" stroke-width="6"/>`;
    for (let n = 0; n < 6; n++) s += `<ellipse cx="${1000 + Math.cos(n) * 40}" cy="${1330 - n * 25}" rx="22" ry="60" fill="#3E8E4F" stroke="${OUT}" stroke-width="4" transform="rotate(${(n - 2.5) * 22} 1000 1400)"/>`;
    return { s, foto: [540, 560, 0.86, "madera"] };
  },
  oficina(t) {
    let s = `<rect width="1080" height="${SUELO}" fill="#5B6B82"/>`;
    s += `<rect x="40" y="120" width="1000" height="1000" fill="#9FC7F0"/>`;
    for (let n = 0; n < 9; n++) { const h = 260 + azar(n) * 420; s += `<rect x="${60 + n * 112}" y="${1120 - h}" width="96" height="${h}" fill="#6F86A8"/>`;
      for (let y = 1120 - h + 20; y < 1100; y += 50) s += `<rect x="${78 + n * 112}" y="${y}" width="22" height="26" fill="#FFF4B0" opacity="${azar(n * 7 + y) > 0.5 ? 0.9 : 0.25}"/><rect x="${116 + n * 112}" y="${y}" width="22" height="26" fill="#FFF4B0" opacity="${azar(n * 3 + y) > 0.5 ? 0.9 : 0.25}"/>`; }
    s += `<rect x="40" y="120" width="1000" height="1000" fill="none" stroke="#2D3646" stroke-width="22"/><line x1="540" y1="120" x2="540" y2="1120" stroke="#2D3646" stroke-width="14"/>`;
    s += `<rect y="${SUELO}" width="1080" height="${1920 - SUELO}" fill="#3B4555"/>`;
    return { s, foto: [540, 560, 0.86, "tele"], delante: `<rect x="-40" y="1760" width="1160" height="50" rx="10" fill="#6B4226" stroke="${OUT}" stroke-width="8"/><rect x="0" y="1805" width="1080" height="115" fill="#5A361E"/>` };
  },
  estadio(t) {
    let s = `<rect width="1080" height="1920" fill="#0B1630"/>`;
    for (let n = 0; n < 700; n++) s += `<circle cx="${f(azar(n) * 1080)}" cy="${f(860 + azar(n + 99) * 420)}" r="9" fill="${["#E63946", "#F1FAEE", "#FFB703", "#219EBC"][n % 4]}" opacity="${f(0.55 + 0.45 * Math.sin(t * 6 + n))}"/>`;
    for (const x of [90, 990]) { s += `<rect x="${x - 10}" y="120" width="20" height="760" fill="#444"/><rect x="${x - 70}" y="90" width="140" height="60" rx="8" fill="#FFF9D6"/>`;
      s += `<path d="M${x} 150 L${540} 1500 L${x < 540 ? 1080 : 0} 1500 Z" fill="#FFFBE0" opacity="0.06"/>`; }
    s += `<rect y="1280" width="1080" height="640" fill="#2E8B3A"/>`;
    for (let y = 1280; y < 1920; y += 80) s += `<rect y="${y}" width="1080" height="40" fill="#34983F"/>`;
    s += `<line x1="0" y1="1700" x2="1080" y2="1700" stroke="#fff" stroke-width="8" opacity="0.8"/>`;
    return { s, foto: [540, 540, 0.84, "pantalla"] };
  },
  calle(t) {
    let s = `<rect width="1080" height="1920" fill="#FFB36B"/><circle cx="880" cy="300" r="110" fill="#FFE08A"/>`;
    const casas = [["#D9534F", 0], ["#5BC0DE", 230], ["#F0AD4E", 470], ["#5CB85C", 700], ["#8E6BBF", 900]];
    for (const [c, x] of casas) { const h = 700 + (x % 300); s += `<rect x="${x}" y="${SUELO - h}" width="220" height="${h}" fill="${c}" stroke="${OUT}" stroke-width="6"/>`;
      for (let y = SUELO - h + 40; y < SUELO - 120; y += 120) s += `<rect x="${x + 30}" y="${y}" width="60" height="80" fill="#FFF7D6" stroke="${OUT}" stroke-width="4"/><rect x="${x + 130}" y="${y}" width="60" height="80" fill="#FFF7D6" stroke="${OUT}" stroke-width="4"/>`; }
    s += `<rect y="${SUELO}" width="1080" height="${1920 - SUELO}" fill="#8A8F99"/><rect y="${SUELO}" width="1080" height="20" fill="#C9CCD2"/>`;
    return { s, foto: [540, 560, 0.86, "valla"] };
  },
  banco(t) {
    let s = `<rect width="1080" height="${SUELO}" fill="#2D3A2F"/>`;
    s += `<circle cx="540" cy="560" r="470" fill="#7D8A80" stroke="${OUT}" stroke-width="12"/><circle cx="540" cy="560" r="430" fill="#9AA79D"/>`;
    for (let n = 0; n < 8; n++) s += `<rect x="530" y="150" width="20" height="90" fill="#5E6B61" transform="rotate(${n * 45} 540 560)"/>`;
    s += `<rect y="${SUELO}" width="1080" height="${1920 - SUELO}" fill="#1D261F"/>`;
    for (let n = 0; n < 9; n++) s += `<path d="M${40 + (n % 3) * 70 + (n > 5 ? 35 : 0)} ${SUELO - (Math.floor(n / 3)) * 40} l60 0 l-12 -40 l-36 0 z" fill="url(#oro)" stroke="${OUT}" stroke-width="4"/>`;
    for (let n = 0; n < 9; n++) s += `<path d="M${830 + (n % 3) * 70 + (n > 5 ? 35 : 0)} ${SUELO - (Math.floor(n / 3)) * 40} l60 0 l-12 -40 l-36 0 z" fill="url(#oro)" stroke="${OUT}" stroke-width="4"/>`;
    return { s, foto: [540, 560, 0.84, "oro"] };
  },
  hospital(t) {
    let s = `<rect width="1080" height="${SUELO}" fill="#DDEFF5"/><rect y="${SUELO - 300}" width="1080" height="300" fill="#BFDDE8"/>`;
    s += `<rect x="770" y="980" width="260" height="190" rx="14" fill="#1B2430" stroke="${OUT}" stroke-width="6"/>`;
    let d = "M785 1080"; for (let x = 0; x < 230; x += 10) { const q = ((x / 230) + t * 0.8) % 1; d += ` L${785 + x} ${1080 - (q > 0.45 && q < 0.5 ? 60 : q > 0.5 && q < 0.55 ? -40 : 0)}`; }
    s += `<path d="${d}" stroke="#3CFF7A" stroke-width="6" fill="none"/>`;
    s += `<rect x="60" y="300" width="120" height="120" fill="#fff" stroke="#E63946" stroke-width="0"/><rect x="100" y="320" width="40" height="80" fill="#E63946"/><rect x="80" y="340" width="80" height="40" fill="#E63946"/>`;
    s += `<rect y="${SUELO}" width="1080" height="${1920 - SUELO}" fill="#9FC3CF"/>`;
    return { s, foto: [540, 560, 0.86, "blanco"] };
  },
  plato(t) {
    let s = `<rect width="1080" height="1920" fill="#1A0710"/>`;
    for (const lado of [-1, 1]) for (let n = 0; n < 5; n++) s += `<rect x="${lado < 0 ? n * 36 : 1080 - (n + 1) * 36}" y="0" width="40" height="${SUELO}" fill="${n % 2 ? "#9E1B32" : "#B52240"}"/>`;
    s += `<path d="M540 0 L200 ${SUELO} L880 ${SUELO} Z" fill="#FFF6D0" opacity="${f(0.1 + 0.03 * Math.sin(t * 4))}"/>`;
    s += `<rect y="${SUELO}" width="1080" height="${1920 - SUELO}" fill="#3A1F12"/>`;
    return { s, foto: [540, 560, 0.86, "pantalla"] };
  },
};
const MARCOS = { madera: ["#8B5A2B", 34], tele: ["#111", 30], pantalla: ["#1F1F1F", 26], valla: ["#F4F4F4", 24], oro: ["url(#oro)", 34], blanco: ["#FFFFFF", 22] };
const DE_EMOCION = { enfadado: "habitacion", triste: "habitacion", contento: "plato", sorprendido: "calle", pensativo: "oficina", serio: "oficina" };
const DE_ACCION = { fumar: "habitacion", balon: "estadio", trofeo: "plato", dinero: "banco", telefono: "oficina", correr: "calle", hospital: "hospital" };

// ---------- EL CHICO ----------
// Dibujado con IA una vez (personaje/preparar.py): 15 poses con la cabeza siempre en el mismo sitio, y en cada una el
// trozo de la boca abierta para hablar. Aquí solo se elige la pose, se le da vida (respira, se balancea, bota al hablar,
// «pop» al cambiar de pose, parpadea) y se abre la boca con las sílabas de la voz.
const ESCALA_CHICO = 1.25, OJOS_Y = 1235;       // tamaño en pantalla y altura de los ojos (la cara queda fuera de la
                                                 // zona que tapan los botones y el texto de TikTok)
const POSES = {
  senala: ["apunta", "dedo"], enfadado: ["enfadado"], sorprendido: ["sorprendido"], contento: ["contento"],
  triste: ["triste"], pensativo: ["pensativo"], dinero: ["dinero"], fumar: ["fumar"], trofeo: ["trofeo"],
  telefono: ["telefono"], balon: ["balon"], correr: ["contento"], beber: ["beber"], ceja: ["pensativo"],
  hombros: ["explica"], hospital: ["triste"], serio: ["serio", "dedo", "explica"], normal: ["explica", "dedo", "apunta", "serio"],
};
const CAMBIO_GESTO = 2.6;          // en una escena larga, cambia de gesto cada ~2,6 s (como quien habla con las manos)
let CHICO = null;
let ULTIMA = { pose: null, desde: 0 };

function crear(tipo, attrs) {
  const e = document.createElementNS(NS, tipo);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  return e;
}

function datosChico() {
  if (window.PERSONAJE) return window.PERSONAJE;
  try {                               // show.js lo mete; si no, se lee al lado (file:// con permiso de Chromium)
    const r = new XMLHttpRequest(); r.open("GET", "personaje/personaje.json", false); r.send();
    return JSON.parse(r.responseText);
  } catch (e) { return null; }
}

function prepararChico(cargas) {
  const P = datosChico();
  if (!P) return;
  const [W, H] = P.lienzo;
  const actor = document.getElementById("actor");
  actor.innerHTML = "";
  const raiz = crear("g"), cuerpo = crear("g");
  const capas = {};
  for (const [n, p] of Object.entries(P.poses)) {
    const img = crear("image", { x: 0, y: 0, width: W, height: H, visibility: "hidden" });
    cargas.push(new Promise(ok => { img.addEventListener("load", ok); img.addEventListener("error", ok); }));
    img.setAttribute("href", `personaje/${n}.webp`);
    cuerpo.appendChild(img);
    capas[n] = { img, p };
  }
  for (const [n, p] of Object.entries(P.poses)) {
    if (!p.boca) continue;
    const b = crear("image", { x: p.boca.x, y: p.boca.y, width: p.boca.w, height: p.boca.h, visibility: "hidden" });
    cargas.push(new Promise(ok => { b.addEventListener("load", ok); b.addEventListener("error", ok); }));
    b.setAttribute("href", `personaje/${n}-boca.webp`);
    cuerpo.appendChild(b);
    capas[n].boca = b;
  }
  const parpados = crear("g");
  cuerpo.appendChild(parpados);
  raiz.appendChild(cuerpo);
  actor.appendChild(raiz);
  CHICO = { P, W, H, capas, raiz, cuerpo, parpados };
}

function elegirPose(accion, x, i, dt) {
  const lista = POSES[accion] || (x.emocion && POSES[x.emocion]) || POSES.normal;
  if (lista.length === 1) return lista[0];
  const k = Math.floor(Math.max(0, dt) / CAMBIO_GESTO);
  return lista[(i + k) % lista.length];
}

function aPantalla(px, py, extra) {        // de coordenadas del dibujo a la pantalla
  const c = CHICO.P.cabeza, S = ESCALA_CHICO;
  return [540 + (px - c.x) * S + (extra ? extra[0] : 0), OJOS_Y + (py - c.y) * S + (extra ? extra[1] : 0)];
}

function moverChico(t, accion, pose, b, dt) {
  const { P, W, H, capas, raiz, cuerpo, parpados } = CHICO;
  if (pose !== ULTIMA.pose) ULTIMA = { pose, desde: t };
  const dp = t - ULTIMA.desde;
  const habla = b > 0 ? 1 : 0;
  // vida: respira, se balancea, bota un poco al hablar y hace «pop» al cambiar de pose
  let dy = -habla * Math.abs(Math.sin(t * 9)) * 7, dx = 0, giro = Math.sin(t * 1.1) * 1.2 + habla * Math.sin(t * 6.3) * 0.9;
  if (accion === "contento" || accion === "trofeo" || accion === "dinero") dy -= Math.abs(Math.sin(t * 5)) * 24;
  if (accion === "correr") { dy -= Math.abs(Math.sin(t * 12)) * 20; giro += 4; }
  if (accion === "enfadado") dx += Math.sin(t * 41) * 4;
  if (accion === "sorprendido") dy -= Math.sin(lim(dp / 0.45, 0, 1) * Math.PI) * 70;
  if (accion === "triste") { dy += 12; giro -= 2; }
  if (accion === "hombros") dy -= Math.abs(Math.sin(lim(dp, 0, 0.6) * 10)) * 16;
  if (accion === "telefono") giro += Math.sin(t * 4) * 1.5;
  const k = 1 + 0.07 * Math.exp(-dp * 9) * Math.cos(dp * 18);
  const respira = 1 + Math.sin(t * 2.2) * 0.012;
  const c = P.cabeza, S = ESCALA_CHICO;
  raiz.setAttribute("transform", `translate(${f(540 - c.x * S + dx)} ${f(OJOS_Y - c.y * S + dy)}) scale(${S})`);
  const px = c.x, py = H * 0.9;           // todo gira y se estira desde la cintura
  cuerpo.setAttribute("transform",
    `translate(${px} ${py}) rotate(${f(giro)}) scale(${f(k * 1000) / 1000} ${f((2 - k) * respira * 1000) / 1000}) translate(${-px} ${-py})`);
  for (const [n, cp] of Object.entries(capas)) {
    cp.img.setAttribute("visibility", n === pose ? "visible" : "hidden");
    if (cp.boca) cp.boca.setAttribute("visibility", "hidden");
  }
  // la boca: abierta, medio abierta o cerrada, siguiendo las sílabas
  const cp = capas[pose];
  if (cp && cp.boca && b > 0.4) {
    cp.boca.setAttribute("visibility", "visible");
    const bb = cp.p.boca, medio = b <= 0.68;
    const ancla = bb.y + bb.h * 0.3;
    cp.boca.setAttribute("transform", medio ? `translate(0 ${f(ancla)}) scale(1 0.62) translate(0 ${f(-ancla)})` : "");
  }
  // parpadeo (cada 3-4 s, 0,13 s) salvo mientras bebe
  let s = "";
  const ciclo = 3.6, fase = (t + (pose.length * 0.37)) % ciclo;
  if (cp && pose !== "beber" && fase > ciclo - 0.13) {
    for (const o of cp.p.ojos) {
      s += `<ellipse cx="${o.x}" cy="${o.y}" rx="${f(o.rx + 4)}" ry="${f(o.ry + 4)}" fill="${cp.p.piel}"/>`;
      s += `<path d="M${f(o.x - o.rx)} ${f(o.y + o.ry * 0.1)} Q${o.x} ${f(o.y + o.ry * 0.55)} ${f(o.x + o.rx)} ${f(o.y + o.ry * 0.1)}" stroke="#16181D" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    }
  }
  parpados.innerHTML = s;
  const extra = [dx, dy];
  return {
    cabeza: aPantalla(c.x, c.y, extra),
    arriba: aPantalla(c.x, c.y - c.ojos * 2.35, extra)[1],
    brasa: cp && cp.p.brasa ? aPantalla(cp.p.brasa[0], cp.p.brasa[1], extra) : null,
    billetes: cp && cp.p.billetes ? aPantalla(cp.p.billetes[0], cp.p.billetes[1], extra) : null,
  };
}

function billete(x, y, giro) {
  return `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(giro)})"><rect x="-55" y="-28" width="110" height="56" rx="6" fill="#56C271" stroke="#1F6B35" stroke-width="5"/><circle r="15" fill="none" stroke="#1F6B35" stroke-width="5"/></g>`;
}
function efectosDetras(accion, t) {               // lo que pasa por detrás del chico (lluvia de billetes)
  let s = "";
  if (accion === "dinero")
    for (let n = 0; n < 26; n++) {
      const x = azar(n + 50) * 1080, v = 260 + azar(n + 7) * 260, y = -80 + ((t * v + azar(n + 11) * 2100) % 2100);
      s += billete(x, y, t * 120 + n * 47);
    }
  return s;
}

// Efectos alrededor del chico, en coordenadas de pantalla (cabeza = centro entre los ojos, arriba = donde acaba el pelo).
function efectos(accion, t, dt, A) {
  let s = "";
  const [hx, hy] = A.cabeza, top = A.arriba;
  if (accion === "fumar") {                         // humo de chimenea que sale del cigarro, y alguna tos
    const [bx, by] = A.brasa || [hx - 260, hy + 60];
    for (let n = 0; n < 14; n++) {
      const q = ((t * 0.5 + n / 14) % 1);
      s += `<circle cx="${f(bx + Math.sin(q * 9 + n) * 40 + q * 60)}" cy="${f(by - 20 - q * 620)}" r="${f(14 + q * 90)}" fill="#C9C9C9" stroke="#9A9A9A" stroke-width="4" opacity="${f(0.8 * (1 - q))}"/>`;
    }
    for (let n = 0; n < 4; n++) s += `<circle cx="${f(hx + Math.sin(t + n * 2) * 260)}" cy="${f(top + 40 + Math.cos(t * 0.7 + n) * 70)}" r="${f(110 + n * 25)}" fill="#D0D0D0" opacity="0.16"/>`;
    const q = t % 5.2;
    if (q > 3.9 && q < 4.5) s += `<text x="${f(hx + 250)}" y="${f(top + 40)}" font-size="96" font-weight="900" fill="#fff" stroke="${OUT}" stroke-width="10" paint-order="stroke" font-family="${FUENTE}" text-anchor="middle" transform="rotate(-10 ${f(hx + 250)} ${f(top + 40)})">KUCH!</text>`;
  }
  if (accion === "enfadado") {
    for (let n = 0; n < 6; n++) {
      const q = ((t * 0.9 + n / 6) % 1), lado = n % 2 ? 1 : -1;
      s += `<circle cx="${f(hx + lado * (170 + q * 90))}" cy="${f(top + 60 - q * 200)}" r="${f(24 + q * 40)}" fill="#EDEDED" opacity="${f(0.75 * (1 - q))}"/>`;
    }
    const k = 1 + Math.abs(Math.sin(t * 8)) * 0.2;
    s += `<g transform="translate(${f(hx + 190)} ${f(top + 40)}) scale(${f(k)})"><path d="M-30 -8 Q-8 -8 -8 -30 M8 -30 Q8 -8 30 -8 M30 8 Q8 8 8 30 M-8 30 Q-8 8 -30 8" stroke="#FF2E4D" stroke-width="12" fill="none" stroke-linecap="round"/></g>`;
  }
  if (accion === "sorprendido") {
    for (let n = 0; n < 3; n++) {
      const q = salida(lim((dt - n * 0.08) / 0.35, 0, 1)), x = hx - 90 + n * 90;
      s += `<text x="${x}" y="${f(top - 10 - q * 50)}" font-size="${f(110 * q)}" font-weight="900" fill="#FFE14D" stroke="${OUT}" stroke-width="8" paint-order="stroke" text-anchor="middle" font-family="${FUENTE}" transform="rotate(${(n - 1) * 14} ${x} ${f(top - 40)})">!</text>`;
    }
  }
  if (accion === "contento" || accion === "trofeo" || accion === "correr") {
    const colores = ["#FFD23F", "#FF4D6D", "#4DD7FF", "#7CFF6B", "#FF8A3D"];
    for (let n = 0; n < 44; n++) {
      const x = azar(n) * 1080, v = 300 + azar(n + 9) * 400, y = -60 + ((t * v + azar(n + 3) * 2000) % 2000);
      s += `<rect x="${f(x)}" y="${f(y)}" width="18" height="30" rx="4" fill="${colores[n % 5]}" transform="rotate(${f(t * 200 + n * 37)} ${f(x + 9)} ${f(y + 15)})"/>`;
    }
  }
  if (accion === "dinero") {                       // tira billetes hacia fuera (nunca por delante de la cara)
    const [mx, my] = A.billetes || [hx - 240, hy + 40];
    for (let n = 0; n < 8; n++) {
      const q = ((t * 0.9 + n / 8) % 1), x = mx - 40 - (0.3 + azar(n) * 0.7) * 420 * q, y = my - 260 * Math.sin(q * Math.PI) + q * 420;
      s += billete(x, y, q * 360 + n * 40);
    }
  }
  if (accion === "triste" || accion === "hospital") {
    const ny = top - 40;
    s += `<g opacity="0.95"><ellipse cx="${hx - 60}" cy="${ny}" rx="110" ry="62" fill="#7C8AA5"/><ellipse cx="${hx + 60}" cy="${ny - 18}" rx="120" ry="78" fill="#8C9AB5"/><ellipse cx="${hx}" cy="${ny + 18}" rx="150" ry="55" fill="#6F7D98"/></g>`;
    for (let n = 0; n < 12; n++) {
      const q = (t * 1.6 + n / 12) % 1, x = hx - 130 + (n * 23) % 260;
      s += `<line x1="${x}" y1="${f(ny + 50 + q * 200)}" x2="${x - 6}" y2="${f(ny + 80 + q * 200)}" stroke="#9FD8FF" stroke-width="7" stroke-linecap="round" opacity="${f(1 - q)}"/>`;
    }
  }
  if (accion === "pensativo" || accion === "ceja") {
    const k = salida(lim(dt / 0.4, 0, 1));
    const bx = hx + 300, by = top + 60;
    if (accion === "pensativo")
      s += `<g transform="translate(${f(bx)} ${f(by)}) scale(${f(k)})"><circle cx="-150" cy="150" r="14" fill="#fff" stroke="${OUT}" stroke-width="4"/><circle cx="-105" cy="100" r="24" fill="#fff" stroke="${OUT}" stroke-width="5"/>
            <ellipse cx="0" cy="0" rx="110" ry="85" fill="#fff" stroke="${OUT}" stroke-width="6"/>
            <text x="0" y="40" font-size="115" font-weight="900" text-anchor="middle" fill="#2B6CB0" font-family="${FUENTE}" transform="rotate(${f(Math.sin(t * 3) * 10)} 0 0)">?</text></g>`;
    else s += `<text x="${f(bx - 20)}" y="${f(by + 20)}" font-size="82" font-weight="900" text-anchor="middle" fill="#FFE14D" stroke="${OUT}" stroke-width="8" paint-order="stroke" font-family="${FUENTE}" transform="rotate(12 ${f(bx)} ${f(by)})">hm…</text>`;
  }
  if (accion === "hombros") for (const lado of [-1, 1]) s += `<text x="${f(hx + lado * 330)}" y="${f(hy - 40 - Math.abs(Math.sin(t * 5)) * 30)}" font-size="90" font-weight="900" text-anchor="middle" fill="#fff" stroke="${OUT}" stroke-width="8" paint-order="stroke" font-family="${FUENTE}">?</text>`;
  if (accion === "correr") for (let n = 0; n < 5; n++) s += `<line x1="${f(hx - 330 - n * 20)}" y1="${f(hy - 60 + n * 90)}" x2="${f(hx - 480 - n * 30)}" y2="${f(hy - 60 + n * 90)}" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="${f(0.5 + 0.5 * Math.sin(t * 20 + n))}"/>`;
  if (accion === "telefono") for (let n = 0; n < 3; n++) {
    const q = (t * 1.5 + n / 3) % 1;
    s += `<path d="M${f(hx + 230 + q * 60)} ${f(hy - 60)} q${f(30 + q * 30)} 60 0 ${f(120 + q * 40)}" stroke="#FFE14D" stroke-width="8" fill="none" stroke-linecap="round" opacity="${f(1 - q)}"/>`;
  }
  return s;
}

let FOTOS = [];
window.preparar = async function () {
  const g = window.GUION;
  const cont = document.getElementById("tarjeta");
  const cargas = [];
  FOTOS = (g.fotos || []).map(ruta => {
    const caja = document.createElementNS(NS, "g");
    caja.setAttribute("visibility", "hidden");
    const marco = document.createElementNS(NS, "rect");
    for (const [k, v] of Object.entries({ x: -362, y: -472, width: 724, height: 944, rx: 18 })) marco.setAttribute(k, v);
    const dentro = document.createElementNS(NS, "g");
    dentro.setAttribute("clip-path", "url(#recorte)");
    const fondo = document.createElementNS(NS, "image");
    for (const [k, v] of Object.entries({ x: -360, y: -470, width: 720, height: 940, preserveAspectRatio: "xMidYMid slice", filter: "url(#difuso)" })) fondo.setAttribute(k, v);
    fondo.setAttribute("href", "file://" + ruta);
    dentro.appendChild(fondo);
    const img = document.createElementNS(NS, "image");
    for (const [k, v] of Object.entries({ x: -330, y: -440, width: 660, height: 880, preserveAspectRatio: "xMidYMid meet" })) img.setAttribute(k, v);
    cargas.push(new Promise(ok => { img.addEventListener("load", ok); img.addEventListener("error", ok); }));
    img.setAttribute("href", "file://" + ruta);
    const brillo = document.createElementNS(NS, "path");
    brillo.setAttribute("d", "M-330 -440 L-90 -440 L-250 440 L-330 440 Z"); brillo.setAttribute("fill", "#fff"); brillo.setAttribute("opacity", "0.06");
    dentro.append(img, brillo);
    caja.append(marco, dentro);
    cont.appendChild(caja);
    return { caja, img, marco };
  });
  prepararChico(cargas);
  await Promise.race([Promise.all(cargas), new Promise(ok => setTimeout(ok, 15000))]);
  return true;
};

function tramo(t) {
  const tr = (window.GUION && GUION.tramos) || [];
  let i = tr.findIndex(x => t >= x.desde && t < x.hasta);
  if (i < 0) i = Math.max(0, tr.length - 1);
  return { i, x: tr[i] || { desde: 0, hasta: 1, emocion: "serio" } };
}

function boca(t) {
  for (const w of (GUION.palabras || [])) {
    if (t >= w.i - 0.02 && t <= w.f + 0.02) return 0.3 + 0.7 * Math.abs(Math.sin((t - w.i) * Math.PI * 6.5));
  }
  return 0;
}

// Cuando la voz hace una pausa, el chico reacciona como una persona: da un sorbo al café, levanta una ceja mirando a
// cámara o se encoge de hombros (va rotando).
function enPausa(t) {
  const p = (window.GUION && GUION.palabras) || [];
  for (let k = 0; k + 1 < p.length; k++) {
    const fin = p[k].f, sig = p[k + 1].i;
    if (t > fin + 0.06 && t < sig - 0.04 && sig - fin >= 0.45) return ["ceja", "beber", "hombros"][k % 3];
    if (p[k].i > t) break;
  }
  if (p.length && t > p[p.length - 1].f + 0.1) return "ceja";
  return null;
}

function partir(texto, ancho) {
  const lineas = [], palabras = String(texto).toUpperCase().split(/\s+/);
  let l = "";
  for (const p of palabras) { if (l && (l + " " + p).length > ancho) { lineas.push(l); l = p; } else l = (l + " " + p).trim(); }
  if (l) lineas.push(l);
  return lineas.slice(0, 4);
}
function pizarra(x, dt) {          // «LES 1»: lo que se aprende de esta persona, en una pizarra que el chico señala
  const q = salida(lim(dt / 0.4, 0, 1));
  const lineas = partir(x.leccion, 17);
  let s = `<g transform="translate(540 470) scale(${f((0.6 + 0.4 * q) * 0.82)}) rotate(${f(-2 * q)})">`;
  s += `<rect x="-470" y="-360" width="940" height="720" rx="20" fill="#8B5A2B" stroke="${OUT}" stroke-width="10"/>`;
  s += `<rect x="-440" y="-330" width="880" height="660" rx="10" fill="#1F3B2D"/>`;
  s += `<rect x="-200" y="-300" width="400" height="110" rx="55" fill="#FFE14D" stroke="${OUT}" stroke-width="8"/>`;
  s += `<text x="0" y="-222" text-anchor="middle" font-size="76" font-weight="900" font-family="${FUENTE}" fill="${OUT}">${String(x.titulo_leccion || "LES").replace(/[<&]/g, "")}</text>`;
  lineas.forEach((l, k) => {
    const v = lim((dt - 0.25 - k * 0.25) / 0.3, 0, 1);
    s += `<text x="0" y="${-70 + k * 105}" text-anchor="middle" font-size="84" font-weight="900" font-family="${FUENTE}" fill="#FFFFFF" opacity="${f(v)}">${l.replace(/[<&]/g, "")}</text>`;
  });
  s += `<path d="M-300 ${f(-70 + lineas.length * 105 - 40)} q300 ${f(30 * q)} 600 0" stroke="#FFE14D" stroke-width="10" fill="none" stroke-linecap="round" opacity="${f(lim((dt - 0.9) / 0.3, 0, 1))}"/>`;
  return s + `</g>`;
}

const FOTO_Y = 450, FOTO_K = 0.7;      // la foto acaba en ~790: los subtítulos (hasta 3 líneas) caben debajo       // la foto arriba, encima de los subtítulos y de la cabeza del chico

window.pintar = function (t) {
  const { i, x } = tramo(t);
  let accion = x.leccion ? "senala" : (x.accion || x.emocion || "serio");
  const pausa = enPausa(t);
  if (pausa && !["fumar", "trofeo", "balon", "dinero", "correr", "telefono"].includes(accion)) accion = pausa;
  const dt = t - x.desde;
  const b = boca(t);
  // decorado de la escena
  const fondo = x.leccion ? "oficina" : DECORADOS[x.fondo] ? x.fondo : (DE_ACCION[accion] || DE_EMOCION[x.emocion] || "habitacion");
  const dec = DECORADOS[fondo](t);
  document.getElementById("decorado").innerHTML = dec.s;
  document.getElementById("delante").innerHTML = dec.delante || "";
  // cámara: golpe al cambiar de escena y temblor al enfadarse
  const golpe = 1 + 0.05 * Math.exp(-dt * 6);
  const fuerte = accion === "enfadado" ? 6 : 0;
  document.getElementById("camara").setAttribute("transform",
    `translate(${f(540 + Math.sin(t * 47) * fuerte)} ${f(960 + Math.cos(t * 39) * fuerte)}) scale(${f(golpe)}) translate(-540 -960)`);
  // la foto, dentro del decorado (si la escena es una lección, va la pizarra en su lugar)
  const n = x.leccion ? -1 : FOTOS.length ? ((x.foto != null ? x.foto : i) % FOTOS.length) : -1;
  document.getElementById("pizarra").innerHTML = x.leccion ? pizarra(x, dt) : "";
  FOTOS.forEach((ft, k) => ft.caja.setAttribute("visibility", k === n ? "visible" : "hidden"));
  if (n >= 0) {
    const ft = FOTOS[n];
    const tipo = dec.foto[3];
    const [color] = MARCOS[tipo] || MARCOS.madera;
    ft.marco.setAttribute("fill", color);
    ft.marco.setAttribute("stroke", OUT); ft.marco.setAttribute("stroke-width", "8");
    const q = lim(dt / 0.4, 0, 1);
    const k = FOTO_K * (0.7 + 0.3 * salida(q) + Math.sin(q * Math.PI) * 0.05);
    const rot = tipo === "madera" ? (i % 2 ? 1.5 : -1.5) : 0;
    ft.caja.setAttribute("transform", `translate(540 ${FOTO_Y}) rotate(${rot}) scale(${f(k * 100) / 100})`);
    const z = 1.04 + 0.08 * lim(dt / Math.max(1, x.hasta - x.desde), 0, 1);
    ft.img.setAttribute("transform", `scale(${f(z * 100) / 100}) translate(${f((i % 2 ? -1 : 1) * dt * 6)} 0)`);
  }
  // el chico
  let A = { cabeza: [540, OJOS_Y], arriba: OJOS_Y - 300, brasa: null, billetes: null };
  if (CHICO) A = moverChico(t, accion, elegirPose(accion, x, i, dt), b, dt);
  document.getElementById("detras").innerHTML = efectosDetras(accion, t);
  document.getElementById("efectos").innerHTML = efectos(accion, t, dt, A);
  document.getElementById("foco").setAttribute("opacity", f(0.85 + 0.15 * Math.sin(t * 7) * Math.sin(t * 3.1)));
  // el texto que salta (p. ej. «x20»), a la izquierda de la cara: ni encima de los subtítulos ni de los botones de TikTok
  let pop = "";
  if (x.pop) {
    const q = lim(dt / 0.35, 0, 1), k = salida(q) * (1 + Math.sin(q * Math.PI) * 0.25);
    const txt = String(x.pop).replace(/[<&]/g, "");
    pop = `<g transform="translate(205 1215) rotate(-8) scale(${f(k * 100) / 100})"><text x="0" y="0" text-anchor="middle" font-size="140" font-weight="900" font-family="${FUENTE}" fill="#C8102E" transform="translate(10 10)">${txt}</text><text x="0" y="0" text-anchor="middle" font-size="140" font-weight="900" font-family="${FUENTE}" fill="#FFFFFF" stroke="${OUT}" stroke-width="16" paint-order="stroke">${txt}</text></g>`;
  }
  document.getElementById("pop").innerHTML = pop;
};
window.listo = true;
</script>
