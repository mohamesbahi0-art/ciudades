<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Hipnótico</title>
<!-- «Hipnótico»: bolas de neón que rebotan con gravedad dentro de un aro que gira, con estela; cada bote las hace crecer,
     deja una onda en el aro y de vez en cuando nace otra bola. Encima, la historia narrada con subtítulos grandes al
     ritmo de la voz. Lo usa render.js: window.GUION = guion; await window.listo; window.pintar(t) para cada fotograma,
     en orden (la física avanza paso a paso y siempre sale igual).
     Lo que pone el formato solo: el gancho entero desde el fotograma 0 (con las bolas ya en marcha), un plano nuevo en
     cada corte de GUION.planos (salta la cámara, cambian los colores y las bolas reciben un empujón), el icono de cada
     escena en el centro del aro, el final (desde GUION.giro) en rojo y temblando, y sin fundido a negro. -->
<style>
@font-face{font-family:"Poppins";font-weight:600;src:url("fuentes/poppins-600.woff2") format("woff2")}
@font-face{font-family:"Poppins";font-weight:800;src:url("fuentes/poppins-800.woff2") format("woff2")}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#04050A}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
const W = 1080, H = 1920, CX = 540, CY = 900, R = 430, G = 1500, DT = 1 / 240, TAU = Math.PI * 2, CALENTAR = 1.4;
// Colores de miedo, uno por plano (el primero y el final, rojo sangre)
const PALETAS = [
  { c: ["#FF2A3D", "#FF7A3D", "#FFFFFF", "#FF2A7A"], fondo: "#2A070C" },
  { c: ["#22E6FF", "#7BA8FF", "#FFFFFF", "#9D7BFF"], fondo: "#071A30" },
  { c: ["#B45CFF", "#FF3DCB", "#FFFFFF", "#6A7BFF"], fondo: "#1B0A30" },
  { c: ["#62FF6B", "#C8FF3D", "#FFFFFF", "#22E6FF"], fondo: "#08200F" }];
// Planos de cámara: zoom, giro y desplazamiento del aro (general, primer plano, torcido, lejos...)
const CAMARAS = [
  { z: 1.00, r: 0.00, x: 0, y: 70 }, { z: 1.50, r: 0.05, x: -70, y: 120 }, { z: 1.16, r: -0.13, x: 0, y: 40 },
  { z: 0.84, r: 0.00, x: 0, y: 30 }, { z: 1.62, r: -0.06, x: 90, y: -50 }, { z: 1.20, r: 0.15, x: 0, y: 50 }];
const ctx = document.getElementById("c").getContext("2d");
const lim = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const suave = x => 1 - Math.pow(1 - lim(x), 3);
let E = null;      // el estado de la física

function azar(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function cortes() { return (window.GUION.planos || []).map(Number).filter(x => x > 0).sort((a, b) => a - b); }
function planoEn(t) { let n = 0; for (const c of cortes()) if (t >= c) n++; return n; }
function inicioPlano(n) { return n ? cortes()[n - 1] : 0; }
function giro() { const g = window.GUION; return Number(g.giro) > 0 ? Number(g.giro) : (g.duracion || 1e9); }
function paleta(t) {         // el rojo se guarda para el arranque y para el final; en medio se turnan los otros tres
  const n = planoEn(t);
  return (!n || t >= giro()) ? PALETAS[0] : PALETAS[1 + (n - 1) % (PALETAS.length - 1)];
}
function color(pal, i) { return pal.c[i % pal.c.length]; }

function iniciar() {
  E = { t: -CALENTAR, botes: 0, giro: 0, plano: 0, ondas: [], bolas: [
    { x: CX - 120, y: CY - 220, vx: 320, vy: 0, r: 26, c: 0, estela: [] },
    { x: CX + 140, y: CY - 120, vx: -260, vy: -120, r: 22, c: 1, estela: [] },
    { x: CX + 10, y: CY + 150, vx: 420, vy: -520, r: 18, c: 2, estela: [] }] };
  avanzar(0);      // el primer fotograma ya pilla las bolas en marcha, con su estela
}

function avanzar(t) {
  while (E.t + DT <= t + 1e-9) {
    const n = planoEn(E.t);
    if (n !== E.plano) {                         // plano nuevo: un empujón a cada bola (la imagen cambia de golpe)
      E.plano = n;
      E.bolas.forEach((b, i) => { const a = azar(n * 13 + i * 7) * TAU; b.vx = Math.cos(a) * 1050; b.vy = Math.sin(a) * 1050; });
      E.ondas.push({ a: azar(n) * TAU, t: E.t, c: 0 });
    }
    paso(DT); E.t += DT;
    if (Math.round(E.t / DT) % 4 === 0) for (const b of E.bolas) { b.estela.push([b.x, b.y]); if (b.estela.length > 14) b.estela.shift(); }
  }
}

function paso(dt) {
  E.giro += dt * 0.6;
  for (const b of E.bolas) {
    b.vy += G * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    const dx = b.x - CX, dy = b.y - CY, d = Math.hypot(dx, dy) || 1;
    if (d + b.r > R - 8) {                       // choca con el aro: rebota (con un poco más de fuerza, para no parar)
      const nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
      if (vn > 0) {
        b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny;
        const v = Math.hypot(b.vx, b.vy), objetivo = Math.max(v, 980);
        b.vx *= objetivo / v * 1.004; b.vy *= objetivo / v * 1.004;
        E.botes++;
        b.r = Math.min(40, b.r + 1.0);           // cada bote, un poco más grande
        b.c++;                                   // y cambia de color
        E.ondas.push({ a: Math.atan2(ny, nx), t: E.t, c: b.c });
        if (E.botes % 9 === 0 && E.bolas.length < 6) {   // de vez en cuando, nace otra bola
          const k = E.bolas.length;
          E.bolas.push({ x: CX + (azar(k) - 0.5) * 200, y: CY - 250, vx: (azar(k + 9) - 0.5) * 700, vy: -200, r: 16,
                         c: k, estela: [] });
        }
      }
      const dentro = R - 8 - b.r - 0.5;
      b.x = CX + (dx / d) * dentro; b.y = CY + (dy / d) * dentro;
    }
  }
  E.ondas = E.ondas.filter(o => E.t - o.t < 0.9);
}

function brillo(c, blur) { ctx.shadowColor = c; ctx.shadowBlur = blur; }

function camara(t) {         // dónde mira la cámara: salta en cada plano y, dentro del plano, se acerca despacio
  const n = planoEn(t), t0 = inicioPlano(n), a = CAMARAS[n % CAMARAS.length], b = n ? CAMARAS[(n - 1) % CAMARAS.length] : a;
  const q = n ? suave((t - t0) / 0.14) : 1, mez = (k) => b[k] + (a[k] - b[k]) * q;
  const c = { z: mez("z") * (1 + 0.035 * (t - t0)), r: mez("r") + 0.012 * (t - t0), x: mez("x"), y: mez("y") };
  if (t >= giro()) {                             // el final tiembla
    const f = 5 + 6 * lim((t - giro()) / 1.5), u = t - giro();
    c.z = 1.22 + 0.05 * u + 0.03 * Math.sin(u * 7); c.r = 0.03 * Math.sin(u * 2.3); c.x = 0; c.y = 60;   // y se acerca, latiendo
    c.x += Math.sin(t * 61) * f; c.y += Math.cos(t * 53) * f;
  }
  return c;
}

function aro(pal) {
  const pulso = E.ondas.length ? Math.max(...E.ondas.map(o => 1 - (E.t - o.t) / 0.9)) : 0;
  ctx.save();
  ctx.lineWidth = 10 + 6 * pulso;
  const g = ctx.createConicGradient(E.giro, CX, CY), cs = pal.c.concat([pal.c[0]]);
  cs.forEach((c, i) => g.addColorStop(i / (cs.length - 1), c));
  ctx.strokeStyle = g; brillo(pal.c[0], 30 + 30 * pulso);
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.stroke();
  for (const o of E.ondas) {                    // la onda del bote, que se abre por el aro
    const p = (E.t - o.t) / 0.9, c = color(pal, o.c);
    ctx.strokeStyle = c; ctx.globalAlpha = 1 - p; ctx.lineWidth = 14 * (1 - p) + 2; brillo(c, 40);
    ctx.beginPath(); ctx.arc(CX, CY, R, o.a - 0.15 - p * 0.9, o.a + 0.15 + p * 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(CX + Math.cos(o.a) * R, CY + Math.sin(o.a) * R, 10 + 120 * p, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function bolas(pal) {
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  for (const b of E.bolas) {
    const c = color(pal, b.c);
    b.estela.forEach((p, i) => {                // la estela: círculos que se apagan
      const q = (i + 1) / b.estela.length;
      ctx.globalAlpha = 0.28 * q; ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(p[0], p[1], b.r * (0.4 + 0.6 * q), 0, TAU); ctx.fill();
    });
    ctx.globalAlpha = 1; brillo(c, 45); ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.28, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// Los iconos: trazos de neón en una caja de 200 × 200 con el centro en (0, 0). Los nombres, los de hipnotico.ICONOS
function circ(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function linea(...p) { ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); }
const ICONOS = {
  ojo(m) { ctx.moveTo(-98, 0); ctx.quadraticCurveTo(0, -92, 98, 0); ctx.quadraticCurveTo(0, 92, -98, 0); circ(m[0], m[1], 34); },
  puerta() { ctx.rect(-56, -96, 112, 192); linea(-56, -96, 14, -74, 14, 96); circ(-4, 8, 7); },
  telefono() { ctx.roundRect(-50, -96, 100, 192, 16); linea(-14, -76, 14, -76); circ(0, 72, 8); linea(-26, -30, 26, -30); linea(-26, -4, 12, -4); },
  cama() { linea(-98, -56, -98, 66); linea(98, 4, 98, 66); ctx.rect(-98, 4, 196, 36); ctx.roundRect(-86, -24, 62, 28, 10); linea(-20, 4, -8, -18, 98, -18, 98, 4); },
  casa() { linea(-98, -6, 0, -96, 98, -6); ctx.rect(-68, -6, 136, 100); ctx.rect(-16, 38, 32, 56); ctx.rect(26, 12, 28, 28); },
  luna() { ctx.arc(0, 0, 84, Math.PI / 3, -Math.PI / 3); ctx.arc(48, 0, 73, -1.66, 1.66, true); ctx.closePath(); },
  llave() { circ(-52, 0, 32); linea(-20, 0, 96, 0); linea(62, 0, 62, 30); linea(86, 0, 86, 22); },
  reloj() { circ(0, 0, 90); linea(0, 0, 0, -58); linea(0, 0, 40, 24); linea(0, -90, 0, -76); linea(90, 0, 76, 0); linea(0, 90, 0, 76); linea(-90, 0, -76, 0); },
  espejo() { ctx.moveTo(62, -18); ctx.ellipse(0, -18, 62, 82, 0, 0, TAU); linea(0, 64, 0, 96); linea(-38, 96, 38, 96); linea(-20, -60, 6, -22, -12, 4, 14, 36); },
  bosque() { for (const [x, a] of [[-66, 0.8], [0, 1], [66, 0.8]]) { linea(x, -96 * a, x - 42 * a, 44, x + 42 * a, 44, x, -96 * a); linea(x, 44, x, 92); } },
  sombra() { circ(0, -62, 30); ctx.moveTo(-62, 98); ctx.quadraticCurveTo(-62, -22, 0, -22); ctx.quadraticCurveTo(62, -22, 62, 98); ctx.closePath(); },
  voz() { ctx.moveTo(-78 + 20 * Math.cos(-0.9), 30 * Math.sin(-0.9)); ctx.ellipse(-78, 0, 20, 30, 0, -0.9, 0.9);
          for (const r of [44, 82, 120]) { ctx.moveTo(-70 + r * Math.cos(-0.7), r * Math.sin(-0.7)); ctx.arc(-70, 0, r, -0.7, 0.7); } },
  ventana() { ctx.rect(-74, -92, 148, 184); linea(0, -92, 0, 92); linea(-74, 0, 74, 0); },
};

function icono(t, pal) {     // el icono de la escena, en el centro del aro: lo que cuenta la voz en ese momento
  const g = window.GUION, e = g.escenas.find(x => t < x.fin) || g.escenas[g.escenas.length - 1];
  const nombre = e.icono;
  if (!nombre || (nombre !== "pregunta" && !ICONOS[nombre])) return;
  const entra = e.inicio > 0 ? suave((t - e.inicio) / 0.22) : 1, parpadeo = azar(Math.floor(t * 14)) > 0.88 ? 0.55 : 1;
  const c = pal.c[0], b = E.bolas[0], d = Math.hypot(b.x - CX, b.y - CY) || 1;
  const mira = [(b.x - CX) / d * 20, (b.y - CY) / d * 14];          // la pupila sigue a la primera bola
  const tam = 1.55 * (0.7 + 0.3 * entra);
  ctx.save(); ctx.translate(CX, CY); ctx.scale(tam, tam);
  ctx.globalAlpha = Math.max(0.3, entra) * parpadeo * 0.95; ctx.lineJoin = "round"; ctx.lineCap = "round";
  if (nombre === "pregunta") {
    ctx.font = "800 250px Poppins"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 12; ctx.strokeStyle = c; brillo(c, 40); ctx.strokeText("?", 0, 14);
    ctx.shadowBlur = 0; ctx.lineWidth = 3.5; ctx.strokeStyle = "#FFFFFF"; ctx.strokeText("?", 0, 14);
  } else {
    if (nombre === "sombra") { ctx.beginPath(); ICONOS.sombra(); ctx.fillStyle = "rgba(0,0,0,0.75)"; ctx.fill(); }
    ctx.beginPath(); ICONOS[nombre](mira);
    ctx.lineWidth = 12; ctx.strokeStyle = c; brillo(c, 40); ctx.stroke();
    ctx.shadowBlur = 0; ctx.lineWidth = 3.5; ctx.strokeStyle = "#FFFFFF"; ctx.stroke();
    ctx.fillStyle = "#FFFFFF"; brillo(c, 24); ctx.beginPath();
    if (nombre === "ojo") circ(mira[0], mira[1], 13);
    if (nombre === "sombra") { circ(-11, -64, 5); circ(11, -64, 5); }
    ctx.fill();
  }
  ctx.restore();
}

function palabrasDe(e) {
  if (e.palabras && e.palabras.length) return e.palabras;
  const ws = String(e.voz || e.texto || "").split(/\s+/).filter(Boolean), d = Math.max(0.5, e.fin - e.inicio - 0.3);
  return ws.map((p, i) => ({ p, a: e.inicio + (d * i) / ws.length, b: e.inicio + (d * (i + 1)) / ws.length }));
}

function gruposDe(ws) {      // de 1 a 3 palabras por golpe de vista: nunca más de 16 letras, y el punto cierra el grupo
  const grupos = [];
  let g = [], letras = 0;
  for (const w of ws) {
    const n = String(w.p).length;
    if (g.length && (g.length >= 3 || letras + n > 16)) { grupos.push(g); g = []; letras = 0; }
    g.push(w); letras += n + 1;
    if (/[.!?…:]["»)]*$/.test(String(w.p))) { grupos.push(g); g = []; letras = 0; }
  }
  if (g.length) grupos.push(g);
  return grupos;
}

function texto(t) {          // los subtítulos: la palabra que suena, en color y un poco más grande
  const g = window.GUION, e = g.escenas.find(x => t < x.fin) || g.escenas[g.escenas.length - 1];
  const grupos = gruposDe(palabrasDe(e));
  const grupo = grupos.find(gr => t < (gr[gr.length - 1].b + 0.08)) || grupos[grupos.length - 1];
  const primero = e === g.escenas[0] && grupo === grupos[0];        // el primero ya está en el fotograma 0
  if (!grupo || (!primero && t < grupo[0].a - 0.1)) return;
  const vivo = t >= giro() ? "#FF4B5C" : "#FFE23D";
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  const piezas = grupo.map(w => ({ w, on: t >= w.a && t < w.b + 0.05 }));
  const anchos = piezas.map(p => { ctx.font = `800 ${p.on ? 100 : 92}px Poppins`; return ctx.measureText(String(p.w.p).toUpperCase()).width; });
  const total = anchos.reduce((a, b) => a + b, 0) + 30 * (piezas.length - 1);
  const escala = total > 960 ? 960 / total : 1;
  let x = CX - total * escala / 2;
  const entra = primero ? 1 : lim((t - grupo[0].a + 0.1) / 0.12), y = 1450 + (1 - entra) * 40;
  piezas.forEach((p, i) => {
    const w = anchos[i] * escala, palabra = String(p.w.p).toUpperCase();
    ctx.font = `800 ${Math.round((p.on ? 100 : 92) * escala)}px Poppins`;
    ctx.lineWidth = 18 * escala; ctx.strokeStyle = "#000"; ctx.globalAlpha = entra; ctx.shadowBlur = 0;
    ctx.strokeText(palabra, x + w / 2, y);
    ctx.fillStyle = p.on ? vivo : "#FFFFFF"; brillo(p.on ? vivo : "transparent", p.on ? 18 : 0);
    ctx.fillText(palabra, x + w / 2, y); ctx.shadowBlur = 0;
    x += w + 30 * escala;
  });
  ctx.restore();
}

function lineasDe(txt) {     // el gancho, en 3 líneas como mucho y sin partir palabras
  const palabras = txt.split(/\s+/).filter(Boolean);
  for (let tope = 13; tope < 60; tope++) {
    const lineas = [];
    let l = "";
    for (const p of palabras) { if (l && (l + " " + p).length > tope) { lineas.push(l); l = p; } else l = (l + " " + p).trim(); }
    if (l) lineas.push(l);
    if (lineas.length <= 3) return lineas;
  }
  return [txt];
}

function gancho(t, pal) {    // el gancho: entero y en grande desde el fotograma 0; después se queda pequeño arriba
  const g = window.GUION, txt = String(g.texto_pantalla || "").toUpperCase().trim();
  if (!txt) return;
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  if (t < 2.6) {
    const lineas = lineasDe(txt);
    ctx.font = "800 100px Poppins";
    const ancho = Math.max(...lineas.map(l => ctx.measureText(l).width));
    const cuerpo = Math.min(112, Math.floor(100 * 900 / ancho)), alto = cuerpo * 1.14;
    const sale = lim((2.6 - t) / 0.25), pop = 1 + 0.06 * (1 - suave(t / 0.3)) + 0.01 * Math.sin(t * 9);
    ctx.globalAlpha = sale;
    const velo = ctx.createLinearGradient(0, 0, 0, 620);      // un velo oscuro detrás, para que se lea sobre cualquier cosa
    velo.addColorStop(0, "rgba(0,0,0,0.82)"); velo.addColorStop(0.7, "rgba(0,0,0,0.6)"); velo.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = velo; ctx.fillRect(0, 0, W, 620);
    ctx.translate(CX, 318 - (1 - sale) * 60); ctx.scale(pop, pop);
    ctx.font = `800 ${cuerpo}px Poppins`;
    lineas.forEach((ln, i) => {
      const y = (i - (lineas.length - 1) / 2) * alto;
      ctx.shadowBlur = 0; ctx.lineWidth = 20; ctx.strokeStyle = "#000"; ctx.strokeText(ln, 0, y);
      ctx.fillStyle = i === lineas.length - 1 ? "#FF4B5C" : "#FFFFFF"; brillo(pal.c[0], 26); ctx.fillText(ln, 0, y);
    });
  } else {
    ctx.font = "800 46px Poppins";
    const ancho = ctx.measureText(txt).width, cuerpo = Math.min(46, Math.floor(46 * 940 / ancho));
    ctx.font = `800 ${cuerpo}px Poppins`; ctx.globalAlpha = 0.9 * lim((t - 2.6) / 0.25);
    ctx.lineWidth = 10; ctx.strokeStyle = "#000"; ctx.strokeText(txt, CX, 190);
    ctx.fillStyle = "#FFFFFF"; brillo(pal.c[0], 14); ctx.fillText(txt, CX, 190);
  }
  ctx.restore();
}

window.pintar = function (t) {
  if (!E || t < E.t - 1e-6) iniciar();
  avanzar(t);
  const pal = paleta(t), n = planoEn(t), t0 = inicioPlano(n), cam = camara(t);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.globalCompositeOperation = "source-over";
  const fondo = ctx.createRadialGradient(CX + cam.x, CY + cam.y, 60, CX + cam.x, CY + cam.y, 1250);
  fondo.addColorStop(0, pal.fondo); fondo.addColorStop(1, "#020308");
  ctx.fillStyle = fondo; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(CX + cam.x, CY + cam.y); ctx.rotate(cam.r); ctx.scale(cam.z, cam.z); ctx.translate(-CX, -CY);
  aro(pal); bolas(pal); icono(t, pal);          // el icono, por delante: siempre se reconoce
  ctx.restore();
  const borde = ctx.createRadialGradient(CX, 960, 520, CX, 960, 1150);       // los bordes, a oscuras
  borde.addColorStop(0, "rgba(0,0,0,0)"); borde.addColorStop(1, "rgba(0,0,0,0.6)");
  ctx.fillStyle = borde; ctx.fillRect(0, 0, W, H);
  const fogonazo = Math.max(n ? 1 - (t - t0) / 0.16 : 0, t >= giro() ? 1 - (t - giro()) / 0.3 : 0);
  if (fogonazo > 0) { ctx.globalAlpha = 0.3 * fogonazo; ctx.fillStyle = pal.c[0]; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  gancho(t, pal); texto(t);
};
window.listo = Promise.all([600, 800].map(w => document.fonts.load(`${w} 60px Poppins`))).then(() => document.fonts.ready);
</script>
</body></html>
