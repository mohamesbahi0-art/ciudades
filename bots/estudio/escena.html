<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #07070b; }
  #lienzo { width: 1080px; height: 1920px; overflow: hidden; }
  svg text { font-family: "Inter", "Inter Display", "DejaVu Sans", sans-serif; }
</style>
</head>
<body>
<div id="lienzo"></div>
<script>
// Estudio de animación de las ciudades: dibuja el fotograma del segundo t a partir del guion (window.GUION).
// Todo depende solo de t, así el vídeo sale igual cada vez (no se usa el reloj del navegador).
const W = 1080, H = 1920, SUELO = 1390;
const ORO = "#FFD24A", MORADO = "#A97CF8", ROJO = "#FF5A5F", VERDE = "#4ADE80", GRIS = "#8B8F9C";

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const suave = x => { x = clamp(x); return x * x * (3 - 2 * x); };
function rebote(x) {            // 0 → 1 con un pequeño rebote (pop)
  x = clamp(x);
  if (x < 0.6) return suave(x / 0.6) * 1.12;
  return 1.12 - 0.12 * suave((x - 0.6) / 0.4);
}
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// ---------- texto con palabras resaltadas ----------
const regla = document.createElement("canvas").getContext("2d");
function medir(palabra, tam) { regla.font = `900 ${tam}px Inter, "Inter Display", "DejaVu Sans", sans-serif`; return regla.measureText(palabra).width; }
function partirLineas(palabras, tam, ancho) {
  const hueco = tam * 0.28, lineas = []; let actual = [], largo = 0;
  for (const p of palabras) {
    p.w = medir(p.t, tam);
    const l = p.w + hueco;
    if (actual.length && largo + l > ancho) { lineas.push(actual); actual = []; largo = 0; }
    actual.push(p); largo += l;
  }
  if (actual.length) lineas.push(actual);
  return lineas;
}
function texto(cad, resaltar, cx, y, tam, t0, t, opciones = {}) {
  const color = opciones.color || "#FFFFFF", acento = opciones.acento || ORO;
  const marcadas = (resaltar || []).map(r => r.toLowerCase());
  const palabras = String(cad || "").split(/\s+/).filter(Boolean).map(w => ({ t: w }));
  // una palabra se resalta si forma parte de alguna frase marcada
  for (const m of marcadas) {
    const trozos = m.split(/\s+/);
    for (let i = 0; i + trozos.length <= palabras.length; i++) {
      const ok = trozos.every((tr, k) => palabras[i + k].t.toLowerCase().replace(/[^\p{L}\p{N}]/gu, "") === tr.replace(/[^\p{L}\p{N}]/gu, ""));
      if (ok) for (let k = 0; k < trozos.length; k++) palabras[i + k].res = true;
    }
  }
  const lineas = partirLineas(palabras, tam, opciones.ancho || 900);
  let svg = "", n = 0;
  const hueco = tam * 0.28;
  lineas.forEach((linea, li) => {
    const ancho = linea.reduce((a, p) => a + p.w + hueco, 0) - hueco;
    let x = cx - ancho / 2;
    const yl = y + li * tam * 1.2;
    for (const p of linea) {
      const w = p.w;
      const d = t - t0 - n * 0.045;                     // las palabras entran una detrás de otra
      const k = opciones.sinAnimar ? 1 : rebote(d / 0.32);
      const op = opciones.sinAnimar ? 1 : clamp(d / 0.15);
      const col = p.res ? acento : color;
      svg += `<g transform="translate(${x + w / 2},${yl}) scale(${k})" opacity="${op}">` +
             `<text x="0" y="0" text-anchor="middle" font-size="${tam}" font-weight="900" fill="${col}">${esc(p.t)}</text>`;
      if (p.res) svg += `<rect x="${-w / 2}" y="${tam * 0.18}" width="${w * clamp((d - 0.25) / 0.3)}" height="${tam * 0.09}" rx="${tam * 0.04}" fill="${acento}"/>`;
      svg += `</g>`;
      x += w + hueco; n++;
    }
  });
  return svg;
}

// ---------- personajes ----------
function pose(nombre, t) {          // ángulos (grados) de brazos y piernas según la postura
  const s = Math.sin(t * 6), c = Math.cos(t * 6);
  switch (nombre) {
    case "camina": return { bi: 30 * s, bd: -30 * s, pi: 22 * s, pd: -22 * s, cab: 0, bob: Math.abs(c) * 6 };
    case "celebra": return { bi: 150 + 8 * s, bd: -150 - 8 * s, pi: 10, pd: -10, cab: 0, bob: Math.abs(s) * 14 };
    case "triste": return { bi: 8, bd: -8, pi: 6, pd: -6, cab: 18, bob: 0 };
    case "trabaja": return { bi: 20, bd: -60 - 50 * Math.max(0, Math.sin(t * 9)), pi: 12, pd: -12, cab: 6, bob: 0 };
    case "chuta": return { bi: 40, bd: -40, pi: 10, pd: -70 * Math.max(0, Math.sin(t * 4)), cab: 0, bob: 0 };
    case "piensa": return { bi: 12, bd: -130, pi: 8, pd: -8, cab: -8, bob: 0 };
    default: return { bi: 14 + 3 * s, bd: -14 - 3 * s, pi: 9, pd: -9, cab: 0, bob: Math.abs(s) * 3 };
  }
}
function extremidad(x, y, largo, ang, color, grosor) {
  const r = ang * Math.PI / 180;
  return `<line x1="${x}" y1="${y}" x2="${x + Math.sin(r) * largo}" y2="${y + Math.cos(r) * largo}" stroke="${color}" stroke-width="${grosor}" stroke-linecap="round"/>`;
}
function etiqueta(textoEt, x, y, colorTexto = "#FFFFFF", fondo = "#14141c", tam = 30) {
  regla.font = `800 ${tam}px Inter, sans-serif`;
  const w = regla.measureText(String(textoEt)).width + tam * 1.2;
  return `<rect x="${x - w / 2}" y="${y - tam}" width="${w}" height="${tam * 1.45}" rx="${tam * 0.5}" fill="${fondo}" stroke="${colorTexto}" stroke-opacity="0.35" stroke-width="2"/>` +
         `<text x="${x}" y="${y + tam * 0.08}" text-anchor="middle" font-size="${tam}" font-weight="800" fill="${colorTexto}">${esc(textoEt)}</text>`;
}
function persona(cfg, x, escala, t, aparecer) {
  // cfg: {tipo: "monigote" | "famoso" | "sombra", pose, color, nombre, camiseta, rayas, numero, piel, pelo, etiqueta}
  const p = pose(cfg.pose, t + (cfg.fase || 0));
  const k = escala * rebote(aparecer);
  const sombra = cfg.tipo === "sombra";
  const linea = sombra ? "#5d6170" : (cfg.color || "#F4F1EA");
  const y0 = SUELO - p.bob;
  let s = `<g transform="translate(${x},${y0}) scale(${k}) translate(0,${-0})" opacity="${clamp(aparecer * 3)}">`;
  s += `<ellipse cx="0" cy="8" rx="90" ry="14" fill="#000" opacity="0.45"/>`;
  const cadera = -190, hombro = -340;
  if (cfg.tipo === "famoso") {
    const piel = cfg.piel || "#E3B38A", cam = cfg.camiseta || "#2F6FDF";
    s += extremidad(-22, cadera + 10, 165, p.pi, piel, 26) + extremidad(22, cadera + 10, 165, p.pd, piel, 26);
    s += `<rect x="-52" y="${cadera - 20}" width="104" height="58" rx="14" fill="${cfg.pantalon || "#1b1d29"}"/>`;
    s += `<rect x="-62" y="${hombro}" width="124" height="${cadera - hombro + 6}" rx="22" fill="${cam}"/>`;
    if (cfg.rayas) for (let i = -1; i <= 1; i++) s += `<rect x="${i * 34 - 9}" y="${hombro}" width="18" height="${cadera - hombro + 6}" fill="${cfg.rayas}" opacity="0.9"/>`;
    s += extremidad(-64, hombro + 22, 140, p.bi + 8, cam, 26) + extremidad(64, hombro + 22, 140, p.bd - 8, cam, 26);
    s += extremidad(-64 + Math.sin((p.bi + 8) * Math.PI / 180) * 70, hombro + 22 + Math.cos((p.bi + 8) * Math.PI / 180) * 70, 72, p.bi + 8, piel, 22);
    s += extremidad(64 + Math.sin((p.bd - 8) * Math.PI / 180) * 70, hombro + 22 + Math.cos((p.bd - 8) * Math.PI / 180) * 70, 72, p.bd - 8, piel, 22);
    if (cfg.numero) s += `<text x="0" y="${hombro + 92}" text-anchor="middle" font-size="76" font-weight="900" fill="${cfg.colorNumero || "#FFFFFF"}" stroke="#0b0b10" stroke-width="3">${esc(cfg.numero)}</text>`;
    s += `<g transform="translate(0,${hombro - 70}) rotate(${p.cab})"><circle cx="0" cy="0" r="56" fill="${piel}"/>` +
         `<path d="M -56 -6 Q -50 -66 0 -64 Q 52 -66 56 -6 Q 30 -30 0 -32 Q -30 -30 -56 -6 Z" fill="${cfg.pelo || "#2a1c12"}"/>` +
         `<circle cx="-18" cy="6" r="6" fill="#1a1a1a"/><circle cx="18" cy="6" r="6" fill="#1a1a1a"/></g>`;
    if (cfg.nombre) s += etiqueta(cfg.nombre, 0, hombro - 162, "#FFFFFF", "#101018", 40);
  } else {
    const g = sombra ? 18 : 14;
    s += extremidad(0, cadera, 170, p.pi, linea, g) + extremidad(0, cadera, 170, p.pd, linea, g);
    s += `<line x1="0" y1="${cadera}" x2="0" y2="${hombro}" stroke="${linea}" stroke-width="${g}" stroke-linecap="round"/>`;
    s += extremidad(0, hombro + 10, 140, p.bi, linea, g - 2) + extremidad(0, hombro + 10, 140, p.bd, linea, g - 2);
    s += `<g transform="translate(0,${hombro - 62}) rotate(${p.cab})"><circle cx="0" cy="0" r="50" fill="${sombra ? "#5d6170" : "#0b0b10"}" stroke="${linea}" stroke-width="${g}"/>` +
         (sombra ? "" : `<circle cx="14" cy="-4" r="6" fill="${linea}"/>`) + `</g>`;
  }
  if (cfg.etiqueta) s += etiqueta(cfg.etiqueta, 0, cfg.tipo === "famoso" ? -625 : -505, sombra ? ROJO : (cfg.colorEtiqueta || ORO), "#101018", sombra ? 36 : 32);
  s += `</g>`;
  return s;
}

// ---------- iconos (dibujo de líneas) ----------
const ICONOS = {
  balon: `<circle cx="0" cy="0" r="60"/><path d="M0 -24 L22 -8 L14 18 L-14 18 L-22 -8 Z" fill="currentColor"/><path d="M0 -24 L0 -60 M22 -8 L56 -20 M14 18 L34 48 M-14 18 L-34 48 M-22 -8 L-56 -20"/>`,
  trofeo: `<path d="M-50 -70 H50 V-20 Q50 30 0 36 Q-50 30 -50 -20 Z"/><path d="M-50 -56 Q-90 -56 -84 -20 Q-78 4 -48 4 M50 -56 Q90 -56 84 -20 Q78 4 48 4"/><path d="M0 36 V64 M-34 70 H34"/>`,
  reloj_arena: `<path d="M-46 -80 H46 M-46 80 H46 M-38 -80 Q-38 -20 0 0 Q38 -20 38 -80 M-38 80 Q-38 20 0 0 Q38 20 38 80"/><path d="M-22 64 Q0 40 22 64 Z" fill="currentColor"/>`,
  calendario: `<rect x="-70" y="-60" width="140" height="130" rx="14"/><path d="M-70 -24 H70 M-36 -78 V-46 M36 -78 V-46"/><path d="M-40 0 H-22 M-8 0 H8 M22 0 H40 M-40 30 H-22 M-8 30 H8 M22 30 H40"/>`,
  bombilla: `<path d="M-30 30 Q-60 0 -60 -30 A60 60 0 0 1 60 -30 Q60 0 30 30 Z"/><path d="M-26 46 H26 M-20 62 H20"/>`,
  puerta: `<rect x="-50" y="-90" width="100" height="180" rx="6"/><circle cx="30" cy="4" r="7" fill="currentColor"/>`,
  fuego: `<path d="M0 -90 Q50 -30 40 20 Q34 70 0 80 Q-34 70 -40 20 Q-46 -20 -10 -46 Q-14 -10 6 4 Q14 -40 0 -90 Z" fill="#FF7A2F" stroke="#FFB347"/>`,
  lista: `<rect x="-62" y="-80" width="124" height="160" rx="12"/><path d="M-36 -40 l10 10 l20 -22 M-36 0 l10 10 l20 -22 M-36 40 l10 10 l20 -22"/><path d="M10 -38 H42 M10 2 H42 M10 42 H42"/>`,
  moneda: `<circle cx="0" cy="0" r="58"/><text x="0" y="22" text-anchor="middle" font-size="64" font-weight="900" fill="currentColor" stroke="none">€</text>`,
  libro: `<path d="M0 -50 Q-40 -70 -80 -50 V60 Q-40 40 0 60 Q40 40 80 60 V-50 Q40 -70 0 -50 Z M0 -50 V60"/>`,
  movil: `<rect x="-40" y="-76" width="80" height="152" rx="14"/><path d="M-12 -62 H12"/><circle cx="0" cy="58" r="6" fill="currentColor"/>`,
  montana: `<path d="M-90 70 L-20 -50 L20 10 L44 -20 L90 70 Z"/><path d="M-20 -50 V-90 L10 -80 L-20 -70"/>`,
  pesa: `<path d="M-80 0 H80"/><rect x="-74" y="-36" width="22" height="72" rx="6"/><rect x="52" y="-36" width="22" height="72" rx="6"/><rect x="-50" y="-24" width="14" height="48" rx="4"/><rect x="36" y="-24" width="14" height="48" rx="4"/>`,
  cohete: `<path d="M0 -90 Q36 -50 30 30 H-30 Q-36 -50 0 -90 Z"/><circle cx="0" cy="-30" r="12"/><path d="M-30 10 L-54 50 L-30 40 M30 10 L54 50 L30 40 M-14 34 Q0 80 14 34" />`,
  corazon: `<path d="M0 60 Q-80 0 -60 -40 Q-40 -76 0 -40 Q40 -76 60 -40 Q80 0 0 60 Z"/>`,
  estrella: `<path d="M0 -70 L18 -22 L68 -20 L28 10 L42 60 L0 30 L-42 60 L-28 10 L-68 -20 L-18 -22 Z"/>`,
  rayo: `<path d="M14 -80 L-36 10 H2 L-14 80 L40 -12 H4 Z" fill="${ORO}" stroke="${ORO}"/>`,
  check: `<circle cx="0" cy="0" r="58" stroke="${VERDE}"/><path d="M-26 0 L-6 22 L30 -20" stroke="${VERDE}"/>`,
  cruz: `<path d="M-60 -60 L60 60 M60 -60 L-60 60" stroke="${ROJO}" stroke-width="16"/>`,
  pregunta: `<path d="M-70 -50 Q-70 -80 -40 -80 H40 Q70 -80 70 -50 V10 Q70 40 40 40 H-6 L-30 70 L-26 40 H-40 Q-70 40 -70 10 Z" fill="#101018"/><text x="0" y="0" text-anchor="middle" font-size="84" font-weight="900" fill="${ORO}" stroke="none">?</text>`,
  reloj: `<circle cx="0" cy="0" r="62"/><path d="M0 -38 V0 L28 16"/>`,
  grafico: `<path d="M-80 -70 V70 H80"/><path d="M-60 40 L-20 10 L10 24 L60 -50" stroke="${VERDE}"/>`,
  personas: `<circle cx="-34" cy="-40" r="22"/><path d="M-70 30 Q-70 -10 -34 -10 Q2 -10 2 30"/><circle cx="34" cy="-30" r="30"/><path d="M-6 60 Q-6 6 34 6 Q74 6 74 60"/>`,
  cerebro: `<path d="M0 -60 Q-40 -76 -60 -44 Q-86 -36 -76 -4 Q-90 30 -54 46 Q-40 72 -6 60 Z M0 -60 Q40 -76 60 -44 Q86 -36 76 -4 Q90 30 54 46 Q40 72 6 60 Z"/>`,
  hucha: `<path d="M-70 10 Q-70 -50 0 -50 Q60 -50 70 -10 L86 -16 L80 14 Q70 50 30 56 V70 H10 V58 H-20 V70 H-40 V54 Q-70 44 -70 10 Z"/><path d="M-14 -50 H14"/>`,
  pizarra: `<rect x="-160" y="-100" width="320" height="200" rx="10" fill="#1f4d3a" stroke="#5b4636"/><path d="M-120 -50 H90 M-120 -10 H40 M-120 30 H70" stroke="#e9f5ec" stroke-width="6" opacity="0.8"/>`,
  ladrillos: `<path d="M-80 40 H80 M-80 0 H80 M-80 -40 H80 M-40 40 V80 M40 40 V80 M0 0 V40 M-40 -40 V0 M40 -40 V0 M0 -80 V-40"/><rect x="-80" y="-80" width="160" height="160" rx="6"/>`,
  foco: `<path d="M-30 -70 H30 L60 -20 H-60 Z" fill="#2a2a35"/><path d="M-60 -20 L-140 90 H140 L60 -20 Z" fill="#FFF3C4" stroke="none" opacity="0.18"/>`,
};
function icono(nombre, x, y, escala, aparecer, t, color = "#F4F1EA") {
  const dibujo = ICONOS[nombre] || ICONOS.estrella;
  const k = escala * rebote(aparecer), vib = Math.sin(t * 5) * 3;
  return `<g transform="translate(${x},${y + vib}) scale(${k})" opacity="${clamp(aparecer * 3)}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" color="${color}">${dibujo}</g>`;
}

// ---------- fondo y luz ----------
function fondo(t, escena, cfg) {
  const tono = cfg.fondo || "#07070b";
  let s = `<defs><radialGradient id="foco" cx="50%" cy="38%" r="55%"><stop offset="0%" stop-color="#FFF3D6" stop-opacity="0.16"/><stop offset="100%" stop-color="#FFF3D6" stop-opacity="0"/></radialGradient>` +
          `<radialGradient id="vineta" cx="50%" cy="45%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.75"/></radialGradient>` +
          `<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="${cfg.halo || "#3A2F5C"}" stop-opacity="0.55"/><stop offset="100%" stop-color="${cfg.halo || "#3A2F5C"}" stop-opacity="0"/></radialGradient>` +
          `<linearGradient id="cono" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFF6DD" stop-opacity="0.22"/><stop offset="100%" stop-color="#FFF6DD" stop-opacity="0"/></linearGradient></defs>`;
  s += `<rect width="${W}" height="${H}" fill="${tono}"/>`;
  if (cfg.formato !== "frases") {
    const latido = 0.85 + 0.15 * Math.sin(t * 1.3);
    s += `<path d="M470 0 H610 L860 ${SUELO + 40} H220 Z" fill="url(#cono)" opacity="${latido}"/>`;
    s += `<ellipse cx="540" cy="${SUELO + 30}" rx="420" ry="60" fill="#FFF6DD" opacity="0.06"/>`;
    s += `<rect x="0" y="${SUELO + 30}" width="${W}" height="${H - SUELO}" fill="#000" opacity="0.35"/>`;
  }
  s += `<rect width="${W}" height="${H}" fill="url(#foco)"/>`;
  // un halo suave en el centro: el fondo nunca es negro del todo (como en los vídeos del dueño)
  s += `<ellipse cx="540" cy="880" rx="520" ry="620" fill="url(#halo)"/>`;
  return s;
}

// ---------- formatos ----------
function escenaIdolo(e, t, cfg) {
  const tl = t - e.inicio;
  let s = "";
  const sombras = e.sombras || [];
  sombras.forEach((nom, i) => {
    const lado = i % 2 === 0 ? -1 : 1, dist = 290 + Math.floor(i / 2) * 120;
    s += persona({ tipo: "sombra", pose: "quieto", etiqueta: nom, fase: i }, 540 + lado * dist, 1.0 - Math.floor(i / 2) * 0.12, t, (tl - 0.2 - i * 0.12) / 0.5);
  });
  const prota = Object.assign({ tipo: cfg.famoso ? "famoso" : "monigote" }, cfg.famoso || {}, { pose: e.accion || "quieto" });
  if (e.etiqueta) prota.etiqueta = e.etiqueta;
  s += persona(prota, 540, e.cerca ? 1.5 : 1.32, t, (tl + 0.4) / 0.4);
  // con sombras o contador, los iconos suben a los lados del texto para no chocar
  const arriba = sombras.length || e.contador;
  const sitios = arriba ? [[170, 760], [910, 760], [540, 640]] : [[205, 1010], [875, 1010], [540, 640]];
  (e.props || []).slice(0, 3).forEach((nombre, i) => {
    const [x, y] = sitios[i];
    s += icono(nombre, x, y, nombre === "pizarra" ? 1.05 : (arriba ? 0.85 : 1.05), (tl - 0.35 - i * 0.18) / 0.4, t + i);
  });
  if (e.contador) {
    const v = Math.round(e.contador.desde + (e.contador.hasta - e.contador.desde) * suave(tl / Math.max(0.5, e.fin - e.inicio - 0.3)));
    const txt = (e.contador.antes || "") + v.toLocaleString("es-ES") + (e.contador.despues || "");
    s += `<text x="540" y="600" text-anchor="middle" font-size="104" font-weight="900" fill="${ORO}" opacity="${clamp(tl / 0.3)}">${esc(txt)}</text>`;
  }
  s += texto(e.texto, e.resaltar, 540, 290, 64, e.inicio, t, { acento: cfg.acento || ORO, ancho: 920 });
  return s;
}

function escenaCarrera(e, t, cfg) {
  const tl = t - e.inicio, cols = cfg.columnas || [];
  const n = cols.length || 2, ancho = W / n;
  let s = "";
  cols.forEach((c, i) => {
    const cx = ancho * (i + 0.5);
    const color = c.color || (i === n - 1 ? VERDE : ROJO);
    s += etiqueta(c.etiqueta, cx, 190, color, "#101018", 30);
    // mini gráfico
    const prog = (e.progreso || [])[i] ?? 0, previo = (e.progresoAntes || [])[i] ?? prog;
    const p = previo + (prog - previo) * suave(tl / 0.8);
    const gx = cx - ancho * 0.36, gw = ancho * 0.72, gy = 560, gh = 170;
    s += `<rect x="${gx}" y="${gy}" width="${gw}" height="${gh}" rx="10" fill="#EFE6D2" opacity="0.92"/>`;
    s += `<text x="${gx + 14}" y="${gy + 30}" font-size="22" font-weight="800" fill="#6b5e4a">${esc(c.medida || "PROGRESO")}</text>`;
    const pts = [];
    for (let k = 0; k <= 20; k++) { const x = k / 20; if (x > p + 0.001 && k > 0) break; pts.push(`${gx + 20 + x * (gw - 40)},${gy + gh - 22 - (c.curva === "cae" ? (x < 0.6 ? x : 1.2 - x) : x) * (gh - 60) * (c.techo ?? 1)}`); }
    s += `<polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"/>`;
    // persona y su montón
    const montón = Math.round((c.desde ?? 0) + ((c.hasta ?? 10) - (c.desde ?? 0)) * p);
    const obj = cfg.objeto || "ladrillos";
    for (let k = 0; k < Math.min(montón, 24); k++) {
      const fila = Math.floor(k / 4), col = k % 4;
      s += `<rect x="${cx + 40 + col * 30}" y="${SUELO - 26 - fila * 24}" width="26" height="20" rx="3" fill="${obj === "monedas" ? ORO : "#B5523B"}" opacity="0.95"/>`;
    }
    s += persona({ tipo: "monigote", pose: (e.poses || [])[i] || "trabaja", fase: i * 0.7 }, cx - 40, 0.78, t, (tl + 1) / 0.3);
    s += `<text x="${cx}" y="${SUELO + 150}" text-anchor="middle" font-size="84" font-weight="900" fill="${color}">${esc((c.antes || "") + montón)}</text>`;
    s += `<text x="${cx}" y="${SUELO + 200}" text-anchor="middle" font-size="26" font-weight="800" fill="${GRIS}">${esc(c.unidad || "")}</text>`;
  });
  if (cfg.dias) {
    const dias = cfg.dias, paso = 92, x0 = 540 - (dias.length - 1) * paso / 2;
    dias.forEach((d, i) => {
      const activo = d === e.dia;
      s += `<rect x="${x0 + i * paso - 34}" y="${H - 300}" width="68" height="68" rx="14" fill="${activo ? ORO : "#1a1a24"}"/>`;
      s += `<text x="${x0 + i * paso}" y="${H - 254}" text-anchor="middle" font-size="30" font-weight="900" fill="${activo ? "#14110a" : GRIS}">${esc(d)}</text>`;
    });
  }
  s += texto(e.texto, e.resaltar, 540, 340, 56, e.inicio, t, { acento: cfg.acento || ORO });
  return s;
}

function escenaFrases(e, t, cfg) {
  const tl = t - e.inicio;
  let s = texto(e.texto, e.resaltar, 540, 640, 104, e.inicio, t, { acento: cfg.acento || MORADO, ancho: 940 });
  if (e.icono) {
    // el icono se «dibuja» poco a poco
    const k = clamp((tl - 0.3) / 0.8);
    s += `<g style="stroke-dasharray:1400;stroke-dashoffset:${1400 * (1 - k)}">` + icono(e.icono, 540, 1180, 1.6, 1, t * 0.3) + `</g>`;
  }
  return s;
}

function final(f, t, cfg) {
  const tl = t - f.inicio;
  let s = `<rect width="${W}" height="${H}" fill="#07070b" opacity="${0.88 * clamp(tl / 0.35)}"/>` +
          `<ellipse cx="540" cy="900" rx="560" ry="520" fill="url(#halo)" opacity="${clamp(tl / 0.35)}"/>`;
  const lineas = f.lineas || [{ texto: f.texto, resaltar: f.resaltar }];
  lineas.forEach((l, i) => {
    s += texto(l.texto, l.resaltar, 540, 800 + i * 170, 84, f.inicio + i * 0.55, t, { acento: l.color || cfg.acento || ORO, color: l.colorTexto || "#FFFFFF", ancho: 940 });
  });
  if (f.pregunta) s += texto(f.pregunta, [], 540, 800 + lineas.length * 170 + 70, 54, f.inicio + lineas.length * 0.55 + 0.3, t, { color: ORO, ancho: 940 });
  return s;
}

window.pintar = function (t) {
  const g = window.GUION;
  const escenas = g.escenas || [];
  let e = escenas[escenas.length - 1];
  for (const x of escenas) if (t >= x.inicio && t < x.fin) { e = x; break; }
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">` + fondo(t, e, g);
  if (g.titulo_arriba) s += `<text x="540" y="120" text-anchor="middle" font-size="30" font-weight="900" fill="#FFFFFF" opacity="0.85">${esc(g.titulo_arriba)}</text>`;
  const enFinal = g.final && t >= g.final.inicio;
  if (e && !(enFinal && t - g.final.inicio > 0.35)) {
    if (g.formato === "carrera") s += escenaCarrera(e, t, g);
    else if (g.formato === "frases") s += escenaFrases(e, t, g);
    else s += escenaIdolo(e, t, g);
  }
  if (enFinal) s += final(g.final, t, g);
  // transición: un barrido rápido al cambiar de escena
  const desde = e ? t - e.inicio : 1;
  if (desde < 0.18 && e && e !== escenas[0]) s += `<rect width="${W}" height="${H}" fill="#000" opacity="${0.45 * (1 - desde / 0.18)}"/>`;
  s += `<rect width="${W}" height="${H}" fill="url(#vineta)"/></svg>`;
  document.getElementById("lienzo").innerHTML = s;
};
</script>
