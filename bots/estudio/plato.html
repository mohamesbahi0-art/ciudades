<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Plató</title>
<!-- El plató: dibuja cada fotograma de los vídeos «famoso» con el estilo de las cuentas del dueño (escenario azul con
     suelo y focos, futbolista dibujado, maniquíes grises, objetos de verdad y texto arriba). Lo usa render.js:
     window.GUION = guion; await window.listo; window.pintar(t) para cada fotograma. -->
<style>
@font-face{font-family:"Montserrat";font-weight:700;src:url("fuentes/montserrat-700.woff2") format("woff2")}
@font-face{font-family:"Montserrat";font-weight:800;src:url("fuentes/montserrat-800.woff2") format("woff2")}
@font-face{font-family:"Montserrat";font-weight:900;src:url("fuentes/montserrat-900.woff2") format("woff2")}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0A1122}
svg{display:block;font-family:"Montserrat",sans-serif}
</style></head><body>
<svg id="v" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
  <linearGradient id="pared" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090F21"/><stop offset="0.7" stop-color="#15203F"/><stop offset="1" stop-color="#1B2749"/></linearGradient>
  <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18213F"/><stop offset="1" stop-color="#070A16"/></linearGradient>
  <linearGradient id="cesped" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17603A"/><stop offset="1" stop-color="#061F10"/></linearGradient>
  <linearGradient id="haz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3EAFF" stop-opacity="0.30"/><stop offset="1" stop-color="#E3EAFF" stop-opacity="0.05"/></linearGradient>
  <radialGradient id="charco"><stop offset="0" stop-color="#EEF2FF" stop-opacity="0.36"/><stop offset="1" stop-color="#EEF2FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#2B3C72" stop-opacity="0.55"/><stop offset="1" stop-color="#2B3C72" stop-opacity="0"/></radialGradient>
  <radialGradient id="sombra"><stop offset="0" stop-color="#000" stop-opacity="0.6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <radialGradient id="brilloOro"><stop offset="0" stop-color="#FFD866" stop-opacity="0.6"/><stop offset="1" stop-color="#FFD866" stop-opacity="0"/></radialGradient>
  <radialGradient id="foco1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/><stop offset="1" stop-color="#DDE6FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="vineta" cx="0.5" cy="0.46" r="0.78"><stop offset="0.62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
  <radialGradient id="volumenBalon" cx="0.36" cy="0.3" r="0.85"><stop offset="0.5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.38"/></radialGradient>
  <radialGradient id="cabezaManiqui" cx="0.38" cy="0.32" r="0.78"><stop offset="0" stop-color="#B9BFD2"/><stop offset="1" stop-color="#4F546A"/></radialGradient>
  <linearGradient id="cuerpoManiqui" x1="0" y1="0" x2="1" y2="0.35"><stop offset="0" stop-color="#959CB2"/><stop offset="1" stop-color="#525870"/></linearGradient>
  <radialGradient id="articulacion" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#A7ADC2"/><stop offset="1" stop-color="#565C71"/></radialGradient>
  <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE98F"/><stop offset="0.55" stop-color="#F6C431"/><stop offset="1" stop-color="#CF8A10"/></linearGradient>
  <linearGradient id="tarjeta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDE3ED"/></linearGradient>
  <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03060F"/><stop offset="0.45" stop-color="#0B1430"/><stop offset="1" stop-color="#16224A"/></linearGradient>
  <linearGradient id="ocaso" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070B1C"/><stop offset="0.55" stop-color="#1A1840"/><stop offset="1" stop-color="#3A2452"/></linearGradient>
  <linearGradient id="bruma" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1330" stop-opacity="0.75"/><stop offset="1" stop-color="#0B1330" stop-opacity="0.05"/></linearGradient>
  <linearGradient id="led" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B59FF"/><stop offset="0.35" stop-color="#9B3BFF"/><stop offset="0.7" stop-color="#FF3B6B"/><stop offset="1" stop-color="#FFB02E"/></linearGradient>
  <linearGradient id="asfalto" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E222D"/><stop offset="1" stop-color="#090B10"/></linearGradient>
  <linearGradient id="farola" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD48A" stop-opacity="0.55"/><stop offset="1" stop-color="#FFD48A" stop-opacity="0"/></linearGradient>
  <filter id="desenfoque" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.6"/></filter>
  <filter id="b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="b24" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="sombraTexto" x="-10%" y="-40%" width="120%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity="0.6"/></filter>
  <filter id="brillo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="sombraTarjeta" x="-25%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/></filter>
  <clipPath id="recorteSuelo"><rect x="0" y="1400" width="1080" height="520"/></clipPath>
</defs>
<g id="escena"></g>
</svg>
<script>
"use strict";
const W = 1080, H = 1920, SUELO = 1400, R = Math.PI / 180;
const lim = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const tramo = (t, a, d) => lim((t - a) / d);
const suave = x => x * x * (3 - 2 * x);
const salida = x => 1 - Math.pow(1 - x, 3);
const rebote = x => { if (x <= 0) return 0; const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const azar = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const f1 = n => Math.round(n * 10) / 10;
const f2 = n => Math.round(n * 100) / 100;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const POS = { centro: 540, izq: 330, der: 750, izq2: 175, der2: 905, izq3: 90, der3: 990 };
const posX = (p, def = 540) => typeof p === "number" ? p : (POS[p] ?? def);

// ---------- colores ----------
function rgb(h) { h = String(h || "#888").replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); const n = parseInt(h, 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const hex = c => "#" + c.map(v => Math.round(lim(v, 0, 255)).toString(16).padStart(2, "0")).join("");
const mezcla = (a, b, p) => { const x = rgb(a), y = rgb(b); return hex(x.map((v, i) => v + (y[i] - v) * p)); };
const claro = (c, p) => mezcla(c, "#ffffff", p), oscuro = (c, p) => mezcla(c, "#000000", p);
let DEFS = {};
function degradado(c) {
  const k = "d" + rgb(c).join("-");
  if (!DEFS[k]) DEFS[k] = `<linearGradient id="${k}" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="${claro(c, 0.2)}"/><stop offset="0.5" stop-color="${c}"/><stop offset="1" stop-color="${oscuro(c, 0.3)}"/></linearGradient>`;
  return `url(#${k})`;
}

// ---------- texto ----------
const lienzo = document.createElement("canvas").getContext("2d");
function ancho(texto, peso, tam) { lienzo.font = `${peso} ${tam}px Montserrat`; return lienzo.measureText(texto).width; }
const normal = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ñ]/g, "");

function textoArriba(e, tl) {
  const texto = String(e.texto || "").trim();
  if (!texto) return "";
  const tam = texto.length > 64 ? 52 : 58, alto = Math.round(tam * 1.3), max = 960;
  const palabras = texto.split(/\s+/);
  const marcadas = palabras.map(() => false);
  for (const r of e.resaltar || []) {
    const rp = String(r).split(/\s+/).map(normal).filter(Boolean);
    if (!rp.length) continue;
    for (let i = 0; i + rp.length <= palabras.length; i++)
      if (rp.every((w, j) => normal(palabras[i + j]) === w)) { for (let j = 0; j < rp.length; j++) marcadas[i + j] = true; break; }
  }
  const esp = ancho(" ", 800, tam), anchos = palabras.map(p => ancho(p, 800, tam));
  const partir = tope => { const L = [[]]; let w = 0; palabras.forEach((p, i) => { if (L[L.length - 1].length && w + esp + anchos[i] > tope) { L.push([]); w = 0; } const l = L[L.length - 1]; w += (l.length ? esp : 0) + anchos[i]; l.push({ p, i, pw: anchos[i] }); }); return L; };
  const n = partir(max).length;
  let lo = Math.max(...anchos), hi = max;
  for (let it = 0; it < 16 && n > 1; it++) { const mid = (lo + hi) / 2; if (partir(mid).length <= n) hi = mid; else lo = mid; }
  const lineas = partir(n > 1 ? hi + 1 : max);
  const color = e.color === "rojo" ? "#FF4747" : "#F7C53B";
  const ap = salida(tramo(tl, 0, 0.3));
  const y0 = 292 - (lineas.length > 2 ? 34 : 0);
  let s = `<g opacity="${f2(ap)}" transform="translate(0 ${f1((1 - ap) * 16)})" filter="url(#sombraTexto)">`;
  lineas.forEach((L, li) => {
    const total = L.reduce((a, x) => a + x.pw, 0) + esp * (L.length - 1);
    let x = 540 - total / 2;
    const y = y0 + li * alto;
    L.forEach((q, k) => {
      const m = marcadas[q.i];
      s += `<text x="${f1(x)}" y="${y}" font-weight="800" font-size="${tam}" fill="${m ? color : "#FFFFFF"}">${esc(q.p)}</text>`;
      if (m) {
        const sig = L[k + 1] && marcadas[L[k + 1].i];
        const limpio = q.p.replace(/^[¿¡"«]+/u, "").replace(/[.,;:!?»"]+$/u, "");
        const ini = ancho(q.p.slice(0, q.p.indexOf(limpio)), 800, tam);
        const largo = (sig ? q.pw - ini + esp : ancho(limpio, 800, tam)) * salida(tramo(tl, 0.3 + k * 0.04, 0.4));
        s += `<rect x="${f1(x + ini)}" y="${y + 13}" width="${f1(largo)}" height="6" rx="3" fill="${color}"/>`;
      }
      x += q.pw + esp;
    });
  });
  return s + "</g>";
}

function etiqueta(x, y, texto, estilo, pop) {
  const tam = 33, w = ancho(texto, 800, tam) + 52, h = 62;
  const est = { nombre: ["#070A12", "#FFFFFF", "#FFFFFF"], rojo: ["#2B0709", "#FF3B3B", "#FF5050"], oro: ["#1E1705", "#F7C53B", "#F7C53B"] }[estilo] || ["#070A12", "#FFFFFF", "#FFFFFF"];
  const sc = rebote(pop);
  let s = `<g transform="translate(${f1(x)} ${f1(y)}) scale(${f2(sc)})" opacity="${f2(lim(pop * 2.5))}">`;
  if (estilo === "rojo") s += `<rect x="${f1(-w / 2 - 8)}" y="${-h / 2 - 8}" width="${f1(w + 16)}" height="${h + 16}" rx="${h / 2 + 8}" fill="#FF2020" opacity="0.28" filter="url(#b10)"/>`;
  if (estilo === "oro") s += `<rect x="${f1(-w / 2 - 8)}" y="${-h / 2 - 8}" width="${f1(w + 16)}" height="${h + 16}" rx="${h / 2 + 8}" fill="#F7C53B" opacity="0.2" filter="url(#b10)"/>`;
  s += `<rect x="${f1(-w / 2)}" y="${-h / 2}" width="${f1(w)}" height="${h}" rx="${h / 2}" fill="${est[0]}" stroke="${est[1]}" stroke-width="3"/>`;
  s += `<text x="0" y="${f1(tam * 0.36)}" text-anchor="middle" font-weight="800" font-size="${tam}" fill="${est[2]}"${estilo === "rojo" ? ' filter="url(#brillo)"' : ""}>${esc(texto)}</text>`;
  return s + "</g>";
}

// ---------- escenario ----------
let PATRONES = null;
function patrones() {
  if (PATRONES) return PATRONES;
  const camisetas = ["#C8102E", "#F2C230", "#E9EDF5", "#1B2A5C", "#C8102E", "#2E6BD9", "#F2C230", "#7A1E2C", "#E9EDF5", "#2B2F3A"];
  const pieles = ["#E2B08B", "#C68B5E", "#8A5A3B", "#5E3B26", "#F0C9A6"];
  let s = "";
  for (let v = 0; v < 3; v++) {
    s += `<pattern id="publico${v}" width="220" height="46" patternUnits="userSpaceOnUse">`;
    for (let i = 0; i < 14; i++) {
      const x = 8 + i * 15.4 + azar(v * 50 + i) * 5, y = 22 + azar(v * 70 + i) * 7;
      s += `<rect x="${f1(x - 7)}" y="${f1(y)}" width="14" height="22" rx="6" fill="${camisetas[Math.floor(azar(v * 90 + i) * camisetas.length)]}"/>` +
           `<circle cx="${f1(x)}" cy="${f1(y - 5)}" r="6" fill="${pieles[Math.floor(azar(v * 110 + i) * pieles.length)]}"/>`;
    }
    s += `</pattern>`;
  }
  s += `<pattern id="asientos" width="24" height="30" patternUnits="userSpaceOnUse"><rect x="3" y="9" width="18" height="13" rx="3" fill="#24355F"/><rect x="3" y="21" width="18" height="5" rx="2" fill="#192749"/></pattern>`;
  return (PATRONES = s);
}

function estadio(T, lleno) {
  let s = `<rect width="1080" height="${SUELO}" fill="url(#cielo)"/>`;
  for (const [x, lado] of [[105, 1], [975, -1]]) {
    if (!lleno && lado < 0) continue;
    s += `<rect x="${x - 7}" y="140" width="14" height="500" fill="#070B16"/><rect x="${x - 56}" y="96" width="112" height="62" rx="7" fill="#1A2238"/>`;
    for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) s += `<rect x="${x - 50 + i * 26}" y="${102 + j * 27}" width="22" height="22" rx="3" fill="#F4F8FF"/>`;
    s += `<circle cx="${x}" cy="127" r="280" fill="url(#foco1)" opacity="${lleno ? 0.5 : 0.3}"/>`;
  }
  s += `<path d="M 0 600 Q 540 548 1080 600 L 1080 652 Q 540 602 0 652 Z" fill="#04060D"/>`;
  [[652, 250, 0.62], [930, 214, 0.8], [1172, 200, 1.0]].forEach(([y0, h, k], i) => {
    s += `<rect x="0" y="${y0}" width="1080" height="${h}" fill="${lleno ? "#0E1530" : "#0C1328"}"/>`;
    const dy = lleno ? Math.sin(T * 5.5 + i * 1.3) * 1.6 : 0;
    s += `<g transform="translate(0 ${f1(y0 + dy)}) scale(${k})"><rect x="0" y="0" width="${f1(1080 / k)}" height="${f1(h / k)}" fill="url(#${lleno ? "publico" + i : "asientos"})" opacity="${lleno ? 0.8 : 0.85}"/></g>`;
    s += `<rect x="0" y="${y0}" width="1080" height="${h}" fill="url(#bruma)"/>`;
    s += `<rect x="0" y="${y0 + h}" width="1080" height="16" fill="${lleno ? "url(#led)" : "#141C33"}" opacity="0.9"/>`;
    if (lleno) s += `<rect x="0" y="${y0 + h - 6}" width="1080" height="28" fill="url(#led)" opacity="0.3" filter="url(#b10)"/>`;
  });
  if (lleno) for (let i = 0; i < 34; i++) {
    const tw = Math.sin(T * (2 + azar(i + 900) * 3) + i * 2.1);
    if (tw > 0.55) s += `<circle cx="${f1(azar(i + 950) * 1080)}" cy="${f1(670 + azar(i + 990) * 690)}" r="${f1(3 + tw * 4)}" fill="#FFFFFF" opacity="${f2(tw)}" filter="url(#b4)"/>`;
  }
  return `<g filter="url(#desenfoque)">${s}</g>`;
}

function barrio(T) {
  let s = `<rect width="1080" height="${SUELO}" fill="url(#ocaso)"/>`;
  s += `<circle cx="160" cy="560" r="170" fill="url(#foco1)" opacity="0.3"/><circle cx="160" cy="560" r="46" fill="#F3EEDB" opacity="0.92"/>`;
  const fila = (semilla, colorBase, yBase, altoMin, altoMax, anchoMin, anchoMax, luz) => {
    let x = -30, i = 0, r = "";
    while (x < 1100) {
      const w = anchoMin + azar(semilla + i) * (anchoMax - anchoMin), h = altoMin + azar(semilla + 40 + i) * (altoMax - altoMin);
      const y = yBase - h, color = mezcla(colorBase, "#000000", azar(semilla + 80 + i) * 0.25);
      r += `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h + 4)}" fill="${color}"/>`;
      if (azar(semilla + 120 + i) > 0.5) r += `<rect x="${f1(x + w * 0.6)}" y="${f1(y - 26)}" width="26" height="20" fill="${color}"/><line x1="${f1(x + w * 0.25)}" y1="${f1(y)}" x2="${f1(x + w * 0.25)}" y2="${f1(y - 44)}" stroke="${color}" stroke-width="3"/>`;
      for (let cx = x + 18; cx < x + w - 22; cx += 36) for (let cy = y + 26; cy < yBase - 30; cy += 50) {
        const n = Math.floor(cx * 7 + cy * 13 + semilla), encendida = azar(n) < luz * (0.85 + 0.15 * Math.sin(T * 0.7 + n));
        r += `<rect x="${f1(cx)}" y="${f1(cy)}" width="16" height="25" rx="2" fill="${encendida ? (azar(n + 3) > 0.3 ? "#FFC76A" : "#9FD0FF") : "#1B2544"}" opacity="${encendida ? 0.9 : 0.8}"/>`;
      }
      x += w + 6; i++;
    }
    return r;
  };
  s += `<g opacity="0.55">${fila(300, "#1A2147", 1250, 330, 560, 110, 170, 0.18)}</g>`;
  s += fila(500, "#0E142D", SUELO, 380, 720, 170, 250, 0.32);
  s += `<rect x="0" y="0" width="1080" height="${SUELO}" fill="url(#bruma)" opacity="0.35"/>`;
  return `<g filter="url(#desenfoque)">${s}</g>`;
}

function farola(x) {
  return `<g><rect x="${x - 7}" y="${SUELO - 560}" width="14" height="560" fill="#0A0D16"/><path d="M ${x} ${SUELO - 552} Q ${x} ${SUELO - 600} ${x - 70} ${SUELO - 600}" fill="none" stroke="#0A0D16" stroke-width="12"/>` +
    `<rect x="${x - 112}" y="${SUELO - 612}" width="64" height="20" rx="8" fill="#1C2233"/><polygon points="${x - 106},${SUELO - 594} ${x - 54},${SUELO - 594} ${x + 60},${SUELO} ${x - 220},${SUELO}" fill="url(#farola)" opacity="0.55"/>` +
    `<ellipse cx="${x - 80}" cy="${SUELO - 590}" rx="40" ry="12" fill="#FFE2A6" filter="url(#b4)"/></g>`;
}

function fondo(e, T, focoX) {
  if (e.fondo === "estadio" || e.fondo === "gradas") return estadio(T, e.fondo === "estadio");
  if (e.fondo === "barrio") return barrio(T) + farola(930);
  let s = `<rect width="1080" height="1920" fill="url(#pared)"/>`;
  s += `<ellipse cx="${f1(focoX)}" cy="1080" rx="560" ry="640" fill="url(#halo)"/>`;
  if (e.pared === "columnas" || e.suelo === "vestuario")
    for (const x of [70, 1010]) s += `<rect x="${x - 60}" y="0" width="120" height="${SUELO}" fill="#0C1326" opacity="0.9"/>`;
  for (let i = 0; i < 70; i++) {
    const x = azar(i) * 1080, y0 = azar(i + 99) * 1360;
    const y = ((y0 - T * (5 + azar(i + 7) * 9)) % 1360 + 1360) % 1360;
    const r = 1 + azar(i + 199) * 2.3;
    const o = (0.1 + 0.36 * azar(i + 299)) * (0.6 + 0.4 * Math.sin(T * (1 + azar(i + 3) * 2) + i));
    s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="#C9D6FF" opacity="${f2(o)}"/>`;
  }
  if (e.suelo === "cesped")
    for (const x of [70, 1010]) s += `<circle cx="${x}" cy="120" r="230" fill="url(#foco1)" opacity="0.32"/><circle cx="${x}" cy="120" r="18" fill="#F4F7FF" filter="url(#b4)"/>`;
  return s;
}

function foco(x, k = 1) {
  return `<g opacity="${f2(k)}"><polygon points="${f1(x - 110)},-20 ${f1(x + 110)},-20 ${f1(x + 350)},${SUELO} ${f1(x - 350)},${SUELO}" fill="url(#haz)" filter="url(#b24)"/>` +
    `<polygon points="${f1(x - 58)},-20 ${f1(x + 58)},-20 ${f1(x + 200)},${SUELO} ${f1(x - 200)},${SUELO}" fill="url(#haz)" opacity="0.5" filter="url(#b10)"/></g>`;
}
const charco = (x, k = 1) => `<ellipse cx="${f1(x)}" cy="${SUELO + 10}" rx="370" ry="80" fill="url(#charco)" opacity="${f2(k)}"/>`;

function suelo(e) {
  if (e.suelo === "calle") {
    let c = `<rect y="${SUELO}" width="1080" height="${H - SUELO}" fill="url(#asfalto)"/><rect y="${SUELO}" width="1080" height="46" fill="#2B303E"/><rect y="${SUELO + 46}" width="1080" height="8" fill="#3A4052"/>`;

    `<path d="M -44 -128 Q -82 -126 -78 -90 Q -74 -60 -36 -54" fill="none" stroke="#E7B126" stroke-width="12"/>` +
    `<path d="M 44 -128 Q 82 -126 78 -90 Q 74 -60 36 -54" fill="none" stroke="#E7B126" stroke-width="12"/>` +
    `<path d="M -56 -138 L 56 -138 Q 56 -46 0 -34 Q -56 -46 -56 -138 Z" fill="url(#oro)"/>` +
    `<rect x="-11" y="-38" width="22" height="30" fill="#D9961A"/><rect x="-40" y="-12" width="80" height="14" rx="4" fill="url(#oro)"/>` +
    `<rect x="-48" y="0" width="96" height="30" rx="5" fill="#3B2715"/><rect x="-26" y="8" width="52" height="12" rx="3" fill="#E7B126" opacity="0.8"/>` +
    `<path d="M -36 -126 Q -38 -78 -16 -52" fill="none" stroke="#FFF6D0" stroke-width="8" opacity="0.6" stroke-linecap="round"/></g>`;
}

function chispa(x, y, s, o = 1) {
  return `<g transform="translate(${f1(x)} ${f1(y)})" opacity="${f2(o)}"><circle r="${f1(s * 2.5)}" fill="url(#brilloOro)"/>` +
    `<path d="M 0 ${f1(-s)} Q 0 0 ${f1(s)} 0 Q 0 0 0 ${f1(s)} Q 0 0 ${f1(-s)} 0 Q 0 0 0 ${f1(-s)} Z" fill="#FFF3C4"/></g>`;
}
function chispas(cx, T) {
  let s = "";
  [[-160, -650], [150, -630], [-205, -410], [195, -380], [-130, -250], [128, -540]].forEach(([dx, dy], i) => {
    const tw = 0.5 + 0.5 * Math.sin(T * 3.1 + i * 1.7);
    s += chispa(cx + dx + Math.sin(T * 0.8 + i) * 12, SUELO + dy + Math.cos(T * 0.9 + i) * 12, 14 + 8 * tw, 0.55 + 0.45 * tw);
  });
  return s;
}

function confeti(T) {
  let s = "";
  const cols = ["#F7C53B", "#FFFFFF", "#E8344A", "#F7C53B", "#4FA3FF"];
  for (let i = 0; i < 54; i++) {
    const x = azar(i + 500) * 1080 + Math.sin(T * 2 + i) * 26;
    const y = -60 + ((T * (240 + azar(i + 600) * 200) + azar(i + 700) * 1500) % 1500);
    const g = T * 260 * (azar(i + 800) - 0.5) + i * 40;
    s += `<rect x="${f1(x)}" y="${f1(y)}" width="13" height="22" rx="2" fill="${cols[i % 5]}" opacity="0.9" transform="rotate(${f1(g)} ${f1(x + 6)} ${f1(y + 11)})"/>`;
  }
  return s;
}

function numeroGrande(x, y, texto, tl, sub) {
  const tam = Math.min(230, 470 / Math.max(1, String(texto).length) * 1.45);
  x = Math.min(x, 1080 - 40 - ancho(String(texto), 900, tam) / 2);
  const p = tramo(tl, 0.35, 0.5), k = rebote(p), late = 1 + 0.03 * Math.sin(tl * 4);
  let s = `<g transform="translate(${f1(x)} ${f1(y)}) scale(${f2(k * late)})" opacity="${f2(lim(p * 3))}">`;
  s += `<text x="0" y="0" text-anchor="middle" font-weight="900" font-size="${f1(tam)}" fill="#F7C53B" opacity="0.5" filter="url(#b24)">${esc(texto)}</text>`;
  s += `<text x="0" y="0" text-anchor="middle" font-weight="900" font-size="${f1(tam)}" fill="url(#oro)" stroke="#6E4505" stroke-width="6" paint-order="stroke">${esc(texto)}</text>`;
  if (sub) s += `<text x="0" y="74" text-anchor="middle" font-weight="800" font-size="38" letter-spacing="3" fill="#FFFFFF" opacity="${f2(tramo(tl, 0.8, 0.4))}">${esc(sub)}</text>`;
  return s + "</g>";
}

function calendario(x, y, texto, tl, sub) {
  const k = rebote(tramo(tl, 0.3, 0.45));
  return `<g transform="translate(${f1(x)} ${f1(y)}) scale(${f2(k)})"><g filter="url(#sombraTarjeta)"><rect x="-140" y="-160" width="280" height="310" rx="28" fill="url(#tarjeta)"/></g>` +
    `<path d="M -140 -132 Q -140 -160 -112 -160 L 112 -160 Q 140 -160 140 -132 L 140 -74 L -140 -74 Z" fill="#E5484D"/>` +
    `<rect x="-76" y="-184" width="20" height="50" rx="10" fill="#2B3142"/><rect x="56" y="-184" width="20" height="50" rx="10" fill="#2B3142"/>` +
    `<text x="0" y="-103" text-anchor="middle" font-weight="800" font-size="34" letter-spacing="4" fill="#FFFFFF">${esc(sub || "AÑO")}</text>` +
    `<text x="0" y="62" text-anchor="middle" font-weight="900" font-size="${String(texto).length > 3 ? 92 : 120}" fill="#1E2433">${esc(texto)}</text></g>`;
}

function checklist(x, y, n, marcados, tl) {
  const k = rebote(tramo(tl, 0.2, 0.45));
  const alto = 70 + n * 84;
  let s = `<g transform="translate(${f1(x)} ${f1(y)}) scale(${f2(k)})"><g filter="url(#sombraTarjeta)"><rect x="-155" y="${-alto / 2}" width="310" height="${alto}" rx="26" fill="url(#tarjeta)"/></g>`;
  for (let i = 0; i < n; i++) {
    const yy = -alto / 2 + 77 + i * 84;
    s += `<rect x="-122" y="${yy - 27}" width="54" height="54" rx="11" fill="none" stroke="#2B3142" stroke-width="6"/>`;
    s += `<rect x="-46" y="${yy - 8}" width="${170 - (i % 2) * 30}" height="15" rx="7.5" fill="#C3CCDB"/>`;
    const q = tramo(tl, 0.7 + i * 0.5, 0.32);
    if (i < marcados && q > 0) s += `<path d="M -110 ${yy} L -98 ${yy + 13} L -74 ${yy - 15}" fill="none" stroke="#22B455" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="64" stroke-dashoffset="${f1(64 * (1 - q))}"/>`;
  }
  return s + "</g>";
}

function bocadillo(x, y, texto, tl) {
  const k = rebote(tramo(tl, 0.9, 0.35)), b = Math.sin(tl * 3) * 7;
  return `<g transform="translate(${f1(x)} ${f1(y + b)}) scale(${f2(k)})"><path d="M -52 -48 Q -52 -70 -30 -70 L 30 -70 Q 52 -70 52 -48 L 52 2 Q 52 24 30 24 L -2 24 L -26 50 L -20 24 L -30 24 Q -52 24 -52 2 Z" fill="#F7C53B"/>` +
    `<text x="0" y="1" text-anchor="middle" font-weight="900" font-size="68" fill="#15171C">${esc(texto)}</text></g>`;
}

function porteria(x) {
  let s = `<g transform="translate(${f1(x)} ${SUELO})">`;
  for (let i = 0; i <= 8; i++) s += `<line x1="${-150 + i * 37.5}" y1="-230" x2="${-150 + i * 37.5}" y2="0" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.5"/>`;
  for (let j = 0; j <= 6; j++) s += `<line x1="-150" y1="${-230 + j * 38.3}" x2="150" y2="${-230 + j * 38.3}" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.5"/>`;
  return s + `<path d="M -150 0 L -150 -230 L 150 -230 L 150 0" fill="none" stroke="#F4F6FA" stroke-width="12" stroke-linejoin="round"/></g>`;
}

function objeto(o, e, tl, d, actores) {
  const T = tl + e.inicio;
  const ref = actores.find(a => a.id && a.id === (o.de || o.sobre)) || actores.find(a => a.tipo === "famoso") || actores[0] || { pos: "centro" };
  const ax = posActor(ref, tl, d), k = ref.escala || 1;
  switch (o.tipo) {
    case "balon": {
      let x, y, g;
      if (o.anim === "regate") { const f = T * 2 * Math.PI * 2.1; x = ax + 92 * dirActor(ref) * k; y = SUELO - 24 - 34 * Math.abs(Math.sin(f)); g = x * 1.6; }
      else if (o.anim === "botar") { x = ax + 135 * k; y = SUELO - 26 - 190 * k * Math.abs(Math.sin(T * 3.2)); g = T * 120; }
      else { const w = T * 1.7; x = ax + 165 * Math.sin(w) * k; y = SUELO - 26 - 110 * k * Math.abs(Math.cos(w)); g = T * 170; }
      return sombraBalon(x, y) + balon(x, y, 26, g);
    }
    case "chispas": return chispas(ax, T);
    case "conos": { const n = o.n || 4; let s = ""; for (let i = 0; i < n; i++) s += cono(250 + i * (580 / Math.max(1, n - 1))); return s; }
    case "camino": { const x0 = posX(ref.desde ?? "izq2"), x1 = ax; return `<path d="M ${f1(x0)} ${SUELO - 26} Q ${f1((x0 + x1) / 2)} ${SUELO - 150} ${f1(x1)} ${SUELO - 26}" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" stroke-dasharray="3 16" stroke-linecap="round"/>`; }
    case "confeti": return confeti(T);
    case "numero": return numeroGrande(posX(o.pos, 760), o.y || 1030, o.texto, tl, o.sub);
    case "calendario": return calendario(posX(o.pos, 800), o.y || 1090, o.texto, tl, o.sub);
    case "checklist": return checklist(posX(o.pos, 790), o.y || 1120, o.items || 4, o.marcados ?? 2, tl);
    case "bocadillo": return bocadillo(ax + 115 * k, o.y || (SUELO - 680 * k - 150), o.texto || "?", tl);
    case "trofeo": return trofeo(posX(o.pos, 780), o.y || SUELO - 30, 1.3);
    case "porteria": return porteria(posX(o.pos, 860));
    default: return "";
  }
}

// ---------- escena y fotograma ----------
function dibujaEscena(e, tl, idx) {
  const d = e.fin - e.inicio, actores = e.actores || [];
  const prin = actores.find(a => a.foco) || actores.find(a => a.tipo === "famoso") || actores[0];
  const focoX = e.focoX ?? (prin ? posActor(prin, tl, d) : 540);
  let s = fondo(e, tl + e.inicio, focoX);
  const kf = e.fondo === "barrio" ? 0.35 : (e.fondo === "estadio" || e.fondo === "gradas") ? 0.55 : 1;
  if (e.foco !== false) s += foco(focoX, kf);
  s += suelo(e);
  if (e.foco !== false) s += charco(focoX);
  const z = 1 + 0.035 * suave(lim(tl / Math.max(d, 0.1))) + 0.05 * (1 - salida(tramo(tl, 0, 0.4)));
  let m = "";
  for (const o of e.objetos || []) if (o.detras || ["conos", "camino", "porteria", "calendario", "checklist"].includes(o.tipo)) m += objeto(o, e, tl, d, actores);
  for (const a of actores) m += actor(a, e, tl, d, idx);
  for (const o of e.objetos || []) if (!(o.detras || ["conos", "camino", "porteria", "calendario", "checklist"].includes(o.tipo))) m += objeto(o, e, tl, d, actores);
  s += `<g transform="translate(540 1220) scale(${(z).toFixed(4)}) translate(-540 -1220)">${m}</g>`;
  s += `<rect width="1080" height="1920" fill="url(#vineta)"/>`;
  return s + textoArriba(e, tl);
}

window.pintar = function (t) {
  const g = window.GUION, E = g.escenas;
  DEFS = { patrones: patrones() };
  let i = E.findIndex(e => t < e.fin);
  if (i < 0) i = E.length - 1;
  const e = E[i], tl = t - e.inicio;
  let s = dibujaEscena(e, tl, i);
  if (i > 0 && tl < 0.16) { const pe = E[i - 1]; s += `<g opacity="${f2(1 - tl / 0.16)}">${dibujaEscena(pe, pe.fin - pe.inicio, i - 1)}</g>`; }
  if (t > g.duracion - 0.45) s += `<rect width="1080" height="1920" fill="#000" opacity="${f2(lim((t - (g.duracion - 0.45)) / 0.45))}"/>`;
  document.getElementById("escena").innerHTML = `<defs>${Object.values(DEFS).join("")}</defs>` + s;
};
window.listo = Promise.all([700, 800, 900].map(w => document.fonts.load(`${w} 60px Montserrat`))).then(() => document.fonts.ready);
</script>
