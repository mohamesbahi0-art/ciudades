<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Bolas</title>
<!-- «Bolas» (canal de mapas): bolas-país con su bandera, sus ojos y sus bocadillos sobre un mapa del mundo de verdad.
     El país protagonista YA está borrado en el primer fotograma (hueco negro con el borde rojo que parpadea) y no vuelve
     a pintarse. La toma cambia de golpe cada 2,3 s como mucho (la primera vez, en el segundo 1,25) y en cada toma se
     mueve algo. El mapa cambia a la vista: entra el agua, el hueco crece, una bola se cae dentro, un vecino conquista
     un trozo con su color o un objeto (un emoji) cae y lo tapa.
     Lo usa render.js: window.GUION = guion; await window.listo; window.pintar(t) para cada fotograma.
     Mapa: Natural Earth (dominio público). Banderas: flag-icons (MIT), en banderas/. -->
<style>
@font-face{font-family:"Poppins";font-weight:600;src:url("fuentes/poppins-600.woff2") format("woff2")}
@font-face{font-family:"Poppins";font-weight:800;src:url("fuentes/poppins-800.woff2") format("woff2")}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#2E86C9}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
const W = 1080, H = 1920, VISTA = { x: 30, y: 330, w: 1020, h: 1090 };
const ctx = document.getElementById("c").getContext("2d");
const lim = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const suave = x => { x = lim(x); return x * x * (3 - 2 * x); };
const atras = x => { x = lim(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const azar = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const CAMINOS = {}, BANDERAS = {};
let G = null;

function preparar() {
  G = window.GUION;
  for (const [iso, p] of Object.entries(G.mapa || {})) CAMINOS[iso] = new Path2D(p.d);
  const isos = new Set([G.pais]);
  for (const e of G.escenas) for (const b of e.bolas || []) isos.add(b.pais);
  return Promise.all([...isos].map(iso => new Promise(ok => {
    const img = new Image();
    img.onload = () => { BANDERAS[iso] = img; ok(); };
    img.onerror = () => ok();
    img.src = "banderas/" + iso.toLowerCase() + ".svg";
  })));
}

/* ---------- cámara ---------- */
function camaraDe(caja) {
  const [x0, y0, x1, y1] = caja, w = x1 - x0, h = y1 - y0;
  const s = Math.min(VISTA.w / w, VISTA.h / h);
  return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, s };
}
function escenaEn(t) {
  const es = G.escenas;
  for (let i = 0; i < es.length; i++) if (t < es[i].fin) return i;
  return es.length - 1;
}
function camara(t) { return camaraDe(G.escenas[escenaEn(t)].caja); }   // fija en la escena: el movimiento lo ponen las tomas
const TOMA = 2.3, CENTRO = [VISTA.x + VISTA.w / 2, VISTA.y + VISTA.h / 2], TOMAS = {};
function tomas(i) {                                // los segundos en los que cambia la toma (igual que bolas.cortes)
  if (TOMAS[i]) return TOMAS[i];
  const e = G.escenas[i], c = [e.inicio];
  if (i === 0 && e.fin - e.inicio > 1.9) c.push(e.inicio + 1.25);
  const ultimo = c[c.length - 1], resto = e.fin - ultimo, n = Math.max(1, Math.ceil(resto / TOMA));
  for (let k = 1; k < n; k++) c.push(ultimo + resto * k / n);
  return (TOMAS[i] = c);
}
function tomaEn(t) {
  const i = escenaEn(t), c = tomas(i), e = G.escenas[i];
  let j = 0; while (j + 1 < c.length && t >= c[j + 1]) j++;
  return { i, j, a: c[j], b: j + 1 < c.length ? c[j + 1] : e.fin };
}
/* La toma: un zoom de toda la imagen (mapa y bolas) hacia un punto. Cambia de golpe y, dentro, se mueve despacio. */
function vistaDe(t, pos, hueco) {
  const tm = tomaEn(t), e = G.escenas[tm.i], d = lim((t - tm.a) / Math.max(0.4, tm.b - tm.a));
  const orden = tm.i === 0 ? [0, 2, 1, 3] : (e.plano === "mundo" ? [0, 1, 3, 2] : [0, 1, 2, 3]), v = orden[tm.j % 4];
  const habla = (e.voces || []).find(x => x.a != null && x.a < tm.b && x.b > tm.a);
  const deBola = k => { const p = pos[k % Math.max(1, pos.length)]; return p ? [p.x, p.y] : null; };
  const quien = habla ? pos.findIndex(p => p.b.pais === habla.pais) : -1;
  const huecoVisible = e.plano !== "bolas" && hueco[0] > 60 && hueco[0] < W - 60 && hueco[1] > 380 && hueco[1] < 1380;
  let z = 1 + 0.07 * d, p = CENTRO;
  if (quien >= 0 && tm.j > 0) { z = 1.45 + 0.08 * d; p = deBola(quien); }                 // quien habla, de cerca
  else if (v === 1) { z = 1.5 + 0.1 * d; p = huecoVisible ? hueco : (deBola(0) || CENTRO); }
  else if (v === 2) { z = 0.68 - 0.05 * d; }
  else if (v === 3) { z = 1.32 + 0.08 * d; p = deBola(1) || (huecoVisible ? hueco : CENTRO); }
  return { z, p, toma: tm, pasa: (x, y) => [CENTRO[0] + (x - p[0]) * z, CENTRO[1] + (y - p[1]) * z] };
}
function aPantalla(c, x, y) {
  return [VISTA.x + VISTA.w / 2 + (x - c.cx) * c.s, VISTA.y + VISTA.h / 2 + (y - c.cy) * c.s];
}

/* ---------- el mapa ---------- */
function aclarar(hex, k) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.round(v + (255 - v) * k);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function mar(t) {
  const fondo = ctx.createLinearGradient(0, 0, 0, H);
  fondo.addColorStop(0, "#5BC0F0"); fondo.addColorStop(1, "#2479BD");
  ctx.fillStyle = fondo; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.lineWidth = 4;
  for (let k = 0; k < 14; k++) {                    // olitas que se mueven despacio
    const y = 120 + k * 135, d = (t * 18 + k * 47) % 180;
    ctx.beginPath();
    for (let x = -200 + d; x < W + 200; x += 180) { ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 22, y - 12, x + 44, y); }
    ctx.stroke();
  }
  ctx.restore();
}
/* Lo que le ha pasado al hueco hasta el segundo t (lo que cambia, se queda cambiado). */
function historia() {
  if (G._h) return G._h;
  const h = { agua: [], crece: [], trozos: [], tapas: [] }, [hx, hy] = G.hueco.centro;
  for (const e of G.escenas) {
    if (e.accion === "agua") h.agua.push(e.inicio + 0.3);
    if (e.accion === "crece") h.crece.push(e.inicio + 0.3);
    if (e.accion === "tapa" && e.objeto) h.tapas.push({ t: e.inicio, emoji: e.objeto });
    const b = (e.bolas || [])[0];
    if (e.accion === "conquista" && b && G.mapa[b.pais]) {
      const dx = b.x - hx, dy = b.y - hy, d = Math.hypot(dx, dy) || 1;
      h.trozos.push({ t: e.inicio + 0.3, color: G.mapa[b.pais].c, ux: dx / d, uy: dy / d,
                      veces: h.trozos.filter(x => x.pais === b.pais).length, pais: b.pais });
    }
  }
  return (G._h = h);
}
function crecido(t) { return 1 + historia().crece.reduce((s, a) => s + 0.24 * atras((t - a) / 0.7), 0); }
function mapa(t, c, foco, golpe) {
  const protagonista = G.pais, h = historia();
  ctx.save();
  ctx.translate(VISTA.x + VISTA.w / 2, VISTA.y + VISTA.h / 2); ctx.scale(c.s, c.s); ctx.translate(-c.cx, -c.cy);
  ctx.lineJoin = "round";
  for (const [iso, p] of Object.entries(G.mapa)) {
    if (iso === protagonista) continue;              // el país borrado no se pinta NUNCA
    ctx.fillStyle = iso === foco ? aclarar(p.c, 0.25) : p.c;
    ctx.fill(CAMINOS[iso]);
    ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = (iso === foco ? 4.5 : 2.2) / c.s; ctx.stroke(CAMINOS[iso]);
  }
  const camino = CAMINOS[protagonista];
  if (camino) {
    const [x0, y0, x1, y1] = G.hueco.caja, [hx, hy] = G.hueco.centro, radio = Math.hypot(x1 - x0, y1 - y0) / 2;
    const k = crecido(t), late = 0.5 + 0.5 * Math.sin(t * 9);                 // el borde parpadea unas 1,5 veces por segundo
    ctx.save(); ctx.translate(hx, hy); ctx.scale(k, k); ctx.translate(-hx, -hy);
    ctx.fillStyle = "#080B14"; ctx.fill(camino);                              // el hueco: negro
    ctx.save(); ctx.clip(camino);
    const fondo = ctx.createRadialGradient(hx, hy, radio * 0.05, hx, hy, radio);   // con fondo, que se note el agujero
    fondo.addColorStop(0, "rgba(0,0,0,0.9)"); fondo.addColorStop(1, "rgba(60,20,30,0.55)");
    ctx.fillStyle = fondo; ctx.fillRect(x0 - 5, y0 - 5, x1 - x0 + 10, y1 - y0 + 10);
    for (const z of h.trozos) {                                               // los trozos que se quedan los vecinos
      const q = suave((t - z.t) / 0.9); if (q <= 0) continue;
      ctx.beginPath(); ctx.arc(hx + z.ux * radio, hy + z.uy * radio, radio * (0.95 + 0.4 * z.veces) * q, 0, Math.PI * 2);
      ctx.fillStyle = z.color; ctx.fill();
      const img = BANDERAS[z.pais];                                           // con su bandera: se ve de quién es el trozo
      if (img) { ctx.save(); ctx.clip(); ctx.globalAlpha = 0.9; const l = Math.max(x1 - x0, y1 - y0) * 1.15; ctx.drawImage(img, hx - l / 2, hy - l / 2, l, l); ctx.restore(); }
      ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 7 / c.s / k; ctx.stroke();
    }
    const nivel = lim(h.agua.reduce((s, a) => s + 0.42 * suave((t - a) / 1.3), 0));
    if (nivel > 0) {                                                          // el agua que ha entrado
      const alto = y1 - y0, sup = y1 - alto * nivel, paso = (x1 - x0) / 24;
      ctx.beginPath(); ctx.moveTo(x0 - 5, y1 + 5);
      for (let x = x0 - 5; x <= x1 + 5 + paso; x += paso) ctx.lineTo(x, sup + Math.sin(x / paso * 1.3 + t * 6) * alto * 0.025);
      ctx.lineTo(x1 + 5, y1 + 5); ctx.closePath();
      ctx.fillStyle = "#2FA8E8"; ctx.fill(); ctx.strokeStyle = "#D6F1FF"; ctx.lineWidth = 6 / c.s / k; ctx.stroke();
    }
    ctx.strokeStyle = `rgba(255,${Math.round(30 + 60 * late)},${Math.round(30 + 30 * late)},0.55)`;   // resplandor rojo hacia dentro
    ctx.lineWidth = (34 + 22 * late) / c.s / k; ctx.stroke(camino);
    ctx.restore();
    ctx.strokeStyle = late > 0.5 ? "#FF2B2B" : "#FFE23D"; ctx.lineWidth = (10 + 7 * late + 14 * golpe) / c.s / k; ctx.stroke(camino);
    ctx.setLineDash([14 / c.s / k, 12 / c.s / k]); ctx.lineDashOffset = -t * 40 / c.s / k;
    ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 3.5 / c.s / k; ctx.stroke(camino);
    ctx.restore();
    if (golpe > 0) {                                                          // en cada toma, una onda sale del hueco
      const f = 1 - golpe;
      ctx.save(); ctx.globalAlpha = golpe * 0.9; ctx.strokeStyle = "#FF2B2B"; ctx.lineWidth = (16 * golpe + 4) / c.s;
      ctx.beginPath(); ctx.arc(hx, hy, radio * k * (0.55 + 1.5 * suave(f)), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
  }
  ctx.restore();
}
function emoji(txt, x, y, tam, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `${Math.round(tam)}px "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(0,0,0,0.28)"; ctx.beginPath(); ctx.ellipse(0, tam * 0.52, tam * 0.42, tam * 0.08, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#111"; ctx.fillText(txt, 0, 0); ctx.restore();
}
/* Los objetos (un emoji): caen del cielo sobre el hueco. El que «tapa» es gigante y se queda. */
function objetos(t, c, e) {
  const [hx, hy] = aPantalla(c, ...G.hueco.centro), [x0, , x1] = G.hueco.caja, h = historia();
  const tapa = [...h.tapas].reverse().find(x => t >= x.t);
  const caer = (desde, y) => { const f = lim((t - desde - 0.2) / 0.45); return f <= 0 ? null : -260 + (y + 260) * (f < 1 ? f * f : 1) - (f >= 1 ? Math.abs(Math.sin((t - desde - 0.65) * 9)) * 46 * Math.exp(-(t - desde - 0.65) * 3.5) : 0); };
  if (tapa && e.plano !== "bolas") {
    const tam = lim((x1 - x0) * crecido(t) * c.s * 1.05, 300, 860), y = caer(tapa.t, hy);
    if (y != null) emoji(tapa.emoji, hx, y, tam, Math.sin(t * 2.2) * 0.04);
  }
  if (e.objeto && !(tapa && tapa.t === e.inicio && e.plano !== "bolas")) {
    const enBolas = e.plano === "bolas", y = caer(e.inicio, enBolas ? 700 : hy);
    if (y != null) emoji(e.objeto, enBolas ? W / 2 : hx, y, enBolas ? 330 : 250, Math.sin(t * 5) * 0.1);
  }
}

/* ---------- las bolas ---------- */
function ojos(expr, r, mira, parpadeo) {
  const dx = r * 0.33, y = -r * 0.1, rx = r * 0.17, ry = (expr === "sorprendido" || expr === "asustado" ? 0.27 : 0.22) * r;
  const mx = mira * r * 0.07;
  ctx.lineWidth = Math.max(3, r * 0.045); ctx.strokeStyle = "#111";
  for (const lado of [-1, 1]) {
    const x = lado * dx + mx;
    ctx.save();
    if (expr === "feliz") {                                       // ojos que sonríen
      ctx.lineWidth = Math.max(4, r * 0.06); ctx.lineCap = "round";
      ctx.beginPath(); ctx.arc(x, y + ry * 0.35, rx * 0.95, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.restore(); continue;
    }
    const alto = parpadeo ? ry * 0.12 : (expr === "malvado" ? ry * 0.5 : ry);
    ctx.beginPath(); ctx.ellipse(x, y, rx, alto, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#FFF"; ctx.fill(); ctx.stroke();
    if (!parpadeo && ["enfadado", "malvado", "triste"].includes(expr)) {       // el párpado da el humor
      ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, rx, alto, 0, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = "#111"; ctx.beginPath();
      const dentro = expr === "triste" ? -lado : lado;             // triste: cae hacia fuera; enfadado: hacia dentro
      ctx.moveTo(x - rx * 1.2, y - alto * 1.2); ctx.lineTo(x + rx * 1.2, y - alto * 1.2);
      ctx.lineTo(x + rx * 1.2, y - alto * (dentro < 0 ? -0.05 : 0.6));
      ctx.lineTo(x - rx * 1.2, y - alto * (dentro < 0 ? 0.6 : -0.05)); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    if (!parpadeo && ["sorprendido", "asustado", "malvado"].includes(expr)) {   // pupilas
      ctx.fillStyle = "#111"; ctx.beginPath();
      ctx.arc(x + mira * rx * 0.35, y + (expr === "malvado" ? 0 : ry * 0.1), expr === "asustado" ? rx * 0.18 : rx * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  if (expr === "asustado") {                                       // gota de sudor
    ctx.fillStyle = "#7FD3FF"; ctx.strokeStyle = "#111"; ctx.lineWidth = Math.max(2, r * 0.025);
    ctx.beginPath(); ctx.moveTo(r * 0.72, -r * 0.55); ctx.quadraticCurveTo(r * 0.86, -r * 0.3, r * 0.72, -r * 0.25);
    ctx.quadraticCurveTo(r * 0.58, -r * 0.3, r * 0.72, -r * 0.55); ctx.fill(); ctx.stroke();
  }
}
function bola(b, x, y, r, rot, alfa, mira, parpadeo) {
  ctx.save(); ctx.globalAlpha = alfa; ctx.translate(x, y);
  ctx.fillStyle = "rgba(0,0,0,0.22)"; ctx.beginPath(); ctx.ellipse(0, r * 0.98, r * 0.78, r * 0.16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(rot);
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
  const img = BANDERAS[b.pais];
  if (img) ctx.drawImage(img, -r, -r, 2 * r, 2 * r); else { ctx.fillStyle = "#DDD"; ctx.fillRect(-r, -r, 2 * r, 2 * r); }
  const brillo = ctx.createRadialGradient(-r * 0.35, -r * 0.42, r * 0.05, 0, 0, r * 1.05);
  brillo.addColorStop(0, "rgba(255,255,255,0.40)"); brillo.addColorStop(0.45, "rgba(255,255,255,0)");
  brillo.addColorStop(1, "rgba(0,0,0,0.30)");
  ctx.fillStyle = brillo; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  ctx.restore();
  ctx.lineWidth = Math.max(4, r * 0.055); ctx.strokeStyle = "#141414";
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ojos(b.expresion, r, mira, parpadeo);
  ctx.restore();
}
function lagrimas(x, y, r, t) {
  ctx.save(); ctx.fillStyle = "#7FD3FF"; ctx.strokeStyle = "#1B5E8C"; ctx.lineWidth = 2;
  for (const lado of [-1, 1]) for (let k = 0; k < 3; k++) {
    const f = ((t * 1.6 + k / 3) % 1), gx = x + lado * r * 0.33, gy = y + r * 0.1 + f * r * 1.1;
    ctx.globalAlpha = 1 - f; ctx.beginPath(); ctx.ellipse(gx, gy, r * 0.05, r * 0.08, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function bocadillo(texto, x, y, r, aparece, puestos) {
  if (!texto) return;
  const q = atras(aparece / 0.3);
  if (aparece <= 0) return;
  ctx.save(); ctx.font = "800 44px Poppins";
  const palabras = texto.split(/\s+/), lineas = []; let l = "";
  for (const p of palabras) { const prueba = (l + " " + p).trim(); if (ctx.measureText(prueba).width > 420 && l) { lineas.push(l); l = p; } else l = prueba; }
  if (l) lineas.push(l);
  const ancho = Math.max(...lineas.map(s => ctx.measureText(s).width)) + 56, alto = lineas.length * 52 + 34;
  let bx = lim(x - ancho / 2, 24, W - 24 - ancho), by = y - r - 40 - alto;
  if (by < 340) by = y + r + 40;                       // si no cabe arriba (ahí van las letras grandes), debajo
  by = lim(by, 340, 1470 - alto);                      // nunca encima de los subtítulos ni fuera de la pantalla
  for (const o of puestos || [])                       // ni encima de otro bocadillo
    if (bx < o[0] + o[2] && bx + ancho > o[0] && by < o[1] + o[3] && by + alto > o[1]) by = o[1] - alto - 34 >= 340 ? o[1] - alto - 34 : o[1] + o[3] + 34;
  if (puestos) puestos.push([bx, by, ancho, alto]);
  const colaX = lim(x, bx + 30, bx + ancho - 30), arriba = by < y;
  ctx.translate(colaX, arriba ? by + alto : by); ctx.scale(q, q); ctx.translate(-colaX, -(arriba ? by + alto : by));
  ctx.fillStyle = "#FFFFFF"; ctx.strokeStyle = "#111"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.roundRect(bx, by, ancho, alto, 26); ctx.fill(); ctx.stroke();
  ctx.beginPath();                                      // la colita hacia la bola
  if (arriba) { ctx.moveTo(colaX - 16, by + alto - 2); ctx.lineTo(colaX, by + alto + 26); ctx.lineTo(colaX + 16, by + alto - 2); }
  else { ctx.moveTo(colaX - 16, by + 2); ctx.lineTo(colaX, by - 26); ctx.lineTo(colaX + 16, by + 2); }
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#111"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  lineas.forEach((s, i) => ctx.fillText(s, bx + ancho / 2, by + 17 + 26 + i * 52));
  ctx.restore();
}
function confeti(t, desde) {
  ctx.save();
  for (let k = 0; k < 70; k++) {
    const f = t - desde - azar(k) * 0.6; if (f < 0) continue;
    const x = azar(k + 3) * W + Math.sin(f * 3 + k) * 30, y = -40 + f * (380 + azar(k + 7) * 300);
    if (y > H) continue;
    ctx.save(); ctx.translate(x, y); ctx.rotate(f * 5 + k);
    ctx.fillStyle = ["#FFD43B", "#FF6B6B", "#4DD4AC", "#5C7CFA", "#F783AC"][k % 5]; ctx.fillRect(-9, -5, 18, 10);
    ctx.restore();
  }
  ctx.restore();
}
function sitios(e, c, t) {
  const n = e.bolas.length;
  if (e.plano === "bolas") {                           // de cerca, en fila
    const r = n <= 2 ? 185 : n === 3 ? 150 : 125, paso = W / (n + 1);
    return e.bolas.map((b, k) => ({ b, x: paso * (k + 1), y: 1060 + (k % 2) * 40, r }));
  }
  const r = n <= 1 ? 120 : n === 2 ? 105 : n === 3 ? 92 : 82;
  const pos = e.bolas.map(b => { const [x, y] = aPantalla(c, b.x, b.y); return { b, x, y, r }; });
  for (let i = 0; i < pos.length; i++) for (let j = 0; j < i; j++) {   // que no se monten unas encima de otras
    const a = pos[i], o = pos[j], d = Math.hypot(a.x - o.x, a.y - o.y);
    if (d < a.r + o.r + 20) { const k = (a.r + o.r + 20 - d) / 2 + 1, ux = d ? (a.x - o.x) / d : 1, uy = d ? (a.y - o.y) / d : 0; a.x += ux * k; a.y += uy * k; o.x -= ux * k; o.y -= uy * k; }
  }
  for (const p of pos) { p.x = lim(p.x, p.r + 24, W - p.r - 24); p.y = lim(p.y, 420 + p.r, 1360 - p.r); }
  return pos;
}
function bolas(t, c, pos, vista) {
  const i = escenaEn(t), e = G.escenas[i], dentro = t - e.inicio, toma = vista.toma;
  const [hx, hy] = aPantalla(c, ...G.hueco.centro), textos = [];
  pos.forEach((p, k) => {
    const sale = i === 0 ? 1 : dentro - 0.04 - 0.08 * k; if (sale <= 0) return;      // en el primer fotograma ya están
    let { x, y, r } = p, rot = 0, alfa = 1, mira = Math.sign(hx - x) || 0, tam = 1;
    const bote = toma.j > 0 ? 1 + 0.16 * Math.sin(lim((t - toma.a) / 0.3) * Math.PI) : 1;   // en cada toma, un bote
    const escala = atras(sale / 0.3) * bote;
    const vz = (e.voces || []).find(v => v.pais === p.b.pais && v.a != null);   // cuándo habla esta bola con su voz
    y += Math.sin(t * 3 + k) * r * 0.05;                       // respira
    if (i === 0) { const f = 1 - suave(t / 0.9); x += (x < hx ? -1 : 1) * 70 * f; y -= Math.abs(Math.sin(t * 7 + k)) * r * 0.2; }   // se asoman
    if (vz && t >= vz.a && t <= vz.b) y -= Math.abs(Math.sin((t - vz.a) * 9)) * r * 0.12;   // bota mientras habla
    const fase = (t - e.inicio) * 2.2 + k * 0.4;
    if (e.accion === "salta" || e.accion === "celebra") y -= Math.abs(Math.sin(Math.PI * fase)) * r * 0.35;
    if (e.accion === "tiembla" || p.b.expresion === "asustado") x += Math.sin(t * 60 + k) * r * 0.05;
    if (e.accion === "rie") rot = Math.sin(t * 12 + k) * 0.16;
    if (e.accion === "corre") { const f = suave(dentro / Math.max(0.5, e.fin - e.inicio)); x += (hx - x) * f * 0.6; y += (hy - y) * f * 0.6; }
    if (e.accion === "conquista" && k === 0 && e.plano !== "bolas") { const f = suave((dentro - 0.2) / 0.8); x += (hx - x) * f * 0.45; y += (hy - y) * f * 0.45; }
    if (e.accion === "cae" && k === 0) {                       // se asoma demasiado… y se cae dentro del hueco
      const f = lim((dentro - 0.5) / 1.1), ax = e.plano === "bolas" ? x : hx, ay = e.plano === "bolas" ? y + 420 : hy;

    }

    ctx.restore();
    if (e.accion === "llora" || p.b.expresion === "triste") lagrimas(x, y, r * escala, t);
    if (e.accion === "rie" && sale > 0.3) { ctx.save(); ctx.font = "800 40px Poppins"; ctx.fillStyle = "#FFF"; ctx.strokeStyle = "#111"; ctx.lineWidth = 6; ctx.textAlign = "center"; const jx = p.b.dice ? x - r * 1.15 : x + r * 0.9, jy = p.b.dice ? y + r * 0.1 : y - r * 0.9; ctx.strokeText("JA JA", jx, jy); ctx.fillText("JA JA", jx, jy); ctx.restore(); }
    if (e.accion === "pelea" && k === 0 && pos.length >= 2) {
      const f = Math.abs(Math.sin(Math.PI * fase * 0.8));
      if (f > 0.85) { ctx.save(); ctx.fillStyle = "#FFD43B"; ctx.strokeStyle = "#111"; ctx.lineWidth = 4; const sx = (x + pos[1].x) / 2, sy = (y + pos[1].y) / 2 - r * 0.6; ctx.beginPath(); for (let j = 0; j < 10; j++) { const a = j * Math.PI / 5, rr = j % 2 ? 22 : 50; ctx.lineTo(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
    }
    if (p.b.dice && !(e.accion === "cae" && k === 0 && tam < 0.6))
      textos.push([p.b.dice, x, y, r * escala, vz ? t - vz.a + 0.1 : dentro - 0.3 - 0.25 * k]);   // el bocadillo, cuando suena su voz

}

/* ---------- letras ---------- */
function rotulo(txt, x, y, tam, color, alfa = 1, sombra = "#000") {
  ctx.save(); ctx.globalAlpha = alfa; ctx.font = `800 ${tam}px Poppins`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.lineWidth = Math.max(8, tam * 0.16); ctx.strokeStyle = sombra; ctx.strokeText(txt, x, y);
  ctx.fillStyle = color; ctx.fillText(txt, x, y); ctx.restore();
}
function gancho(t) {
  const txt = String(G.texto_pantalla || "").toUpperCase();
  if (!txt || t > 2.6) return;
  const q = lim((2.6 - t) / 0.25), palabras = txt.split(/\s+/), lineas = []; let l = "";
  for (const p of palabras) { if ((l + " " + p).trim().length > 15 && l) { lineas.push(l); l = p; } else l = (l + " " + p).trim(); }
  if (l) lineas.push(l);
  lineas.forEach((s, i) => rotulo(s, W / 2, 200 + i * 96, 82, "#FFFFFF", q));
}
function clave(t) {
  if (t < 2.6) return;
  const e = G.escenas[escenaEn(t)], dentro = t - e.inicio;
  if (!e.texto || dentro < 0.1) return;
  const q = atras((dentro - 0.1) / 0.3), sale = lim((e.fin - t) / 0.2);
  ctx.save(); ctx.translate(W / 2, 250); ctx.scale(q, q); rotulo(e.texto.toUpperCase(), 0, 0, 92, "#FFE23D", sale); ctx.restore();
}
function palabrasDe(e) {
  if (e.palabras && e.palabras.length) return e.palabras;
  const ws = String(e.voz || "").split(/\s+/).filter(Boolean), d = Math.max(0.5, e.fin - e.inicio - 0.3);
  return ws.map((p, i) => ({ p, a: e.inicio + (d * i) / ws.length, b: e.inicio + (d * (i + 1)) / ws.length }));
}
function subtitulos(t) {
  const e = G.escenas[escenaEn(t)], ws = palabrasDe(e), grupos = [];
  for (let i = 0; i < ws.length; i += 3) grupos.push(ws.slice(i, i + 3));
  const gr = grupos.find(x => t < x[x.length - 1].b + 0.08) || grupos[grupos.length - 1];
  if (!gr || t < gr[0].a - 0.1) return;
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const piezas = gr.map(w => ({ w, on: t >= w.a && t < w.b + 0.05 }));
  const anchos = piezas.map(p => { ctx.font = `800 ${p.on ? 92 : 84}px Poppins`; return ctx.measureText(String(p.w.p).toUpperCase()).width; });
  const total = anchos.reduce((a, b) => a + b, 0) + 26 * (piezas.length - 1), esc = total > 1000 ? 1000 / total : 1;
  let x = W / 2 - Math.min(total, 1000) / 2;
  piezas.forEach((p, i) => {
    const w = anchos[i] * esc, s = String(p.w.p).toUpperCase();
    ctx.font = `800 ${Math.round((p.on ? 92 : 84) * esc)}px Poppins`;
    ctx.lineJoin = "round"; ctx.lineWidth = 15; ctx.strokeStyle = "#000"; ctx.strokeText(s, x + w / 2, 1610);
    ctx.fillStyle = p.on ? "#FFE23D" : "#FFFFFF"; ctx.fillText(s, x + w / 2, 1610);
    x += w + 26 * esc;
  });
  ctx.restore();
}
function final(t) {
  const d = G.duracion || 1, q = lim((t - (d - 3.2)) / 0.3);        // la pregunta, los últimos 3 segundos
  if (q <= 0) return;
  const txt = G.pregunta || "¿QUIÉN SE QUEDA EL HUECO? 👇";
  ctx.save(); ctx.translate(W / 2, 1440); ctx.scale(atras(q), atras(q));     // abajo, para no tapar a las bolas
  ctx.font = "800 70px Poppins"; let w = ctx.measureText(txt).width + 70;
  if (w > 1020) { ctx.font = `800 ${Math.floor(70 * 950 / (w - 70))}px Poppins`; w = 1020; }
  ctx.globalAlpha = q; ctx.fillStyle = "#FFD43B"; ctx.strokeStyle = "#111"; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.roundRect(-w / 2, -58, w, 116, 58); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#111"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(txt, 0, 4); ctx.restore();
}

window.pintar = function (t) {
  const c = camara(t), e = G.escenas[escenaEn(t)];
  const pos = sitios(e, c, t), vista = vistaDe(t, pos, aPantalla(c, ...G.hueco.centro));
  const golpe = 1 - lim((t - vista.toma.a) / 0.55);                      // lo que queda del golpe de esta toma
  mar(t);
  ctx.save();                                                            // la toma: todo lo del mapa, con su zoom
  ctx.translate(CENTRO[0], CENTRO[1]); ctx.scale(vista.z, vista.z); ctx.translate(-vista.p[0], -vista.p[1]);
  mapa(t, c, e.foco, golpe);
  const cerca = vista.z > 1.2;
  if (e.plano === "bolas") { ctx.fillStyle = cerca ? "rgba(8,12,30,0.8)" : "rgba(10,20,40,0.42)"; ctx.fillRect(-W * 2, -H * 2, W * 5, H * 5); }
  objetos(t, c, e);
  const textos = bolas(t, c, pos, vista);
  ctx.restore();
  if (cerca) {                                                           // de cerca: los bordes a oscuras y rayas de velocidad
    const som = ctx.createRadialGradient(CENTRO[0], CENTRO[1], 330, CENTRO[0], CENTRO[1], 1050);
    som.addColorStop(0, "rgba(5,8,25,0)"); som.addColorStop(1, "rgba(5,8,25,0.78)");
    ctx.fillStyle = som; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineCap = "round";
    for (let k = 0; k < 26; k++) {
      const a = azar(k + vista.toma.j * 31) * Math.PI * 2, r0 = 560 + ((t * 900 + azar(k) * 500) % 420), r1 = r0 + 150 + azar(k + 5) * 160;
      ctx.lineWidth = 3 + azar(k + 2) * 6; ctx.beginPath();
      ctx.moveTo(CENTRO[0] + Math.cos(a) * r0, CENTRO[1] + Math.sin(a) * r0 * 1.3); ctx.lineTo(CENTRO[0] + Math.cos(a) * r1, CENTRO[1] + Math.sin(a) * r1 * 1.3); ctx.stroke();
    }
    ctx.restore();
  }
  if (e.accion === "celebra") confeti(t, e.inicio + 0.3);
  if (t > 0.2 && t - vista.toma.a < 0.1) { ctx.fillStyle = `rgba(255,255,255,${0.82 * (1 - (t - vista.toma.a) / 0.1)})`; ctx.fillRect(0, 0, W, H); }   // el fogonazo del corte

    const [bx, by] = vista.pasa(x, y);

};
window.listo = Promise.all([600, 800].map(w => document.fonts.load(`${w} 60px Poppins`)))
  .then(() => new Promise(ok => { const mira = () => window.GUION ? ok() : setTimeout(mira, 20); mira(); }))
  .then(preparar).then(() => document.fonts.ready);
</script>
