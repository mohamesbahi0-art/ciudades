<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Casi lista</title>
<style>
:root{--fondo:#f4f6f8;--caja:#fff;--texto:#1c2733;--suave:#5b6b7b;--borde:#c9d3dd;--azul:#1d5fa8}
@media (prefers-color-scheme:dark){:root{--fondo:#121a22;--caja:#1b2631;--texto:#e5ebf0;--suave:#9fb0c0;--borde:#33424f;--azul:#7fb6ff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--texto)}
main{width:100%;max-width:26rem;background:var(--caja);border:1px solid var(--borde);border-radius:16px;padding:1.5rem}
h1{font-size:1.4rem;margin:0 0 .5rem}
p{margin:0 0 1rem;color:var(--suave)}
button{font:inherit;padding:.6rem 1rem;border:1px solid var(--borde);border-radius:10px;background:transparent;color:var(--azul);cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>La app nueva todavía no está</h1>
  <p>Ya has entrado bien. La fábrica sigue trabajando sola; la app nueva aparecerá aquí en cuanto esté lista.</p>
  <p>Vuelve a abrir esta página dentro de un rato.</p>
  <button id="salir" type="button">Salir</button>
</main>
<script>
document.getElementById("salir").addEventListener("click", function () {
  fetch("/api/salir", { method: "POST", credentials: "same-origin" }).then(function () { location.replace("/entrar"); },
    function () { location.replace("/entrar"); });
});
</script>
</body>
</html>
