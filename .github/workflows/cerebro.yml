# El Cerebro: manda sobre todas las ciudades. Cada media hora aprende de cada vídeo juzgado, mide sus planes, arregla
# lo que frena a una cuenta y le deja al guionista el plan del próximo vídeo (meta: 100, no el aprobado). Lo cuenta en
# directo en estado/cerebro/directo.json. Trabaja en GitHub: no depende del plan del dueño ni de Claude.
name: Cerebro
on:
  schedule:
    - cron: "10,25,40,55 * * * *"
  push:
    paths:
      - "peticiones/cerebro.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cerebro
  cancel-in-progress: false
jobs:
  cerebro:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sacar el repositorio privado
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ciudades-memoria
          token: ${{ secrets.GH_SECRETOS }}
          path: privado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Herramientas
        run: |
          pip install -q -r requirements.txt
          cd privado
          git config user.name "ciudades-bot"
          git config user.email "ciudades-bot@users.noreply.github.com"
      - name: Reparar, aprender, medir y pensar
        env:
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # la cadena de IA gratis de reserva (cada llave enciende su servicio; sin llave, no pasa nada)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bots/cerebro/cerebro.py
      - name: Guardar en el repositorio privado
        if: always()
        env:
          PRIVADO: privado
        run: |
          python -c "from bots.comun import privado; import sys; sys.exit(0 if privado.git_guardar('cerebro: pasada') else 1)"
