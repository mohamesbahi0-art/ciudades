# Prueba de la Ciudad Central: hace un vídeo de verdad para un canal, pero NO lo sube. Se pone en marcha cuando Claude deja
# peticiones/prueba.json ({"canal": "<clave>"}) o a mano desde Actions. El resultado va al repositorio privado (pruebas/).
name: Prueba de la Ciudad Central
on:
  push:
    paths:
      - "peticiones/prueba.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prueba-central
  cancel-in-progress: false
jobs:
  prueba:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Sacar el repositorio privado
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ciudades-memoria
          token: ${{ secrets.GH_SECRETOS }}
          path: privado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Herramientas
        run: |
          sudo apt-get update -qq || true   # un almacén ajeno de la máquina de GitHub caído no para el turno
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-inter fonts-noto-color-emoji
          pip install -q -r requirements.txt
          npm install --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
      - name: Hacer el vídeo de prueba
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # la cadena de IA gratis de reserva (cada llave enciende su servicio; sin llave, no pasa nada)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_SECRETOS: ${{ secrets.GH_SECRETOS }}
          ALMACEN_PRUEBAS: "1"
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
        run: python bots/central/turno.py --peticion peticiones/prueba.json --prueba --salida privado/pruebas
      - name: Guardar el resultado en el repositorio privado
        if: always()
        env:
          PRIVADO: privado
        run: |
          cd privado
          git config user.name "ciudades-bot"
          git config user.email "ciudades-bot@users.noreply.github.com"
          cd ..
          python -c "from bots.comun import privado; import sys; sys.exit(0 if privado.git_guardar('prueba de la Ciudad Central') else 1)"
