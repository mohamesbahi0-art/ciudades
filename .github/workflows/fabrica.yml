# La fábrica: cada media hora (24/7), en los servidores de GitHub, sin Claude y sin ningún ordenador encendido.
# (Lo pidió el dueño: que un vídeo suspendido se rehaga enseguida. Si no hay nada que hacer o no queda IA para esa
# hora, la ronda termina en un par de minutos.)
# Sube lo que esperaba en la cola, decide qué canales y barrios necesitan vídeo, los hace, los juzga y los programa en
# YouTube (o los deja en «Para subir» si son de TikTok/Instagram). Todo lo que pasa queda en el repositorio privado.
# También arranca cuando Claude deja peticiones/fabrica.json ({"solo": "gta", "maximo": 1}) o a mano desde Actions.
name: Fábrica
on:
  schedule:
    - cron: "17,47 * * * *"
  push:
    paths:
      - "peticiones/fabrica.json"
  workflow_dispatch:
    inputs:
      solo:
        description: "Solo estos canales (claves separadas por comas)"
        required: false
      maximo:
        description: "Cuántos vídeos como mucho"
        required: false
permissions:
  contents: read
jobs:
  ronda:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'   # los Mecánicos sí pueden arrancarla
    name: Línea de ${{ matrix.linea }}
    strategy:
      fail-fast: false
      matrix:
        linea: [canales, dibujos, cuentas, cuentas2]   # cuatro equipos a la vez (YouTube en dos y las cuentas en dos)
    concurrency:
      group: fabrica-${{ matrix.linea }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Sacar el repositorio privado
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ciudades-memoria
          token: ${{ secrets.GH_SECRETOS }}
          path: privado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-inter fonts-noto-color-emoji
          pip install -q -r requirements.txt
          npm install --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
          cd privado
          git config user.name "ciudades-bot"
          git config user.email "ciudades-bot@users.noreply.github.com"
      - name: Qué hacer
        id: que
        run: |
          solo="${{ github.event.inputs.solo }}"; maximo="${{ github.event.inputs.maximo }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -f peticiones/fabrica.json ]; then
            solo=$(python -c "import json;print(json.load(open('peticiones/fabrica.json')).get('solo',''))")
            maximo=$(python -c "import json;print(json.load(open('peticiones/fabrica.json')).get('maximo',''))")
          fi
          solo=$(printf '%s' "$solo" | tr -cd 'a-z0-9.,_-'); maximo=$(printf '%s' "$maximo" | tr -cd '0-9')
          args=""
          [ -n "$solo" ] && args="$args --solo $solo"
          [ -n "$maximo" ] && args="$args --maximo $maximo"
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Ronda de la fábrica
        env:
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # la cadena de IA gratis de reserva (cada llave enciende su servicio; sin llave, no pasa nada)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_SECRETOS: ${{ secrets.GH_SECRETOS }}
          YT_CLIENT_ID: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_CLIENT_ID || '' }}
          YT_CLIENT_SECRET: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_CLIENT_SECRET || '' }}
          YT_REFRESH_GTA: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_REFRESH_GTA || '' }}
          YT_ID_GTA: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_ID_GTA || '' }}
          YT_REFRESH_CLIPS: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_REFRESH_CLIPS || '' }}
          YT_ID_CLIPS: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_ID_CLIPS || '' }}
          YT_REFRESH_CURIOS: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_REFRESH_CURIOS || '' }}
          YT_ID_CURIOS: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_ID_CURIOS || '' }}
          YT_REFRESH_VERSUS: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_REFRESH_VERSUS || '' }}
          YT_ID_VERSUS: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_ID_VERSUS || '' }}
          YT_REFRESH_MAPAS: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_REFRESH_MAPAS || '' }}
          YT_ID_MAPAS: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_ID_MAPAS || '' }}
          YT_REFRESH_TERROR: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_REFRESH_TERROR || '' }}
          YT_ID_TERROR: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_ID_TERROR || '' }}
          YT_REFRESH_SOBSHORTS: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_REFRESH_SOBSHORTS || '' }}
          YT_ID_SOBSHORTS: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_ID_SOBSHORTS || '' }}
          YT_REFRESH_NIVSHORTS: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_REFRESH_NIVSHORTS || '' }}
          YT_ID_NIVSHORTS: ${{ (matrix.linea == 'canales' || matrix.linea == 'dibujos') && secrets.YT_ID_NIVSHORTS || '' }}
        run: python bots/central/fabrica.py --linea ${{ matrix.linea }} ${{ steps.que.outputs.args }}
      - name: Guardar lo que quede en el repositorio privado
        if: always()
        env:
          PRIVADO: privado
        run: |
          cd privado
          git config user.name "ciudades-bot"
          git config user.email "ciudades-bot@users.noreply.github.com"
          cd ..
          python -c "from bots.comun import privado; import sys; sys.exit(0 if privado.git_guardar('fábrica: lo que quedaba de la ronda') else 1)"
