# Rehacer un vídeo de «Para subir» con la voz y el muñeco que tenga ahora la cuenta, sin reescribirlo ni juzgarlo otra
# vez (lo pidió el dueño el 26 nov). Solo con peticiones/rehacer.json ({"cuenta": "barrio-3"}) o a mano desde Actions.
name: Rehacer un vídeo de Para subir
on:
  push:
    paths:
      - "peticiones/rehacer.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehacer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ciudades-memoria
          token: ${{ secrets.GH_SECRETOS }}
          path: privado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-inter fonts-noto-color-emoji
          pip install -q -r requirements.txt
          npm install --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
      - name: Rehacer
        env:
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_SECRETOS: ${{ secrets.GH_SECRETOS }}
        run: |
          cuenta=$(python -c "import json;print(json.load(open('peticiones/rehacer.json')).get('cuenta',''))")
          sala=$(python -c "import json;print(int(json.load(open('peticiones/rehacer.json')).get('sala',0)))")
          python bots/central/rehacer.py --cuenta "$cuenta" --sala "$sala"
      - name: Guardar en el repositorio privado
        if: always()
        env:
          PRIVADO: privado
        run: |
          cd privado
          git config user.name "ciudades-bot"
          git config user.email "ciudades-bot@users.noreply.github.com"
          cd ..
          python -c "from bots.comun import privado; import sys; sys.exit(0 if privado.git_guardar('rehacer: vídeo de Para subir con voz y muñeco nuevos') else 1)"
