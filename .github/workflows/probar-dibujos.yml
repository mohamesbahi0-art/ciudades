# Prueba de la Policía: ¿qué servicio gratis de dibujos acepta peticiones desde GitHub? Prueba AI Horde y los modelos
# de imagen de Gemini con la clave gratis. Solo enseña el código de respuesta y el mensaje de error, nunca claves.
# Se pone en marcha cuando Claude deja peticiones/dibujos.json o a mano desde Actions.
name: Probar dibujos
on:
  push:
    paths:
      - "peticiones/dibujos.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          def pedir(url, cuerpo=None, cabeceras=None):
              req = urllib.request.Request(url, data=json.dumps(cuerpo).encode() if cuerpo is not None else None,
                                           headers=dict({"Content-Type": "application/json"}, **(cabeceras or {})),
                                           method="POST" if cuerpo is not None else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
          # 1) AI Horde sin cuenta
          c, b = pedir("https://aihorde.net/api/v2/generate/async",
                       {"prompt": "a lighthouse at night", "models": ["AlbedoBase XL (SDXL)"], "params": {"width": 512, "height": 512, "steps": 10, "n": 1}},
                       {"apikey": "0000000000", "Client-Agent": "ciudades:1:anon"})
          print("AIHORDE", c, b[:400].decode(errors="replace"))
          c, b = pedir("https://aihorde.net/api/v2/status/heartbeat")
          print("AIHORDE heartbeat", c, b[:100])
          # 1b) lo mismo, presentándose con un nombre de programa propio (el de Python lo bloquea Cloudflare)
          ua = {"User-Agent": "ciudades-bot/1.0 (cliente de AI Horde)"}
          c, b = pedir("https://aihorde.net/api/v2/status/heartbeat", cabeceras=ua)
          print("AIHORDE heartbeat con nombre", c, b[:100])
          c, b = pedir("https://aihorde.net/api/v2/generate/async",
                       {"prompt": "a lighthouse at night", "models": ["AlbedoBase XL (SDXL)"], "params": {"width": 512, "height": 512, "steps": 10, "n": 1}},
                       dict(ua, apikey="0000000000", **{"Client-Agent": "ciudades:1:anon"}))
          print("AIHORDE con nombre", c, b[:300].decode(errors="replace"))
          # 2) Gemini: qué modelos de imagen hay con la clave gratis
          clave = os.environ.get("GEMINI_API_KEY", "")
          c, b = pedir("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", cabeceras={"x-goog-api-key": clave})
          modelos = [m["name"] for m in json.loads(b).get("models", [])] if c == 200 else []
          imagen = [m for m in modelos if "image" in m or "imagen" in m]
          print("GEMINI modelos de imagen:", imagen)
          for m in imagen:
              if "imagen" in m:
                  c, b = pedir(f"https://generativelanguage.googleapis.com/v1beta/{m}:predict",
                               {"instances": [{"prompt": "a lighthouse at night, digital painting"}], "parameters": {"sampleCount": 1, "aspectRatio": "9:16"}},
                               {"x-goog-api-key": clave})
              else:
                  c, b = pedir(f"https://generativelanguage.googleapis.com/v1beta/{m}:generateContent",
                               {"contents": [{"parts": [{"text": "A vertical 9:16 digital painting of a lighthouse at night. No text."}]}],
                                "generationConfig": {"responseModalities": ["IMAGE"], "imageConfig": {"aspectRatio": "9:16"}}},
                               {"x-goog-api-key": clave})
              if c == 200:
                  datos = json.loads(b)
                  partes = [p for cand in datos.get("candidates", []) for p in cand.get("content", {}).get("parts", []) if "inlineData" in p]
                  preds = datos.get("predictions", [])
                  print("GEMINI", m, "OK", "imágenes:", len(partes) + len(preds))
              else:
                  try:
                      msg = json.loads(b)["error"]["message"][:200]
                  except Exception:
                      msg = b[:200]
                  print("GEMINI", m, c, msg)
          PY
