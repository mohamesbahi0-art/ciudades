# Prueba de la Policía: qué modelos de Gemini contestan hoy con la clave gratis (cada modelo tiene su propio cupo).
# Solo enseña el nombre del modelo y el código de respuesta. Se pone en marcha con peticiones/gemini.json.
name: Probar Gemini
on:
  push:
    paths:
      - "peticiones/gemini.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          clave = os.environ["GEMINI_API_KEY"]
          def pedir(url, cuerpo=None):
              req = urllib.request.Request(url, data=json.dumps(cuerpo).encode() if cuerpo else None,
                                           headers={"Content-Type": "application/json", "x-goog-api-key": clave},
                                           method="POST" if cuerpo else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return 0, f"{type(e).__name__}".encode()
          c, b = pedir("https://generativelanguage.googleapis.com/v1beta/models?pageSize=300")
          modelos = [m["name"].split("/")[1] for m in json.loads(b).get("models", [])
                     if "generateContent" in m.get("supportedGenerationMethods", [])
                     and "image" not in m["name"] and "tts" not in m["name"] and "embedding" not in m["name"]]
          # ¿Puede Gemini ver un vídeo de YouTube por su enlace (sin descargarlo)?
          for m in ("gemini-3.6-flash", "gemini-3.5-flash", "gemini-3-flash-preview"):
              c, b = pedir(f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent",
                           {"contents": [{"parts": [{"file_data": {"file_uri": "https://www.youtube.com/watch?v=QdBZY2fkU-0"}},
                                                    {"text": "En 2 frases: qué se ve y en qué segundo está el momento más llamativo."}]}]})
              try:
                  r = json.loads(b)
                  txt = r["candidates"][0]["content"]["parts"][0]["text"][:160] if c == 200 else r["error"]["message"][:120]
              except Exception:
                  txt = str(b[:120])
              print(f"VIDEO {m}: {c} {txt}")
              if c == 200:
                  break
          print("MODELOS:", ", ".join(modelos))
          import time
          # una imagen diminuta (un cuadrado rojo) para saber quién ve imágenes
          FOTO = ("/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABALDA4MChAODQ4SERATGCgaGBYWGDEjJR0oOjM9PDkzODdASFxOQERXRTc4UG1RV19i"
                  "Z2hnPk1xeXBkeFxlZ2P/2wBDARESEhgVGC8aGi9jQjhCY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2Nj"
                  "Y2NjY2NjY2P/wAARCABAAEADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUF"
                  "BAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVW"
                  "V1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi"
                  "4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAEC"
                  "AxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVm"
                  "Z2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq"
                  "8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDHooorzz68KKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAo"
                  "oooAKKKKACiiigAooooA/9k=")
          for m in modelos:
              if not any(x in m for x in ("flash", "pro", "gemma", "gemini-4")) or any(x in m for x in ("robotics", "computer", "transcribe", "customtools", "banana", "lyria", "research", "antigravity")):
                  continue
              c, b = pedir(f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent",
                           {"contents": [{"parts": [{"text": "Di solo: hola"}]}]})
              if c == 503:                       # saturado: un respiro y otra vez
                  time.sleep(20)
                  c, b = pedir(f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent",
                               {"contents": [{"parts": [{"text": "Di solo: hola"}]}]})
              msg = ""
              if c != 200:
                  try:
                      msg = json.loads(b)["error"]["message"][:90]
                  except Exception:
                      msg = str(b[:90])
              print(f"MODELO {m}: {c} {msg}")
              if c == 200 and any(x in m for x in ("gemma", "gemini-4")):
                  c2, b2 = pedir(f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent",
                                 {"contents": [{"parts": [{"text": 'Mira la imagen. Contesta solo con JSON: {"color": "..."}'},
                                                          {"inline_data": {"mime_type": "image/jpeg", "data": FOTO}}]}]})
                  try:
                      t2 = json.loads(b2)["candidates"][0]["content"]["parts"][-1]["text"][:60].replace("\n", " ") if c2 == 200 else json.loads(b2)["error"]["message"][:90]
                  except Exception:
                      t2 = str(b2[:90])
                  print(f"  VE {m}: {c2} {t2}")
          PY
