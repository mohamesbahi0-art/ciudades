# El Ojeador de redes (Influencers): cada 3 horas mira TikTok e Instagram sin cuenta, como alguien que cotillea el móvil
# (sin disfrazarse ni saltarse nada: si una red dice que no, la deja en paz unas horas y vuelve a probar después), lee
# las cifras de los vídeos, Gemini ve los que más crecen y lo que funciona va a las recetas de los guionistas y a la app.
# También con peticiones/ojeador.json ({"solo": "barrio-2", "sin_ver": true}; usa alias, nunca el nombre de la cuenta).
# En este registro público solo salen alias y cuentas.
name: Ojeador de redes
on:
  schedule:
    - cron: "7 */3 * * *"
  push:
    paths:
      - "peticiones/ojeador.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ojeador
  cancel-in-progress: false
jobs:
  mirar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Sacar el repositorio privado
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ciudades-memoria
          token: ${{ secrets.GH_SECRETOS }}
          path: privado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Herramientas
        run: |
          sudo apt-get update -qq || true   # un almacén ajeno de la máquina de GitHub caído no para el turno
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt && pip install -q -U yt-dlp
          npm install --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
      - name: Mirar TikTok e Instagram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # la cadena de IA gratis de reserva (cada llave enciende su servicio; sin llave, no pasa nada)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
        run: |
          extra=""
          if [ "${{ github.event_name }}" = "push" ] && [ -f peticiones/ojeador.json ]; then
            extra=$(python -c "import json; p=json.load(open('peticiones/ojeador.json')); print(' '.join(x for x in (('--solo ' + p['solo']) if p.get('solo') else '', '--sin-ver' if p.get('sin_ver') else '') if x))")
          fi
          python bots/influencers/ojeador.py $extra
      - name: Guardar en el repositorio privado
        if: always()
        env:
          PRIVADO: privado
        run: |
          cd privado
          git config user.name "ciudades-bot"
          git config user.email "ciudades-bot@users.noreply.github.com"
          cd ..
          python -c "from bots.comun import privado; import sys; sys.exit(0 if privado.git_guardar('Ojeador de redes') else 1)"
