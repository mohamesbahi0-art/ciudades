# Derechos Sociales: una vez al día la Doctora, el Equipo de mejora, la Defensora, la Guía de los nuevos, la Psicóloga y
# el Jefe cuidan de los robots: leen sus cuadernos y el Archivo de casos, piden lo que necesitan y deciden lo de hoy.
# No usan IA ni tocan el código. También con peticiones/derechos.json o a mano desde Actions.
name: Derechos Sociales
on:
  schedule:
    - cron: "29 10 * * *"
  push:
    paths:
      - "peticiones/derechos.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: derechos
  cancel-in-progress: false
jobs:
  cuidar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sacar el repositorio privado
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ciudades-memoria
          token: ${{ secrets.GH_SECRETOS }}
          path: privado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cuidar de los robots
        env:
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
        run: python bots/derechos/derechos.py
      - name: Guardar en el repositorio privado
        if: always()
        env:
          PRIVADO: privado
        run: |
          cd privado
          git config user.name "ciudades-bot"
          git config user.email "ciudades-bot@users.noreply.github.com"
          cd ..
          python -c "from bots.comun import privado; import sys; sys.exit(0 if privado.git_guardar('Derechos Sociales') else 1)"
