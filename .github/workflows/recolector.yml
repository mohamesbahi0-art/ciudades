# Recolector de clips: cada día trae solo, sin que el dueño haga nada, tomas y momentos de GTA 5 y GTA 6 con licencia
# libre (CC BY o CC0) de Internet Archive, que deja bajar sus vídeos a los robots. Los limpia y los guarda en la
# Videoteca con su crédito. También con peticiones/recolector.json. En el registro solo salen cifras.
name: Recolector de clips
on:
  schedule:
    - cron: "3 11 * * *"
    - cron: "33 14 * * *"
    - cron: "33 20 * * *"
    - cron: "33 2 * * *"
  push:
    paths:
      - "peticiones/recolector.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recolector
  cancel-in-progress: false
jobs:
  recoger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Sacar el repositorio privado
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ciudades-memoria
          token: ${{ secrets.GH_SECRETOS }}
          path: privado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          cd privado
          git config user.name "ciudades-bot"
          git config user.email "ciudades-bot@users.noreply.github.com"
      - name: Recoger
        env:
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # la cadena de IA gratis de reserva (cada llave enciende su servicio; sin llave, no pasa nada)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_SECRETOS: ${{ secrets.GH_SECRETOS }}
        run: python bots/central/recolector.py --maximo 15
      - name: Guardar en el repositorio privado
        if: always()
        env:
          PRIVADO: privado
        run: python -c "from bots.comun import privado; import sys; sys.exit(0 if privado.git_guardar('recolector de clips') else 1)"
