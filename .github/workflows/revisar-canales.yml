# Jefes de canal: miran en YouTube qué tiene cada canal (programados, último vídeo, suscriptores). Solo leen, no tocan
# nada. Después la Analista de cuentas repasa cómo va todo. Cada 3 horas, cuando Claude deja peticiones/revisar.json,
# o a mano desde Actions.
name: Revisar canales
on:
  schedule:
    - cron: "37 */3 * * *"
  push:
    paths:
      - "peticiones/revisar.json"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: revisar-canales
  cancel-in-progress: false
jobs:
  revisar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sacar el repositorio privado
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ciudades-memoria
          token: ${{ secrets.GH_SECRETOS }}
          path: privado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Revisar los canales
        env:
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_GTA: ${{ secrets.YT_REFRESH_GTA }}
          YT_ID_GTA: ${{ secrets.YT_ID_GTA }}
          YT_REFRESH_CLIPS: ${{ secrets.YT_REFRESH_CLIPS }}
          YT_ID_CLIPS: ${{ secrets.YT_ID_CLIPS }}
          YT_REFRESH_CURIOS: ${{ secrets.YT_REFRESH_CURIOS }}
          YT_ID_CURIOS: ${{ secrets.YT_ID_CURIOS }}
          YT_REFRESH_VERSUS: ${{ secrets.YT_REFRESH_VERSUS }}
          YT_ID_VERSUS: ${{ secrets.YT_ID_VERSUS }}
          YT_REFRESH_MAPAS: ${{ secrets.YT_REFRESH_MAPAS }}
          YT_ID_MAPAS: ${{ secrets.YT_ID_MAPAS }}
          YT_REFRESH_TERROR: ${{ secrets.YT_REFRESH_TERROR }}
          YT_ID_TERROR: ${{ secrets.YT_ID_TERROR }}
          YT_REFRESH_SOBSHORTS: ${{ secrets.YT_REFRESH_SOBSHORTS }}
          YT_ID_SOBSHORTS: ${{ secrets.YT_ID_SOBSHORTS }}
          YT_REFRESH_NIVSHORTS: ${{ secrets.YT_REFRESH_NIVSHORTS }}
          YT_ID_NIVSHORTS: ${{ secrets.YT_ID_NIVSHORTS }}
        run: python bots/policia/programados.py
      - name: Quitar el aviso de IA de los vídeos ya subidos (no son IA realista)
        continue-on-error: true
        env:
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_GTA: ${{ secrets.YT_REFRESH_GTA }}
          YT_ID_GTA: ${{ secrets.YT_ID_GTA }}
          YT_REFRESH_CLIPS: ${{ secrets.YT_REFRESH_CLIPS }}
          YT_ID_CLIPS: ${{ secrets.YT_ID_CLIPS }}
          YT_REFRESH_CURIOS: ${{ secrets.YT_REFRESH_CURIOS }}
          YT_ID_CURIOS: ${{ secrets.YT_ID_CURIOS }}
          YT_REFRESH_VERSUS: ${{ secrets.YT_REFRESH_VERSUS }}
          YT_ID_VERSUS: ${{ secrets.YT_ID_VERSUS }}
          YT_REFRESH_MAPAS: ${{ secrets.YT_REFRESH_MAPAS }}
          YT_ID_MAPAS: ${{ secrets.YT_ID_MAPAS }}
          YT_REFRESH_TERROR: ${{ secrets.YT_REFRESH_TERROR }}
          YT_ID_TERROR: ${{ secrets.YT_ID_TERROR }}
          YT_REFRESH_SOBSHORTS: ${{ secrets.YT_REFRESH_SOBSHORTS }}
          YT_ID_SOBSHORTS: ${{ secrets.YT_ID_SOBSHORTS }}
          YT_REFRESH_NIVSHORTS: ${{ secrets.YT_REFRESH_NIVSHORTS }}
          YT_ID_NIVSHORTS: ${{ secrets.YT_ID_NIVSHORTS }}
        run: python herramientas/quitar_aviso_ia.py privado/registro/subidas.json 40
      - name: La Jefa de máquinas mira que cada turno pase a su hora
        if: always()
        env:
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
          GH_TOKEN: ${{ github.token }}
        run: python bots/policia/maquinas.py
      - name: El Archivo de casos apunta cada fallo y cada arreglo
        if: always()
        env:
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
        run: python bots/policia/casos.py
      - name: La Analista repasa cómo van las cuentas
        if: always()
        env:
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # la cadena de IA gratis de reserva (cada llave enciende su servicio; sin llave, no pasa nada)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python bots/influencers/analista.py
      - name: El Contador de redes saca los números para los gráficos de la app
        if: always()
        env:
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
        run: python bots/influencers/contador.py
      - name: Guardar en el repositorio privado
        if: always()
        env:
          PRIVADO: privado
        run: |
          cd privado
          git config user.name "ciudades-bot"
          git config user.email "ciudades-bot@users.noreply.github.com"
          cd ..
          python -c "from bots.comun import privado; import sys; sys.exit(0 if privado.git_guardar('revisión de canales') else 1)"
  # La Contable de Instagram: lee por la vía oficial de Meta las cifras de los reels de las cuentas conectadas (solo
  # leer), renueva sus permisos una vez por semana y comprueba los avisos de Meta (baja o borrado) que dejó el Buzón de
  # vuelta. Va en su propio trabajo, después del de arriba. NO comparte cola con «Conectar redes»: GitHub cancela lo que
  # espera en una cola cuando llega otro, y se perdería la petición del dueño. En su lugar, la Contable deja en paz la
  # cuenta que se esté conectando (estado/conexion_redes.json «esperando») y las dos versiones de
  # estado/redes/conexiones.json se juntan por cuenta (privado.fusionar). Sin cuentas conectadas, termina en segundos.
  instagram:
    needs: revisar
    if: ${{ !cancelled() && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sacar el repositorio privado
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ciudades-memoria
          token: ${{ secrets.GH_SECRETOS }}
          path: privado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Herramientas
        run: |
          pip install -q pynacl
          cd privado
          git config user.name "ciudades-bot"
          git config user.email "ciudades-bot@users.noreply.github.com"
      - name: La Contable de Instagram lee las cifras de los reels y renueva los permisos
        # renovar no necesita IG_APP_ID ni IG_APP_SECRET: aquí no están
        env:
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
          GH_SECRETOS: ${{ secrets.GH_SECRETOS }}
          VUELTA_LLAVE: ${{ secrets.VUELTA_LLAVE }}
          IG_TOKEN_1: ${{ secrets.IG_TOKEN_1 }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
          IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
          IG_TOKEN_5: ${{ secrets.IG_TOKEN_5 }}
          IG_TOKEN_6: ${{ secrets.IG_TOKEN_6 }}
          IG_TOKEN_7: ${{ secrets.IG_TOKEN_7 }}
          IG_TOKEN_8: ${{ secrets.IG_TOKEN_8 }}
          IG_TOKEN_9: ${{ secrets.IG_TOKEN_9 }}
          IG_TOKEN_10: ${{ secrets.IG_TOKEN_10 }}
        run: python herramientas/estadisticas_instagram.py
      - name: Guardar en el repositorio privado
        if: always()
        env:
          PRIVADO: privado
        run: |
          python -c "from bots.comun import privado; import sys; sys.exit(0 if privado.git_guardar('cifras de instagram') else 1)"
