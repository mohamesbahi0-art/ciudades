# La Discoteca: busca música de verdad de dominio público (Internet Archive, CC0), el oído de la Policía (Gemini) escucha un
# trozo de cada pieza y solo se quedan las que sirven de fondo. Van a la release «musica» del repositorio privado y la
# fábrica las usa en sus vídeos. Una vez al mes busca piezas nuevas; también con peticiones/discoteca.json.
name: Discoteca
# PARADA: archive.org trae música de videojuegos mal etiquetada como libre. No vuelve a correr sola hasta que solo
# use fuentes fiables (pendiente con el dueño).
on:
  push:
    paths:
      - "peticiones/discoteca.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discoteca
  cancel-in-progress: false
jobs:
  llenar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Sacar el repositorio privado
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ciudades-memoria
          token: ${{ secrets.GH_SECRETOS }}
          path: privado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
      - name: Llenar la discoteca
        env:
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # la cadena de IA gratis de reserva (cada llave enciende su servicio; sin llave, no pasa nada)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_SECRETOS: ${{ secrets.GH_SECRETOS }}
        run: |
          por=$(python -c "import json;print(int(json.load(open('peticiones/discoteca.json')).get('por_ambiente',6)))" 2>/dev/null || echo 6)
          probar=$(python -c "import json;print(int(json.load(open('peticiones/discoteca.json')).get('probar',10)))" 2>/dev/null || echo 10)
          python bots/central/discoteca.py --por-ambiente "$por" --probar "$probar"
      - name: Guardar en el repositorio privado
        if: always()
        env:
          PRIVADO: privado
        run: |
          cd privado
          git config user.name "ciudades-bot"
          git config user.email "ciudades-bot@users.noreply.github.com"
          cd ..
          python -c "from bots.comun import privado; import sys; sys.exit(0 if privado.git_guardar('discoteca: música libre') else 1)"
