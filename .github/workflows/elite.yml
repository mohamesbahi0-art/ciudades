# La Élite: los tres mandamases (Espía, Estratega y Arquitecto). Cada HORA miran todo desde arriba y se meten
# cuando algo falla una y otra vez: lección al robot culpable, palanca (un ajuste dentro de sus límites), reforma u
# obra para Claude. Miden cada cambio y deshacen el que empeora. Trabajan en GitHub: no dependen del plan del dueño.
name: Élite
on:
  schedule:
    - cron: "27 * * * *"
  push:
    paths:
      - "peticiones/elite.json"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: elite
  cancel-in-progress: false
jobs:
  elite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sacar el repositorio privado
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ciudades-memoria
          token: ${{ secrets.GH_SECRETOS }}
          path: privado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Herramientas
        run: |
          pip install -q -r requirements.txt
          cd privado
          git config user.name "ciudades-bot"
          git config user.email "ciudades-bot@users.noreply.github.com"
      - name: Vigilar, decidir y ejecutar
        env:
          PRIVADO: privado
          MEMORIA_DIR: privado/memoria
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bots/elite/elite.py
      - name: Guardar en el repositorio privado
        if: always()
        env:
          PRIVADO: privado
        run: |
          python -c "from bots.comun import privado; import sys; sys.exit(0 if privado.git_guardar('élite: repaso de cada 2 horas') else 1)"
