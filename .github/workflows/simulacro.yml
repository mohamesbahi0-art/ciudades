# Simulacro: cada vez que cambia el código de los bots, una ronda completa de la fábrica con IA, dibujos y subidas de
# mentira (sin secretos ni repositorio privado). Si algo se rompe, se ve aquí antes de que llegue la ronda de verdad.
name: Simulacro
on:
  push:
    paths:
      - "bots/**"
      - "herramientas/**"
      - "pruebas/**"
      - "vuelta/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulacro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Herramientas
        run: |
          sudo apt-get update -qq || true   # un almacén ajeno de la máquina de GitHub caído no para el turno
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-inter
          pip install -q -r requirements.txt
          npm install --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
      - name: Ronda de mentira
        run: |
          cp -r pruebas/privado_ejemplo /tmp/privado
          PRIVADO=/tmp/privado MEMORIA_DIR=/tmp/privado/memoria python pruebas/simulacro.py --maximo 3
      - name: Turno de mentira del estudio de animación
        run: |
          rm -rf /tmp/privado2 && cp -r pruebas/privado_ejemplo /tmp/privado2
          PRIVADO=/tmp/privado2 MEMORIA_DIR=/tmp/privado2/memoria python pruebas/simulacro_estudio.py
      - name: Radar de nichos de mentira
        run: |
          rm -rf /tmp/privado3 && cp -r pruebas/privado_ejemplo /tmp/privado3
          PRIVADO=/tmp/privado3 MEMORIA_DIR=/tmp/privado3/memoria python pruebas/simulacro_radar.py
      - name: Turno de mentira del formato «ciencia» (Wist je dat)
        run: |
          rm -rf /tmp/privado-ciencia && cp -r pruebas/privado_ejemplo /tmp/privado-ciencia
          PRIVADO=/tmp/privado-ciencia MEMORIA_DIR=/tmp/privado-ciencia/memoria python pruebas/simulacro_ciencia.py
      - name: Clips con licencia libre (Portero, narración, crédito y rama temporal)
        run: python pruebas/simulacro_clips.py
      - name: Jurado popular, Coliseo y cerebro de pago de mentira
        run: |
          python pruebas/simulacro_jurado.py
          python pruebas/simulacro_coliseo.py
          python pruebas/simulacro_claude.py
      - name: Videoteca de juego (Archivero, versus en pantalla partida y noticias con clips)
        run: python pruebas/simulacro_videoteca.py
      - name: Recolector de clips (Internet Archive de mentira, licencias, tomas y momento hasta su Short)
        run: python pruebas/simulacro_recolector.py
      - name: Juzga mi vídeo (vídeo del dueño por el Jurado, el Juzgado y el Coliseo, o con sus arreglos)
        run: python pruebas/simulacro_ventanilla.py
      - name: Constructor de canales (ficha, configuración, foto y banner de un canal y una cuenta nuevos)
        run: python pruebas/simulacro_constructor.py
      - name: Presentador de directos (el directo de la semana de cada cuenta encendida)
        run: python pruebas/simulacro_directos.py
      - name: Canal de mapas (Archivero, Cartógrafo y un vídeo de bolas-país dibujado de verdad)
        run: python pruebas/simulacro_bolas.py
      - name: Formato hipnótico (historia de terror con bolas de neón; gancho en el primer fotograma y plano nuevo cada 3 s)
        run: python pruebas/simulacro_hipnotico.py
      - name: Taller de los Mecánicos (arrancar, repetir, descansar, limpiar y dejar el parte)
        run: python pruebas/simulacro_mecanicos.py
      - name: Arreglos (un vídeo suspendido por poco se rehace con sus fallos; sin juez, espera; la pausa de la app)
        run: python pruebas/simulacro_arreglos.py
      - name: La Élite (parte general, palancas con límites, reforma, obra, deshacer lo que empeora y respeto al dueño)
        run: python pruebas/simulacro_elite.py
      - name: El Cerebro (su manual por formato, aprender, pensar, medir, reparar dibujos y seguir si un paso falla)
        run: python pruebas/simulacro_cerebro.py
      - name: Cadena de IA gratis y Sala de espera (jueces suplentes; nada se aprueba sin un juez de primera)
        run: |
          python pruebas/simulacro_cadena.py
          python pruebas/simulacro_espera.py
      - name: Investigador de webs (portero, cola, elegir y guardar sin red; la caja, su vigilante, el turno y capturas.yml)
        run: |
          python pruebas/simulacro_capturas.py
          python pruebas/simulacro_caja.py
      - name: Cifras de Instagram (solo leer) y el buzón de vuelta del permiso
        run: |
          python pruebas/simulacro_instagram.py
          node pruebas/simulacro_vuelta.mjs
