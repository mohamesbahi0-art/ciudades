# Simulacro: cada vez que cambia el código de los bots, una ronda completa de la fábrica con IA, dibujos y subidas de
# mentira (sin secretos ni repositorio privado). Si algo se rompe, se ve aquí antes de que llegue la ronda de verdad.
name: Simulacro
on:
  push:
    paths:
      - "bots/**"
      - "herramientas/**"
      - "pruebas/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulacro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-inter
          pip install -q -r requirements.txt
          npm install --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
      - name: Ronda de mentira
        run: |
          cp -r pruebas/privado_ejemplo /tmp/privado
          PRIVADO=/tmp/privado MEMORIA_DIR=/tmp/privado/memoria python pruebas/simulacro.py --maximo 3
      - name: Turno de mentira del estudio de animación
        run: |
          rm -rf /tmp/privado2 && cp -r pruebas/privado_ejemplo /tmp/privado2
          PRIVADO=/tmp/privado2 MEMORIA_DIR=/tmp/privado2/memoria python pruebas/simulacro_estudio.py
      - name: Radar de nichos de mentira
        run: |
          rm -rf /tmp/privado3 && cp -r pruebas/privado_ejemplo /tmp/privado3
          PRIVADO=/tmp/privado3 MEMORIA_DIR=/tmp/privado3/memoria python pruebas/simulacro_radar.py
